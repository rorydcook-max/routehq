        en: Mark existing scratches (S), dents (D), cracks (C) and missing items (M). Take dated photos of all four sides, the dashboard (odometer and fuel), the interior and any damage, at both handover and return.
        local: Vorhandene Kratzer (K), Dellen (D), Risse (R) und fehlende Teile (F) markieren. Bei Übergabe und Rückgabe datierte Fotos aller vier Seiten, des Armaturenbretts (Kilometer- und Tankstand), des Innenraums und aller Schäden aufnehmen.
