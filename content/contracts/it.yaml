  - id: annex_b
    title:
      en: "Annex B: Damage and replacement price list"
      local: "Allegato B: Listino danni e sostituzioni"
    pricelist: true
    clauses:
      - id: annex_b.1
        en: Agreed prices for common damage and lost items, based on typical repair costs. Damage not listed is charged per section 12. Where a damage waiver applies, the Renter never pays more than the excess.
        local: Prezzi concordati per danni e smarrimenti comuni, basati sui costi tipici di riparazione. I danni non elencati sono addebitati secondo la sezione 12. Se si applica la limitazione di responsabilità, il Conduttore non paga mai più della franchigia.
    price_rows:
