# Lokalfleet vehicle rental agreement — PHILIPPINES (English + Filipino).
# Built from master.en.yaml (same section ids, clause ids, field keys, rows and conditions).
# Clauses marked `country: true` are adapted to Philippine law. Philippines-only clauses end in "_cc".
# English prevails (general.4): English is an official language under the 1987 Constitution (Art. XIV, Sec. 7)
# and is the usual language of written contracts in the Philippines.
#
# Placeholders: {{key}} is filled from the operator's form. An empty value prints as a blank line to write on.
# Conditions on a clause:
#   if: key                 shown only when the key has a value
#   unless: key             shown only when the key is empty
#   when: {key: value}      shown only when the key equals the value (value may be a list)
# Field rows (`fields`) print as a two-column table: label | value (or a blank line).
# Keys starting with "renter_", "driver2_", "out_", "in_" are never in the form: always blank lines for the
# operator and renter to complete at handover.

country: PH
locale: fil
language: Filipino
currency: PHP
prevailing_language: { en: English, local: Ingles }
local_language: { en: Filipino, local: Filipino }
country_name: { en: Philippines, local: Pilipinas }
currency_name: { en: Philippine pesos, local: piso ng Pilipinas }
jurisdiction: { en: the Republic of the Philippines, local: Republika ng Pilipinas }
court_place: { en: "the city or municipality where the vehicle was rented", local: "lungsod o bayan kung saan inupahan ang sasakyan" }
words:
  per_day: { en: per day, local: bawat araw }
  per_week: { en: per week, local: bawat linggo }
  per_month: { en: per month, local: bawat buwan }
  day: { en: day, local: araw }
  month: { en: month, local: buwan }
  days: { en: days, local: araw }
  business_days: { en: business days after return, local: "araw ng trabaho matapos ibalik" }
  car: { en: Car, local: Kotse }
  motorbike: { en: Motorbike / scooter, local: "Motorsiklo / scooter" }
  ins_compulsory: { en: "Compulsory Third Party Liability (CTPL) insurance only", local: "Compulsory Third Party Liability (CTPL) insurance lamang" }
  ins_third_party: { en: "CTPL + voluntary third-party liability insurance", local: "CTPL + karagdagang (voluntary) third-party liability insurance" }
  ins_comprehensive: { en: "Comprehensive insurance (own damage, theft and third-party liability)", local: "Comprehensive insurance (pinsala sa sasakyan, pagnanakaw at third-party liability)" }
  free: { en: Free, local: Libre }
  payment_default: { en: "Cash, bank transfer, GCash / Maya or QR payment", local: "Cash, bank transfer, GCash / Maya o QR payment" }
  blank_hint: { en: "(fill in)", local: "(punan)" }
sources:
  - url: https://lawphil.net/statutes/repacts/ra1964/ra_4136_1964.html
    supports: "RA 4136 (Land Transportation and Traffic Code) Sec. 21: licensed foreign tourists may drive during but not after 90 days of their stay; Sec. 19 general licence duty (renter.2)."
  - url: https://lawphil.net/statutes/repacts/ra2010/ra_10054_2010.html
    supports: "RA 10054 (Motorcycle Helmet Act of 2009) Sec. 3: all riders and back riders must wear standard helmets at all times; Sec. 6: only PS/ICC-marked helmets may be sold (use.2)."
  - url: https://lawphil.net/statutes/repacts/ra2015/ra_10666_2015.html
    supports: "RA 10666 (Children's Safety on Motorcycles Act) Sec. 4: a child may ride on busy roads only if feet reach the foot pegs, arms reach around the rider's waist and a standard helmet is worn (use.2)."
  - url: https://lawphil.net/statutes/repacts/ra1999/ra_8750_1999.html
    supports: "RA 8750 (Seat Belts Use Act of 1999): drivers and front-seat passengers must wear seat belts (use.3)."
  - url: https://lawphil.net/statutes/repacts/ra2019/ra_11229_2019.html
    supports: "RA 11229 (Child Safety in Motor Vehicles Act): children 12 and below may not sit in front unless at least 150 cm tall and belted; child restraint systems; children not left unattended (use.3)."
  - url: https://lawphil.net/statutes/repacts/ra2013/ra_10586_2013.html
    supports: "RA 10586 (Anti-Drunk and Drugged Driving Act of 2013): driving under the influence of alcohol or drugs is prohibited (use.4)."
  - url: https://lawphil.net/statutes/repacts/ra2016/ra_10913_2016.html
    supports: "RA 10913 (Anti-Distracted Driving Act) Secs. 4-5: no calls, texting or device use while driving or stopped at a red light, except hands-free use that does not block the driver's line of sight (use.4)."
  - url: https://lawphil.net/statutes/repacts/ra2013/ra_10607_2013.html
    supports: "RA 10607 (amended Insurance Code): compulsory motor vehicle liability insurance chapter; CTPL needed to register a vehicle with the LTO (vehicle.2, insurance.1)."
  - url: https://elibrary.judiciary.gov.ph/thebookshelf/showdocsfriendly/10/57714
    supports: "LTFRB MC 2011-008 (Sept. 5, 2011): private vehicles rented out are exempt from the LTFRB franchise circular (MC 98-027) if under a long-term lease or exclusively used and driven by the lessee or the lessee's authorised representative; other rent-a-car services still need a franchise (vehicle.2)."
  - url: https://lawphil.net/statutes/repacts/ra2012/ra_10173_2012.html
    supports: "RA 10173 (Data Privacy Act of 2012) Secs. 11, 12, 13, 16: proportionality, retention only as long as necessary, lawful bases incl. contract and consent, data subject rights (data.1, data.2)."
  - url: https://lawphil.net/statutes/repacts/ra2024/ra_11983_2024.html
    supports: "RA 11983 (New Philippine Passport Act, 2024) Sec. 13: only the DFA may confiscate a passport; Sec. 22(a): confiscating, retaining or withholding a DFA-issued passport without legal authority is punished by 12 years and 1 day or more of imprisonment and a PHP 1-2 million fine (deposit.4)."
  - url: https://lawphil.net/statutes/repacts/ra2016/ra_10883_2016.html
    supports: "RA 10883 (New Anti-Carnapping Act of 2016) Sec. 3: carnapping is taking a motor vehicle belonging to another, with intent to gain, without consent; heavy penalties (period.nonreturn_cc)."
  - url: https://lawphil.net/judjuris/juri2004/jun2004/gr_148233_2004.html
    supports: "People v. Bustinera, G.R. No. 148233 (2004): keeping a vehicle against the owner's wishes after the agreed return turned lawful possession unlawful and was carnapping (period.4, period.nonreturn_cc)."
  - url: https://lawphil.net/statutes/repacts/ra1949/ra_386_1949.html
    supports: "Civil Code (RA 386): lease of things (Arts. 1642 ff.; lessee returns the thing as received save ordinary wear, Art. 1665; lessee liable for loss or deterioration unless without fault, Art. 1667); courts may reduce iniquitous penalties (Arts. 1229, 2227); contracts in a language a party does not understand (Art. 1332) (general.fees_cc, general.4)."
  - url: https://lawphil.net/statutes/repacts/ra1992/ra_7394_1992.html
    supports: "RA 7394 (Consumer Act of the Philippines) Art. 52: unfair or unconscionable sales acts are prohibited (general.fees_cc)."
  - url: https://lawphil.net/statutes/repacts/ra1991/ra_7160_1991.html
    supports: "RA 7160 (Local Government Code): Katarungang Pambarangay (barangay conciliation) as a step before some court cases between individuals (general.5)."
  - url: https://lawphil.net/consti/cons1987.html
    supports: "1987 Constitution Art. XIV Sec. 7: Filipino and English are the official languages (general.4)."
  - url: https://ltoportal.ph/can-foreign-tourists-drive-in-the-philippines
    supports: "Secondary: foreign licence usable for up to 90 days from arrival if in English or with an official embassy translation; IDP accepted with the original licence; carry passport as proof of entry date (renter.2)."
  - url: https://buenosairespe.dfa.gov.ph/comunidad-filipina/87-comunidad-filipina/240-driving-in-the-philippines
    supports: "DFA (Philippine Embassy) guidance: RA 4136 Sec. 21 90-day rule; non-English licences need an official English translation from the issuing country's embassy (renter.2)."
  - url: https://www.autoindustriya.com/features/what-can-you-drive-under-the-new-license-codes.html
    supports: "Secondary: LTO DL codes since 2021: A motorcycles, A1 tricycles, B cars/light vehicles up to 8 seats, B1 9+ seats, B2 goods vehicles up to 3,500 kg (renter.2)."
  - url: https://www.topgear.com.ph/features/feature-articles/anti-drunk-and-drugged-driving-law-explainer-a4682-20230821-lfrm
    supports: "Secondary: under RA 10586 rules, private vehicles up to 4,500 kg: BAC below 0.05%; trucks, buses, motorcycles and PUVs: 0.0% (use.2, use.4)."
  - url: https://www.bworldonline.com/?p=673636
    supports: "Secondary: Supreme Court partially lifted the 2022 TRO on No Contact Apprehension in 2025 for the MMDA (LGU ordinances still restrained at the time); notices go to the registered owner (fines.2, deposit.3)."
  - url: https://alburolaw.beehiiv.com/p/what-is-compulsory-third-party-insurance
    supports: "Secondary: Insurance Code Sec. 387; CTPL covers death or bodily injury of third parties and is the minimum cover for LTO registration (insurance.1)."
  - url: https://visor.ph/traffic/whats-the-difference-between-ctpl-and-comprehensive-insurance-anyway/
    supports: "Secondary: CTPL does not cover the insured vehicle or the driver; comprehensive covers own damage and theft; terms vary by policy (insurance.1, insurance.5)."
  - url: https://www.moneymax.ph/car-insurance/articles/acts-of-god-coverage
    supports: "Secondary: flood, typhoon and earthquake damage ('Acts of Nature / Acts of God') is usually an optional add-on to comprehensive car insurance (damage.nature_cc)."
  - url: https://pamasahe.com/posts/starlite-ferries-issues-vehicle-requirements-for-holy-week-travelers
    supports: "Secondary: ferry operators ask for the vehicle's OR/CR and an authorisation letter from the owner when someone else ships the vehicle (area.2)."
  - url: https://ptvnews.ph/doj-indicts-8-persons-estafa-raps-rent-sangla-modus/
    supports: "Secondary: 'rent-sangla' (renting and pawning cars) has been charged as syndicated estafa; charge depends on facts (period.nonreturn_cc)."
title:
  en: Vehicle Rental Agreement
  local: Kasunduan sa Pag-upa ng Sasakyan
subtitle:
  en: "Car, motorbike and scooter rental. {{country_name}}"
  local: "Pag-upa ng kotse, motorsiklo at scooter. {{country_name}}"
footer:
  en: "Vehicle rental agreement · {{business_name}}"
  local: "Kasunduan sa pag-upa ng sasakyan · {{business_name}}"
page_words: { page: Page, of: of }

sections:

  - id: parties
    title: { en: "1. The parties", local: "1. Ang mga partido" }
    fields:
      - { key: business_name, en: "Owner (rental business)", local: "May-ari (negosyo ng paupahan)" }
      - { key: business_reg_no, en: "DTI / SEC registration, Mayor's permit or TIN", local: "Rehistro sa DTI / SEC, Mayor's permit o TIN" }
      - { key: business_address, en: "Business address", local: "Address ng negosyo" }
      - { key: business_phone, en: "Phone / Viber / WhatsApp", local: "Telepono / Viber / WhatsApp" }
      - { key: business_email, en: "Email", local: "Email" }
    clauses:
      - id: parties.1
        en: 'This agreement is made on {{renter_contract_date}} between the rental business named above (the "Owner") and the person named in section 2 (the "Renter"). Where there is more than one renter or driver, each of them is jointly responsible for every obligation in this agreement.'
        local: 'Ang kasunduang ito ay ginawa noong {{renter_contract_date}} sa pagitan ng negosyong paupahan na nakapangalan sa itaas (ang "May-ari") at ng taong nakapangalan sa seksyon 2 (ang "Umuupa"). Kung higit sa isa ang umuupa o drayber, bawat isa sa kanila ay sama-samang mananagot (solidarily liable) sa lahat ng obligasyon sa kasunduang ito.'

  - id: renter
    title: { en: "2. The Renter and drivers", local: "2. Ang Umuupa at mga drayber" }
    fields:
      - { key: renter_name, en: "Full name (as on passport or ID)", local: "Buong pangalan (gaya ng nasa pasaporte o ID)" }
      - { key: renter_nationality, en: "Nationality", local: "Nasyonalidad" }
      - { key: renter_dob, en: "Date of birth", local: "Petsa ng kapanganakan" }
      - { key: renter_id_no, en: "Passport or government ID number", local: "Numero ng pasaporte o government ID" }
      - { key: renter_home_address, en: "Home address", local: "Address ng tirahan" }
      - { key: renter_local_address, en: "Local address during the rental (hotel / resort / condo)", local: "Address habang nagrerenta (hotel / resort / condo)" }
      - { key: renter_phone, en: "Phone / Viber / WhatsApp", local: "Telepono / Viber / WhatsApp" }
      - { key: renter_email, en: "Email", local: "Email" }
      - { key: renter_licence, en: "Driving licence number, code / class and issuing country", local: "Numero ng lisensya, code / klase at bansang nag-isyu" }
      - { key: renter_licence_expiry, en: "Licence expiry date", local: "Petsa ng pag-expire ng lisensya" }
      - { key: renter_idp, en: "International Driving Permit or official translation (number / not required)", local: "International Driving Permit o opisyal na salin (numero / hindi kailangan)" }
      - { key: renter_emergency, en: "Emergency contact (name and phone)", local: "Contact sa emergency (pangalan at telepono)" }
      - { key: driver2_details, en: "Additional driver (name, ID, licence), if any", local: "Karagdagang drayber (pangalan, ID, lisensya), kung mayroon" }
    clauses:
      - id: renter.1
        en: "The Renter confirms that the details above are true and complete, and that every person who will drive or ride the vehicle is named here. Only the Renter and any additional driver named above may drive or ride the vehicle."
        local: "Pinatutunayan ng Umuupa na totoo at kumpleto ang mga detalye sa itaas, at nakapangalan dito ang bawat taong magmamaneho o sasakay bilang drayber ng sasakyan. Ang Umuupa at ang karagdagang drayber na nakapangalan sa itaas lamang ang maaaring magmaneho ng sasakyan."
      - id: renter.2
        en: "Every driver must hold a valid driving licence for this type of vehicle and carry it while driving. A foreign licence may be used only during the first 90 days of the driver's stay in the Philippines. It must be in English, or be carried with an official English translation or an International Driving Permit. The driver should also carry their passport as proof of arrival date. After 90 days, a Philippine licence is needed. A Philippine licence must show the right code: A for motorcycles and scooters, B for cars. A car licence does not allow a person to ride a motorbike."
        local: "Bawat drayber ay dapat may balidong lisensya para sa ganitong uri ng sasakyan at dala ito habang nagmamaneho. Ang lisensyang galing sa ibang bansa ay magagamit lamang sa unang 90 araw ng pananatili ng drayber sa Pilipinas. Dapat ito ay nasa Ingles, o may kasamang opisyal na salin sa Ingles o International Driving Permit. Dapat ding dala ng drayber ang kanyang pasaporte bilang patunay ng petsa ng pagdating. Pagkalipas ng 90 araw, kailangan na ng lisensyang Pilipino. Ang lisensyang Pilipino ay dapat may tamang code: A para sa motorsiklo at scooter, B para sa kotse. Ang lisensya para sa kotse ay hindi nagpapahintulot na magmaneho ng motorsiklo."
        country: true

  - id: vehicle
    title: { en: "3. The vehicle", local: "3. Ang sasakyan" }
    fields:
      - { key: vehicle_type_label, en: "Type", local: "Uri" }
      - { key: vehicle_make_model, en: "Make and model", local: "Brand at modelo" }
      - { key: vehicle_year, en: "Year", local: "Taon" }
      - { key: vehicle_plate, en: "Plate number", local: "Numero ng plaka" }
      - { key: vehicle_colour, en: "Colour", local: "Kulay" }
      - { key: renter_vin, en: "Chassis / engine number", local: "Numero ng chassis / makina" }
      - { key: out_odometer, en: "Odometer at handover", local: "Odometer sa pag-abot" }
      - { key: out_fuel, en: "Fuel / battery level at handover", local: "Antas ng gasolina / baterya sa pag-abot" }
      - { key: renter_accessories, en: "Accessories handed over (helmets, keys, child seat, phone holder, etc.)", local: "Mga kagamitang iniabot (helmet, susi, child seat, phone holder, atbp.)" }
    clauses:
      - id: vehicle.1
        en: "The Owner rents the vehicle described above, with the accessories listed, to the Renter for the rental period and on the terms of this agreement. The vehicle remains the property of the Owner at all times."
        local: "Pinauupahan ng May-ari sa Umuupa ang sasakyang inilarawan sa itaas, kasama ang mga nakalistang kagamitan, para sa panahon ng pag-upa at ayon sa mga tuntunin ng kasunduang ito. Ang sasakyan ay mananatiling pag-aari ng May-ari sa lahat ng oras."
      - id: vehicle.2
        en: "The Owner confirms that the vehicle is registered with the Land Transportation Office (LTO), that its registration (OR/CR) and Compulsory Third Party Liability (CTPL) insurance are valid for the whole rental period, that a copy of the OR/CR is kept in the vehicle, and that it is handed over in a roadworthy condition. This is a self-drive rental: the Owner does not provide a driver, and only the persons named in section 2 may drive. The Owner holds any business permit, franchise or accreditation the law requires for this rental."
        local: "Pinatutunayan ng May-ari na ang sasakyan ay rehistrado sa Land Transportation Office (LTO), na balido ang rehistro nito (OR/CR) at ang Compulsory Third Party Liability (CTPL) insurance sa buong panahon ng pag-upa, na may kopya ng OR/CR sa loob ng sasakyan, at na ito ay iniabot sa maayos at ligtas na kondisyon. Ito ay self-drive na pag-upa: hindi nagbibigay ng drayber ang May-ari, at ang mga nakapangalan lamang sa seksyon 2 ang maaaring magmaneho. Hawak ng May-ari ang anumang business permit, prangkisa o akreditasyong hinihingi ng batas para sa pag-upang ito."
        country: true

  - id: period
    title: { en: "4. Rental period, pickup and return", local: "4. Panahon ng pag-upa, pagkuha at pagbabalik" }
    fields:
      - { key: renter_start, en: "Start (date and time)", local: "Simula (petsa at oras)" }
      - { key: renter_end, en: "End (date and time)", local: "Katapusan (petsa at oras)" }
      - { key: renter_pickup_place, en: "Pickup / delivery place", local: "Lugar ng pagkuha / paghatid" }
      - { key: renter_return_place, en: "Return / collection place", local: "Lugar ng pagbabalik / pagkuha" }
    clauses:
      - id: period.1
        en: "The Renter must return the vehicle at the agreed place, date and time. An extension is valid only when the Owner agrees to it in writing (a message is enough) and the extra rent is paid."
        local: "Dapat ibalik ng Umuupa ang sasakyan sa napagkasunduang lugar, petsa at oras. Ang extension ay balido lamang kung pumayag ang May-ari nang nakasulat (sapat na ang isang mensahe) at nabayaran ang dagdag na upa."
      - id: period.2
        if: late_hour_fee
        en: "Late return: after a grace period of {{late_grace_minutes}} minutes, each started hour costs {{currency}} {{late_hour_fee}}. A return more than {{late_full_day_hours}} hours late is charged as an extra full day at the daily rate."
        local: "Huling pagbabalik: pagkatapos ng palugit na {{late_grace_minutes}} minuto, bawat nasimulang oras ay may bayad na {{currency}} {{late_hour_fee}}. Ang pagbabalik na huli nang higit sa {{late_full_day_hours}} oras ay sisingilin bilang dagdag na buong araw sa arawang upa."
      - id: period.3
        unless: late_hour_fee
        en: "Late return: a return more than one hour late may be charged as an extra day at the daily rate."
        local: "Huling pagbabalik: ang pagbabalik na huli nang higit sa isang oras ay maaaring singilin bilang dagdag na araw sa arawang upa."
      - id: period.4
        en: "If the vehicle is not returned and the Renter cannot be reached within 24 hours of the end time, the Owner may treat the vehicle as stolen, report it to the police and recover it, at the Renter's cost."
        local: "Kung hindi naibalik ang sasakyan at hindi makontak ang Umuupa sa loob ng 24 oras mula sa oras ng katapusan, maaaring ituring ng May-ari na ninakaw ang sasakyan, iulat ito sa pulis at bawiin ito, sa gastos ng Umuupa."
      - id: period.nonreturn_cc
        en: "The Renter must not sell, pawn (isangla), mortgage, sublease, lend or hand over the vehicle, its plates or its OR/CR to anyone. Keeping the vehicle against the Owner's wishes after the rental ends, or disposing of it, may be a crime under Philippine law, such as carnapping (RA 10883) or estafa, depending on the facts. The Owner may report it to the police, including the PNP Highway Patrol Group."
        local: "Hindi dapat ibenta, isangla, iprenda, ipaupa sa iba, ipahiram o ibigay ng Umuupa sa kahit sino ang sasakyan, ang plaka nito o ang OR/CR nito. Ang pagtatago o hindi pagbabalik ng sasakyan laban sa kagustuhan ng May-ari pagkatapos ng pag-upa, o ang pagbebenta o pagsangla nito, ay maaaring isang krimen sa ilalim ng batas ng Pilipinas, gaya ng carnapping (RA 10883) o estafa, depende sa mga pangyayari. Maaari itong iulat ng May-ari sa pulis, kabilang ang PNP Highway Patrol Group."

  - id: charges
    title: { en: "5. Rent and payment", local: "5. Upa at bayad" }
    fields:
      - { key: rate_text, en: "Rental rate", local: "Halaga ng upa" }
      - { key: renter_total, en: "Total rent for this booking", local: "Kabuuang upa para sa booking na ito" }
      - { key: delivery_fee_text, en: "Delivery / collection fee", local: "Bayad sa paghatid / pagkuha" }
      - { key: payment_methods, en: "Payment methods accepted", local: "Mga tinatanggap na paraan ng bayad" }
    clauses:
      - id: charges.1
        en: "The Renter pays the rent stated above in advance, unless the Owner agrees otherwise in writing. Prices are in {{currency_name}}."
        local: "Babayaran ng Umuupa nang paunang bayad ang upang nakasaad sa itaas, maliban kung pumayag ang May-ari nang nakasulat sa ibang ayos. Ang mga presyo ay nasa {{currency_name}}."
      - id: charges.2
        when: { rate_period: month }
        en: "Monthly rentals: rent is paid monthly in advance on the same day each month. A payment more than 3 days late allows the Owner to end the rental and collect the vehicle (section 15)."
        local: "Buwanang pag-upa: ang upa ay binabayaran buwan-buwan nang pauna sa parehong petsa bawat buwan. Kung huli ang bayad nang higit sa 3 araw, maaaring tapusin ng May-ari ang pag-upa at kunin ang sasakyan (seksyon 15)."
      - id: charges.3
        en: "Extras (child seats, delivery, additional drivers, phone holders, insurance upgrades and similar) cost what is written in this agreement or what the Owner confirmed in writing before the rental."
        local: "Ang mga dagdag (child seat, paghatid, karagdagang drayber, phone holder, dagdag na insurance at iba pa) ay may halagang nakasulat sa kasunduang ito o kinumpirma ng May-ari nang nakasulat bago ang pag-upa."

  - id: deposit
    title: { en: "6. Security deposit", local: "6. Security deposit" }
    fields:
      - { key: deposit_text, en: "Deposit", local: "Deposit" }
      - { key: renter_deposit_method, en: "Paid by (cash / transfer / card hold)", local: "Paraan ng bayad (cash / transfer / card hold)" }
      - { key: deposit_return_text, en: "Returned within", local: "Ibabalik sa loob ng" }
    clauses:
      - id: deposit.1
        en: "The deposit secures the Renter's obligations: unpaid rent, damage up to the amount the Renter is liable for, fuel, mileage, cleaning, late return, lost keys or accessories, traffic fines and any other amount owed under this agreement."
        local: "Ang deposit ay garantiya para sa mga obligasyon ng Umuupa: hindi nabayarang upa, pinsala hanggang sa halagang pananagutan ng Umuupa, gasolina, mileage, paglilinis, huling pagbabalik, nawalang susi o kagamitan, multa sa trapiko at anumang ibang halagang dapat bayaran sa ilalim ng kasunduang ito."
      - id: deposit.2
        en: "The Owner returns the deposit, less any amounts properly deducted, after the vehicle has been returned and checked. The Owner gives the Renter a written list of any deduction with photos, receipts or quotes. If the amounts owed are more than the deposit, the Renter pays the difference within 7 days of being told."
        local: "Ibabalik ng May-ari ang deposit, bawas ang mga halagang wastong ibinawas, matapos maibalik at masuri ang sasakyan. Bibigyan ng May-ari ang Umuupa ng nakasulat na listahan ng anumang bawas, kasama ang mga litrato, resibo o quotation. Kung mas malaki ang halagang dapat bayaran kaysa sa deposit, babayaran ng Umuupa ang kakulangan sa loob ng 7 araw mula nang sabihan."
      - id: deposit.3
        en: "Traffic violation notices, including No Contact Apprehension notices, are sent to the registered owner and often arrive after a rental ends. The Owner may keep a reasonable part of the deposit for up to 30 days to cover violations the Owner has reason to expect, and must return it promptly if none arrive."
        local: "Ang mga notice ng paglabag sa trapiko, kabilang ang mga notice ng No Contact Apprehension, ay ipinapadala sa rehistradong may-ari at kadalasang dumarating pagkatapos ng pag-upa. Maaaring itabi ng May-ari ang makatwirang bahagi ng deposit nang hanggang 30 araw para sa mga paglabag na may dahilan siyang asahan, at dapat itong ibalik agad kung walang dumating."
        country: true
      - id: deposit.4
        en: "The Owner will not keep the Renter's original passport or government ID card as a deposit or security. Under the Philippine Passport Act (RA 11983), only the DFA may confiscate a Philippine passport, and withholding one without legal authority is a crime. The Owner may take a copy or photo of the Renter's ID to identify the Renter (section 17)."
        local: "Hindi itatago ng May-ari ang orihinal na pasaporte o government ID ng Umuupa bilang deposit o garantiya. Sa ilalim ng Philippine Passport Act (RA 11983), ang DFA lamang ang maaaring kumumpiska ng pasaporteng Pilipino, at krimen ang pagtatago nito nang walang legal na awtoridad. Maaaring kumuha ang May-ari ng kopya o litrato ng ID ng Umuupa upang makilala siya (seksyon 17)."
        country: true

  - id: cancellation
    title: { en: "7. Cancellation and early return", local: "7. Pagkansela at maagang pagbabalik" }
    clauses:
      - id: cancellation.1
        if: cancel_free_hours
        en: "The Renter may cancel free of charge up to {{cancel_free_hours}} hours before the start time. A later cancellation costs {{cancel_fee_percent}}% of the rent for the booked period (or of the first month on a monthly rental). If the Renter does not arrive at the start time and does not tell the Owner (a no-show), the Owner may keep the full amount paid for the first {{no_show_days}} day(s) and release the vehicle."
        local: "Maaaring magkansela ang Umuupa nang walang bayad hanggang {{cancel_free_hours}} oras bago ang oras ng simula. Ang mas huling pagkansela ay may bayad na {{cancel_fee_percent}}% ng upa para sa na-book na panahon (o ng unang buwan kung buwanang pag-upa). Kung hindi dumating ang Umuupa sa oras ng simula at hindi nagsabi sa May-ari (no-show), maaaring itabi ng May-ari ang buong halagang ibinayad para sa unang {{no_show_days}} araw at ipaupa ang sasakyan sa iba."
      - id: cancellation.2
        unless: cancel_free_hours
        en: "Cancellation by the Renter before the start time: the Owner keeps any booking payment that this agreement or the booking confirmation says is non-refundable, and refunds the rest."
        local: "Pagkansela ng Umuupa bago ang oras ng simula: itatabi ng May-ari ang anumang bayad sa booking na sinabi ng kasunduang ito o ng booking confirmation na non-refundable, at ibabalik ang natitira."
      - id: cancellation.3
        when: { early_return: none }
        en: "Early return: rent for the booked period is not refunded if the Renter returns the vehicle early."
        local: "Maagang pagbabalik: hindi ibabalik ang upa para sa na-book na panahon kung maagang ibinalik ng Umuupa ang sasakyan."
      - id: cancellation.4
        when: { early_return: prorata }
        en: "Early return: the Owner refunds the rent for the full unused days, less an early-return fee of {{currency}} {{early_return_fee}}. Long-term discounts that no longer apply may be recalculated at the rate for the period actually used."
        local: "Maagang pagbabalik: ibabalik ng May-ari ang upa para sa mga buong araw na hindi nagamit, bawas ang early-return fee na {{currency}} {{early_return_fee}}. Ang mga diskwento para sa mahabang pag-upa na hindi na angkop ay maaaring kwentahin muli ayon sa halaga para sa panahong aktwal na nagamit."
      - id: cancellation.5
        when: { rate_period: month }
        en: "Monthly rentals: either party may end the rental by giving {{notice_days}} days' written notice. Without notice, the Renter pays rent for the notice period."
        local: "Buwanang pag-upa: maaaring tapusin ng alinmang partido ang pag-upa sa pagbibigay ng nakasulat na abiso {{notice_days}} araw bago nito. Kung walang abiso, babayaran ng Umuupa ang upa para sa panahon ng abiso."
      - id: cancellation.6
        en: "If the Owner cannot provide the vehicle (or a similar or better one) at the start time, the Renter may cancel and receive a full refund of everything paid."
        local: "Kung hindi maibigay ng May-ari ang sasakyan (o katulad o mas mahusay na sasakyan) sa oras ng simula, maaaring magkansela ang Umuupa at matanggap ang buong refund ng lahat ng ibinayad."

  - id: fuel
    title: { en: "8. Fuel, charging and mileage", local: "8. Gasolina, pag-charge at mileage" }
    clauses:
      - id: fuel.1
        when: { fuel_policy: same }
        en: "Fuel policy: same-to-same. The vehicle must be returned with at least the fuel (or battery) level it had at handover."
        local: "Patakaran sa gasolina: same-to-same. Dapat ibalik ang sasakyan na may gasolina (o baterya) na hindi bababa sa antas nito noong iniabot."
      - id: fuel.2
        when: { fuel_policy: full }
        en: "Fuel policy: full-to-full. The vehicle is handed over with a full tank and must be returned full."
        local: "Patakaran sa gasolina: full-to-full. Iniaabot ang sasakyan na puno ang tangke at dapat ibalik na puno."
      - id: fuel.3
        en: "Missing fuel is charged at the local pump price plus a refuelling service fee of {{currency}} {{fuel_service_fee}}. Using the wrong fuel is the Renter's responsibility, including towing and repair."
        local: "Ang kulang na gasolina ay sisingilin ayon sa presyo sa lokal na gasolinahan, dagdag ang refuelling service fee na {{currency}} {{fuel_service_fee}}. Pananagutan ng Umuupa ang paggamit ng maling gasolina, kasama ang paghila (towing) at pagkumpuni."
      - id: fuel.4
        if: mileage_limit
        en: "Mileage allowance: {{mileage_limit}} km per {{mileage_period_label}}. Each extra kilometre costs {{currency}} {{excess_km_fee}}."
        local: "Pinapayagang mileage: {{mileage_limit}} km bawat {{mileage_period_label}}. Bawat dagdag na kilometro ay may bayad na {{currency}} {{excess_km_fee}}."
      - id: fuel.5
        unless: mileage_limit
        en: "Mileage: unlimited, within the permitted area (section 10)."
        local: "Mileage: walang limitasyon, sa loob ng pinapayagang lugar (seksyon 10)."
      - id: fuel.6
        en: "The Renter must not tamper with the odometer, speed limiter or GPS tracker. Tampering is a serious breach (section 15)."
        local: "Hindi dapat pakialaman ng Umuupa ang odometer, speed limiter o GPS tracker. Ang pakikialam dito ay isang malubhang paglabag (seksyon 15)."

  - id: use
    title: { en: "9. Safe and lawful use", local: "9. Ligtas at legal na paggamit" }
    clauses:
      - id: use.1
        en: "The Renter must drive or ride carefully, obey all traffic laws, and keep the vehicle locked with the keys removed whenever it is left. Keys must never be left in or on the vehicle."
        local: "Dapat magmaneho nang maingat ang Umuupa, sundin ang lahat ng batas trapiko, at panatilihing nakakandado ang sasakyan at tanggal ang susi tuwing iiwan ito. Hindi kailanman dapat iwan ang susi sa loob o sa ibabaw ng sasakyan."
      - id: use.2
        when: { vehicle_type: [motorbike, ""] }
        en: "Motorbikes and scooters: the rider and any back rider must wear a fastened standard helmet (with PS or ICC mark) at all times, as the Motorcycle Helmet Act (RA 10054) requires. No more than one passenger. A child may ride as a passenger only where the Children's Safety on Motorcycles Act (RA 10666) allows it: the child's feet reach the foot pegs, the child's arms reach around the rider's waist, and the child wears a standard helmet. Motorcycle riders must not ride with any alcohol in their blood."
        local: "Motorsiklo at scooter: ang drayber at ang angkas ay dapat nakasuot ng nakakabit na standard na helmet (may PS o ICC mark) sa lahat ng oras, ayon sa hinihingi ng Motorcycle Helmet Act (RA 10054). Hindi hihigit sa isang angkas. Ang bata ay maaari lamang umangkas kung pinapayagan ng Children's Safety on Motorcycles Act (RA 10666): abot ng paa ng bata ang foot peg, abot ng braso ng bata ang baywang ng drayber, at nakasuot ang bata ng standard na helmet. Ang nagmamaneho ng motorsiklo ay hindi dapat magmaneho nang may kahit anong alak sa dugo."
        country: true
      - id: use.3
        when: { vehicle_type: [car, ""] }
        en: "Cars: every occupant must wear a seatbelt (the Seat Belts Use Act, RA 8750, requires it at least for the driver and front passengers). Under the Child Safety in Motor Vehicles Act (RA 11229), children aged 12 and below must not sit in the front seat unless they are at least 150 cm tall and wear the seatbelt, must use a suitable child car seat where the law requires one, and must never be left alone in the car. The number of passengers must not exceed the number of seats."
        local: "Kotse: bawat sakay ay dapat nakasuot ng seatbelt (hinihingi ito ng Seat Belts Use Act, RA 8750, kahit man lang sa drayber at sa mga nakaupo sa harap). Sa ilalim ng Child Safety in Motor Vehicles Act (RA 11229), ang mga batang 12 taong gulang pababa ay hindi dapat umupo sa harap maliban kung sila ay hindi bababa sa 150 cm ang taas at nakasuot ng seatbelt, dapat gumamit ng angkop na child car seat kung saan hinihingi ng batas, at hindi kailanman dapat iwanang mag-isa sa kotse. Hindi dapat lumampas ang bilang ng sakay sa bilang ng upuan."
        country: true
      - id: use.4
        en: "It is forbidden to: drive under the influence of alcohol or drugs, or above the legal limit (Anti-Drunk and Drugged Driving Act, RA 10586); use a phone or other device while driving or stopped at a red light, except hands-free use that does not block the driver's view (Anti-Distracted Driving Act, RA 10913); race, perform stunts or drive off-road (unless the vehicle is meant for it and the Owner agreed); tow or push anything; carry passengers or goods for payment, illegal goods or dangerous loads; use the vehicle for ride-hailing, delivery work, driving lessons or to rent it to anyone else; let anyone not named in section 2 drive or ride."
        local: "Ipinagbabawal ang: magmaneho nang lasing o nasa impluwensya ng droga, o lampas sa legal na limitasyon (Anti-Drunk and Drugged Driving Act, RA 10586); gumamit ng cellphone o ibang device habang nagmamaneho o nakahinto sa red light, maliban sa hands-free na hindi humaharang sa paningin ng drayber (Anti-Distracted Driving Act, RA 10913); makipagkarera, gumawa ng stunts o magmaneho sa labas ng kalsada (maliban kung para rito ang sasakyan at pumayag ang May-ari); humila o magtulak ng anumang bagay; magsakay ng pasahero o kargamento nang may bayad, ilegal na bagay o mapanganib na karga; gamitin ang sasakyan sa ride-hailing, delivery, pagtuturo ng pagmamaneho o ipaupa ito sa iba; payagang magmaneho ang sinumang hindi nakapangalan sa seksyon 2."
      - id: use.5
        when: { smoking: no }
        en: "Smoking and vaping are not allowed in the vehicle.{{#if smoking_fee}} Breaking this rule costs a fee of {{currency}} {{smoking_fee}} for odour removal.{{/if}}"
        local: "Bawal manigarilyo at mag-vape sa loob ng sasakyan.{{#if smoking_fee}} Ang paglabag dito ay may bayad na {{currency}} {{smoking_fee}} para sa pagtanggal ng amoy.{{/if}}"
      - id: use.6
        when: { pets: no }
        en: "Pets and animals are not allowed in or on the vehicle, except assistance animals."
        local: "Bawal ang alagang hayop at iba pang hayop sa loob o sa ibabaw ng sasakyan, maliban sa mga assistance animal."
      - id: use.7
        when: { pets: fee }
        en: "Pets are allowed if they are kept in a carrier or on a seat cover. A pet cleaning fee of {{currency}} {{pet_fee}} applies."
        local: "Pinapayagan ang alagang hayop kung nasa carrier o nasa seat cover. May pet cleaning fee na {{currency}} {{pet_fee}}."

  - id: area
    title: { en: "10. Permitted area", local: "10. Pinapayagang lugar" }
    fields:
      - { key: area_of_use, en: "The vehicle may be used in", local: "Maaaring gamitin ang sasakyan sa" }
    clauses:
      - id: area.1
        en: "The vehicle must stay within the permitted area above. Taking it further, on a ferry or to another island, needs the Owner's written permission first, and the Renter pays any ferry fees, delays and recovery costs."
        local: "Dapat manatili ang sasakyan sa loob ng pinapayagang lugar sa itaas. Ang pagdadala nito nang mas malayo, sakay ng barko o ferry o papunta sa ibang isla, ay nangangailangan muna ng nakasulat na pahintulot ng May-ari, at babayaran ng Umuupa ang anumang bayad sa ferry, pagkaantala at gastos sa pagbawi."
      - id: area.2
        en: "Without the Owner's written permission, the vehicle must not leave the island or province where it was rented, including by ferry or RoRo. Ferry operators usually ask for the OR/CR and an authorisation letter from the registered owner; the Owner gives these only when permission is given. Outside the permitted area, insurance may not cover the vehicle and the Renter is responsible for all loss and damage."
        local: "Kung walang nakasulat na pahintulot ng May-ari, hindi dapat ilabas ang sasakyan sa isla o probinsya kung saan ito inupahan, kasama ang pagsakay sa ferry o RoRo. Karaniwang hinihingi ng mga ferry operator ang OR/CR at authorization letter mula sa rehistradong may-ari; ibibigay lamang ito ng May-ari kapag may pahintulot. Sa labas ng pinapayagang lugar, maaaring hindi sakop ng insurance ang sasakyan at pananagutan ng Umuupa ang lahat ng pagkawala at pinsala."
        country: true
      - id: area.3
        en: "The vehicle may be fitted with a GPS tracker, used only for security, recovery and checking that this agreement is kept."
        local: "Maaaring may GPS tracker ang sasakyan, na gagamitin lamang para sa seguridad, pagbawi ng sasakyan at pagtiyak na sinusunod ang kasunduang ito."

  - id: insurance
    title: { en: "11. Insurance", local: "11. Insurance" }
    fields:
      - { key: insurance_text, en: "Insurance on this vehicle", local: "Insurance ng sasakyang ito" }
      - { key: insurance_excess_text, en: "Renter's excess / participation fee (most the Renter pays per incident, if the rules are kept)", local: "Excess / participation fee ng Umuupa (pinakamalaking babayaran ng Umuupa bawat insidente, kung sinunod ang mga patakaran)" }
    clauses:
      - id: insurance.1
        en: "The vehicle has the Compulsory Third Party Liability (CTPL) insurance needed to register it with the LTO. CTPL covers death and bodily injury of third parties, within its limits. It does not cover damage to the rented vehicle, its theft, injury to the driver, or (in most policies) damage to other people's property."
        local: "Ang sasakyan ay may Compulsory Third Party Liability (CTPL) insurance na kailangan para mairehistro ito sa LTO. Sakop ng CTPL ang pagkamatay at pinsala sa katawan ng ibang tao (third party), hanggang sa limitasyon nito. Hindi nito sakop ang pinsala sa inupahang sasakyan, ang pagnanakaw nito, ang pinsala sa drayber, o (sa karamihan ng polisiya) ang pinsala sa ari-arian ng ibang tao."
        country: true
      - id: insurance.2
        when: { insurance_level: comprehensive }
        en: "The vehicle also has comprehensive insurance covering damage to the rented vehicle and to third parties. Per incident, the Renter pays no more than the excess shown above, provided the Renter has kept the rules of this agreement."
        local: "May comprehensive insurance din ang sasakyan na sumasakop sa pinsala sa inupahang sasakyan at sa ibang tao. Bawat insidente, hindi hihigit sa excess na nakasaad sa itaas ang babayaran ng Umuupa, basta't sinunod ng Umuupa ang mga patakaran ng kasunduang ito."
      - id: insurance.3
        when: { insurance_level: third_party }
        en: "The vehicle also has voluntary third-party liability insurance covering damage to other people's property and injury to others above the CTPL limits. It does not cover damage to or theft of the rented vehicle: the Renter is responsible for those (section 12)."
        local: "May voluntary third-party liability insurance din ang sasakyan na sumasakop sa pinsala sa ari-arian ng ibang tao at sa pinsala sa ibang tao na lampas sa limitasyon ng CTPL. Hindi nito sakop ang pinsala sa o pagnanakaw ng inupahang sasakyan: pananagutan iyon ng Umuupa (seksyon 12)."
      - id: insurance.4
        when: { insurance_level: compulsory }
        en: "The vehicle has only CTPL insurance. The Renter is responsible for damage to the rented vehicle, its theft, and damage to other people's property (section 12)."
        local: "CTPL insurance lamang ang mayroon ang sasakyan. Pananagutan ng Umuupa ang pinsala sa inupahang sasakyan, ang pagnanakaw nito, at ang pinsala sa ari-arian ng ibang tao (seksyon 12)."
      - id: insurance.5
        en: "Insurance does not protect the Renter, and the Renter pays in full, when damage or loss happens: while driving under the influence, without a valid licence for the vehicle, by a driver not named in section 2, outside the permitted area, during forbidden use (section 9), through deliberate or reckless acts, or when keys were left with the vehicle. Tyres, wheels, glass, underbody, interior, keys and accessories are often excluded by insurers and are the Renter's responsibility unless the Owner confirms in writing that they are covered."
        local: "Hindi poprotektahan ng insurance ang Umuupa, at buong babayaran ng Umuupa, ang pinsala o pagkawala na nangyari: habang nagmamaneho nang lasing o nasa impluwensya ng droga, nang walang balidong lisensya para sa sasakyan, ng drayber na hindi nakapangalan sa seksyon 2, sa labas ng pinapayagang lugar, habang ginagamit sa ipinagbabawal na paraan (seksyon 9), dahil sa sinadya o pabayang gawain, o kapag iniwan ang susi sa sasakyan. Ang gulong, rim, salamin, ilalim ng sasakyan, interior, susi at mga kagamitan ay kadalasang hindi sakop ng insurance at pananagutan ng Umuupa, maliban kung kinumpirma ng May-ari nang nakasulat na sakop ang mga ito."
      - id: insurance.6
        en: "Personal belongings left in or on the vehicle are not insured by the Owner. The Owner is not responsible for their loss or damage."
        local: "Hindi naka-insure sa May-ari ang mga personal na gamit na naiwan sa loob o sa ibabaw ng sasakyan. Hindi mananagot ang May-ari sa pagkawala o pagkasira ng mga ito."

  - id: damage
    title: { en: "12. Damage, theft and loss", local: "12. Pinsala, pagnanakaw at pagkawala" }
    clauses:
      - id: damage.1
        en: "The Renter is responsible for the vehicle from handover until it is returned and checked. The condition at handover is recorded in Annex A with photos; anything not recorded there is treated as new unless it is normal wear and tear."
        local: "Pananagutan ng Umuupa ang sasakyan mula sa pag-abot hanggang maibalik at masuri ito. Ang kondisyon sa pag-abot ay nakatala sa Annex A kasama ang mga litrato; anumang hindi nakatala roon ay ituturing na bago maliban kung ito ay normal na pagkaluma (wear and tear)."
      - id: damage.2
        en: "Repair costs are based on a quote or invoice from a garage, or on the damage price list in Annex B where one is attached. The Renter may ask to see the quote, and may get a second quote from a garage the Owner approves within 3 days."
        local: "Ang gastos sa pagkumpuni ay batay sa quotation o invoice mula sa talyer, o sa listahan ng presyo ng pinsala sa Annex B kung mayroong nakalakip. Maaaring hilingin ng Umuupa na makita ang quotation, at maaari siyang kumuha ng pangalawang quotation mula sa talyer na aprubado ng May-ari sa loob ng 3 araw."
      - id: damage.3
        if: loss_of_use_fee
        en: "While the vehicle cannot be rented because of damage caused during this rental, the Renter pays loss of use of {{currency}} {{loss_of_use_fee}} per day, for up to {{loss_of_use_max_days}} days."
        local: "Habang hindi maipaupa ang sasakyan dahil sa pinsalang nangyari sa pag-upang ito, babayaran ng Umuupa ang loss of use na {{currency}} {{loss_of_use_fee}} bawat araw, nang hanggang {{loss_of_use_max_days}} araw."
      - id: damage.4
        en: "If the vehicle or its keys are stolen, the Renter must report it to the police at once and give the Owner the police report. Where the theft happened because the vehicle was left unlocked, with the keys, or outside the permitted area, the Renter pays the value of the vehicle as stated in Annex B (or its market value)."
        local: "Kung ninakaw ang sasakyan o ang susi nito, dapat itong iulat agad ng Umuupa sa pulis at ibigay sa May-ari ang police report. Kung nangyari ang pagnanakaw dahil iniwang hindi nakakandado ang sasakyan, iniwan kasama ang susi, o nasa labas ng pinapayagang lugar, babayaran ng Umuupa ang halaga ng sasakyan ayon sa Annex B (o ang market value nito)."
      - id: damage.5
        en: "Lost keys, remote controls, helmets, documents, number plates and accessories are charged at their replacement cost, plus any locksmith or re-registration cost."
        local: "Ang nawalang susi, remote, helmet, dokumento, plaka at kagamitan ay sisingilin ayon sa halaga ng pagpapalit, dagdag ang anumang gastos sa locksmith o muling pagpaparehistro."
      - id: damage.nature_cc
        en: "Floods and typhoons: the Renter must not drive into flood water and must move the vehicle to safe, higher ground when a storm or flood warning is issued, if it is safe to do so. Damage from floods, typhoons or earthquakes ('Acts of Nature') is covered only if the vehicle's insurance includes it. Damage caused by driving into flood water, or by ignoring a warning when the vehicle could safely have been moved, is the Renter's responsibility. Damage that could not be avoided by reasonable care is not the Renter's responsibility."
        local: "Baha at bagyo: hindi dapat isuong ng Umuupa ang sasakyan sa baha, at dapat niyang ilipat ang sasakyan sa ligtas at mataas na lugar kapag may babala ng bagyo o baha, kung ligtas itong gawin. Ang pinsala mula sa baha, bagyo o lindol ('Acts of Nature') ay sakop lamang kung kasama ito sa insurance ng sasakyan. Pananagutan ng Umuupa ang pinsalang dulot ng pagsuong sa baha, o ng hindi pagpansin sa babala kung ligtas sanang nailipat ang sasakyan. Hindi pananagutan ng Umuupa ang pinsalang hindi maiiwasan kahit may makatwirang pag-iingat."

  - id: accident
    title: { en: "13. Accidents and breakdowns", local: "13. Aksidente at pagkasira" }
    clauses:
      - id: accident.1
        en: "In an accident, the Renter must: stop, make the area safe and get medical help if anyone is hurt (emergency hotline 911); call the Owner straight away on the number in section 1; report the accident to the police, as the law requires, and call the insurer's hotline when the Owner asks; take photos of all vehicles, plates, the place and any damage; note the other party's name, phone, plate, licence and insurance; and not admit fault, sign a settlement, pay or accept money without the Owner's agreement."
        local: "Kapag may aksidente, dapat ang Umuupa ay: huminto, gawing ligtas ang lugar at humingi ng tulong medikal kung may nasaktan (emergency hotline 911); tawagan agad ang May-ari sa numerong nasa seksyon 1; iulat ang aksidente sa pulis, ayon sa hinihingi ng batas, at tawagan ang hotline ng insurance kapag hiniling ng May-ari; kumuha ng litrato ng lahat ng sasakyan, plaka, lugar at anumang pinsala; itala ang pangalan, telepono, plaka, lisensya at insurance ng kabilang partido; at huwag umamin ng kasalanan, pumirma ng areglo, magbayad o tumanggap ng pera nang walang pahintulot ng May-ari."
        country: true
      - id: accident.2
        en: "Breakdowns: the Renter must stop safely, tell the Owner and follow the Owner's instructions. The Renter must not have the vehicle repaired without the Owner's permission, except for minor emergency costs up to {{currency}} {{emergency_repair_limit}}, which the Owner refunds against a receipt."
        local: "Pagkasira: dapat huminto nang ligtas ang Umuupa, sabihan ang May-ari at sundin ang mga tagubilin nito. Hindi dapat ipakumpuni ng Umuupa ang sasakyan nang walang pahintulot ng May-ari, maliban sa maliliit na emergency na gastos na hanggang {{currency}} {{emergency_repair_limit}}, na ibabalik ng May-ari kapag may resibo."
      - id: accident.3
        en: "If the vehicle stops working through no fault of the Renter, the Owner will repair it or provide a similar vehicle within 24 hours of being told where reasonably possible. If the Owner cannot, the Renter may end the rental and receive a refund of the rent for the unused days."
        local: "Kung masira ang sasakyan nang hindi kasalanan ng Umuupa, ipakukumpuni ito ng May-ari o magbibigay ng katulad na sasakyan sa loob ng 24 oras mula nang masabihan, hangga't makatwirang posible. Kung hindi ito magawa ng May-ari, maaaring tapusin ng Umuupa ang pag-upa at matanggap ang refund ng upa para sa mga araw na hindi nagamit."
      - id: accident.4
        en: "The Renter must report any warning light, unusual noise, puncture or fault promptly and must not keep using a vehicle that is unsafe."
        local: "Dapat iulat agad ng Umuupa ang anumang warning light, kakaibang ingay, butas sa gulong o sira, at hindi dapat ituloy ang paggamit ng sasakyang hindi ligtas."

  - id: fines
    title: { en: "14. Fines, tolls and parking", local: "14. Multa, toll at paradahan" }
    clauses:
      - id: fines.1
        en: "The Renter pays all traffic and parking fines, tolls, towing, impound and clamping costs arising during the rental, including fines that reach the Owner after the vehicle is returned, plus a handling fee of {{currency}} {{fine_admin_fee}} per fine."
        local: "Babayaran ng Umuupa ang lahat ng multa sa trapiko at paradahan, toll, towing, impound at clamping na nangyari habang nagrerenta, kasama ang mga multang dumating sa May-ari matapos maibalik ang sasakyan, dagdag ang handling fee na {{currency}} {{fine_admin_fee}} bawat multa."
      - id: fines.2
        en: "Violation notices from the LTO, MMDA, local governments or No Contact Apprehension cameras are sent to the registered owner. The Owner may give the Renter's name, ID and licence details and a copy of this agreement to the issuing authority so that the violation is transferred to the Renter, where the authority's procedure allows. If it cannot be transferred, the Owner may pay it (an unpaid violation can block the vehicle's registration) and the Renter repays the Owner."
        local: "Ang mga notice ng paglabag mula sa LTO, MMDA, lokal na pamahalaan o mga camera ng No Contact Apprehension ay ipinapadala sa rehistradong may-ari. Maaaring ibigay ng May-ari ang pangalan, ID at detalye ng lisensya ng Umuupa at kopya ng kasunduang ito sa ahensyang nag-isyu upang mailipat ang paglabag sa Umuupa, kung pinapayagan ito ng proseso ng ahensya. Kung hindi ito mailipat, maaaring bayaran ito ng May-ari (maaaring maharang ng hindi nabayarang paglabag ang rehistro ng sasakyan) at babayaran ng Umuupa ang May-ari."
        country: true

  - id: termination
    title: { en: "15. Ending the agreement by the Owner", local: "15. Pagtatapos ng kasunduan ng May-ari" }
    clauses:
      - id: termination.1
        en: "The Owner may end this agreement and take the vehicle back at once if the Renter: does not pay on time; gave false details; lets an unnamed person drive; uses the vehicle unlawfully or against section 9; takes it outside the permitted area without permission; tampers with the odometer or tracker; abandons it; or puts the vehicle or other people at serious risk. The Owner may then deduct what the Renter owes under this agreement, including reasonable recovery costs, and refunds any remaining prepaid rent for the days after the vehicle is recovered."
        local: "Maaaring tapusin agad ng May-ari ang kasunduang ito at bawiin ang sasakyan kung ang Umuupa ay: hindi nagbayad sa takdang oras; nagbigay ng maling impormasyon; nagpamaneho sa taong hindi nakapangalan; gumamit ng sasakyan nang ilegal o labag sa seksyon 9; inilabas ito sa pinapayagang lugar nang walang pahintulot; pinakialaman ang odometer o tracker; iniwan o pinabayaan ito; o inilagay ang sasakyan o ibang tao sa malubhang panganib. Pagkatapos nito, maaaring ibawas ng May-ari ang anumang dapat bayaran ng Umuupa sa ilalim ng kasunduang ito, kasama ang makatwirang gastos sa pagbawi, at ibabalik niya ang natitirang paunang bayad na upa para sa mga araw pagkatapos mabawi ang sasakyan."
      - id: termination.2
        en: "The Renter must make the vehicle available for collection, and pays reasonable recovery costs where the Owner has to fetch it."
        local: "Dapat ihanda ng Umuupa ang sasakyan para makuha, at babayaran niya ang makatwirang gastos sa pagbawi kung kailangan itong kunin ng May-ari."

  - id: return
    title: { en: "16. Returning the vehicle", local: "16. Pagbabalik ng sasakyan" }
    clauses:
      - id: return.1
        en: "The vehicle must be returned with its keys, documents and accessories, with the fuel level agreed in section 8, and reasonably clean. Both parties check the vehicle together and record the condition, odometer and fuel in Annex A with photos. If the Renter is not present at the check, the Owner's dated photos are accepted as the record."
        local: "Dapat ibalik ang sasakyan kasama ang susi, mga dokumento at kagamitan, na may antas ng gasolina na napagkasunduan sa seksyon 8, at makatwirang malinis. Sabay na susuriin ng dalawang partido ang sasakyan at itatala ang kondisyon, odometer at gasolina sa Annex A kasama ang mga litrato. Kung wala ang Umuupa sa pagsusuri, ang mga litrato ng May-ari na may petsa ang tatanggaping talaan."
      - id: return.2
        if: cleaning_fee
        en: "A vehicle returned with excessive dirt, sand, mud, stains, food or odour inside costs a cleaning fee of {{currency}} {{cleaning_fee}} (more if specialist cleaning is needed, against a receipt)."
        local: "Ang sasakyang ibinalik na may sobrang dumi, buhangin, putik, mantsa, pagkain o amoy sa loob ay may cleaning fee na {{currency}} {{cleaning_fee}} (mas mataas kung kailangan ng espesyal na paglilinis, may resibo)."
      - id: return.3
        unless: cleaning_fee
        en: "A vehicle returned with excessive dirt, sand, mud, stains, food or odour inside may be charged the reasonable cost of cleaning."
        local: "Ang sasakyang ibinalik na may sobrang dumi, buhangin, putik, mantsa, pagkain o amoy sa loob ay maaaring singilin ng makatwirang gastos sa paglilinis."

  - id: data
    title: { en: "17. Personal data and documents", local: "17. Personal na datos at mga dokumento" }
    clauses:
      - id: data.1
        en: "Under the Data Privacy Act of 2012 (RA 10173), the Owner collects the Renter's and drivers' names, contact details, ID and licence details, copies of documents and photos of the vehicle only to provide this rental, prove identity, comply with the law, handle fines, claims and disputes, and keep business records. The Owner collects no more than is needed, keeps the data only as long as needed for those purposes and the law, keeps it secure, and does not sell it. The Renter may ask to access or correct their data, may ask for it to be deleted when it is no longer needed, and may complain to the National Privacy Commission."
        local: "Sa ilalim ng Data Privacy Act of 2012 (RA 10173), kinokolekta ng May-ari ang pangalan, contact details, detalye ng ID at lisensya, kopya ng mga dokumento ng Umuupa at mga drayber, at mga litrato ng sasakyan para lamang maibigay ang pag-upang ito, mapatunayan ang pagkakakilanlan, sumunod sa batas, asikasuhin ang mga multa, claim at hindi pagkakasundo, at magtago ng rekord ng negosyo. Hindi kumokolekta ang May-ari nang higit sa kailangan, itinatago ang datos hangga't kailangan lamang para sa mga layuning ito at ng batas, pinananatiling ligtas ito, at hindi ito ibinebenta. Maaaring hilingin ng Umuupa na makita o itama ang kanyang datos, hilingin na burahin ito kapag hindi na kailangan, at magreklamo sa National Privacy Commission."
        country: true
      - id: data.2
        en: "The Renter consents to copies of their documents and the inspection photos and videos being used as evidence of identity and of the vehicle's condition, and being given to insurers, the police and authorities (such as the LTO or MMDA) when needed for a claim, fine or legal requirement."
        local: "Pumapayag ang Umuupa na ang mga kopya ng kanyang dokumento at ang mga litrato at video ng pagsusuri ay gamitin bilang patunay ng pagkakakilanlan at ng kondisyon ng sasakyan, at ibigay sa insurance, pulis at mga awtoridad (gaya ng LTO o MMDA) kapag kailangan para sa claim, multa o legal na kinakailangan."
        country: true

  - id: general
    title: { en: "18. General terms", local: "18. Pangkalahatang tuntunin" }
    clauses:
      - id: general.1
        en: "Messages: notices under this agreement may be sent by phone, message app (Viber, WhatsApp, Messenger, Telegram or similar), SMS or email to the contact details in sections 1 and 2, and count as received when sent."
        local: "Mga mensahe: ang mga abiso sa ilalim ng kasunduang ito ay maaaring ipadala sa telepono, message app (Viber, WhatsApp, Messenger, Telegram o katulad), SMS o email sa mga contact details sa seksyon 1 at 2, at ituturing na natanggap sa oras na naipadala."
      - id: general.2
        en: "Force majeure: neither party is responsible for a delay or failure caused by events outside their control, such as natural disasters, floods, typhoons, government orders or ferry cancellations. Rent for days the vehicle could not be used because of such an event is agreed fairly between the parties."
        local: "Force majeure: walang partidong mananagot sa pagkaantala o hindi pagtupad na dulot ng mga pangyayaring wala sa kanilang kontrol, gaya ng kalamidad, baha, bagyo, utos ng pamahalaan o pagkansela ng biyahe ng ferry. Ang upa para sa mga araw na hindi nagamit ang sasakyan dahil sa ganitong pangyayari ay pagkakasunduan nang patas ng mga partido."
      - id: general.3
        en: "Whole agreement: this agreement, its annexes and any special conditions are the whole agreement. Changes are valid only in writing (a message from both parties is enough). If any part is found invalid, the rest still applies."
        local: "Buong kasunduan: ang kasunduang ito, ang mga annex nito at anumang espesyal na kondisyon ang bumubuo sa buong kasunduan. Balido lamang ang mga pagbabago kung nakasulat (sapat na ang mensahe mula sa parehong partido). Kung may bahaging mapatunayang hindi balido, mananatiling may bisa ang iba."
      - id: general.fees_cc
        en: "Fair charges: the fees and charges in this agreement are agreed estimates of the Owner's actual costs and losses. Under the Civil Code, a court may reduce a penalty that is iniquitous or unconscionable. Nothing in this agreement takes away rights the Renter has under the Consumer Act of the Philippines (RA 7394) or other law."
        local: "Patas na singil: ang mga bayarin at singil sa kasunduang ito ay napagkasunduang tantya ng aktwal na gastos at pagkalugi ng May-ari. Sa ilalim ng Civil Code, maaaring bawasan ng korte ang multa o penalty na labis o hindi makatarungan. Walang anuman sa kasunduang ito ang nag-aalis ng mga karapatan ng Umuupa sa ilalim ng Consumer Act of the Philippines (RA 7394) o ng ibang batas."
      - id: general.4
        en: "Language: this agreement is written in English and {{local_language}}. If the two versions differ, the {{prevailing_language}} version applies. Each party confirms that they understand this agreement, or that it was explained to them in a language they understand."
        local: "Wika: ang kasunduang ito ay nakasulat sa Ingles at {{local_language}}. Kung magkaiba ang dalawang bersyon, ang bersyong {{prevailing_language}} ang masusunod. Pinatutunayan ng bawat partido na naiintindihan nila ang kasunduang ito, o na ipinaliwanag ito sa kanila sa wikang naiintindihan nila."
        country: true
      - id: general.5
        en: "Governing law: this agreement is governed by the laws of {{jurisdiction}}. The parties will first try to settle any dispute by discussion and, where the law requires, through barangay conciliation (Katarungang Pambarangay). If they cannot, the competent courts of {{court_place}} decide."
        local: "Batas na umiiral: ang kasunduang ito ay sakop ng mga batas ng {{jurisdiction}}. Susubukan muna ng mga partido na ayusin ang anumang hindi pagkakasundo sa pamamagitan ng pag-uusap at, kung hinihingi ng batas, sa pamamagitan ng barangay conciliation (Katarungang Pambarangay). Kung hindi ito maayos, ang may kapangyarihang korte ng {{court_place}} ang magpapasya."
        country: true
      - id: general.6
        if: special_terms
        en: "Special conditions agreed between the parties: {{special_terms}}"
        local: "Mga espesyal na kondisyong napagkasunduan ng mga partido: {{special_terms}}"

  - id: signatures
    title: { en: "Signatures", local: "Mga lagda" }
    signature: true
    clauses:
      - id: signatures.1
        en: "By signing, the parties confirm they have read and understood this agreement, including Annexes A and B, and agree to it. The Renter confirms they received a copy."
        local: "Sa paglagda, pinatutunayan ng mga partido na nabasa at naintindihan nila ang kasunduang ito, kasama ang Annex A at B, at sumasang-ayon dito. Pinatutunayan ng Umuupa na nakatanggap siya ng kopya."
    sign_rows:
      - { en: "Owner (name, signature, date)", local: "May-ari (pangalan, lagda, petsa)" }
      - { en: "Renter (name, signature, date)", local: "Umuupa (pangalan, lagda, petsa)" }
      - { en: "Additional driver (name, signature, date)", local: "Karagdagang drayber (pangalan, lagda, petsa)" }

  - id: annex_a
    title: { en: "Annex A: Handover and return check", local: "Annex A: Pagsusuri sa pag-abot at pagbabalik" }
    page_break: true
    checklist: true
    clauses:
      - id: annex_a.1
        en: "Mark existing scratches (S), dents (D), cracks (C) and missing items (M). Take photos of all four sides, the dashboard (odometer and fuel), the interior and any damage, at both handover and return."
        local: "Markahan ang mga gasgas (S), yupi (D), lamat o basag (C) at nawawalang gamit (M). Kunan ng litrato ang apat na gilid, ang dashboard (odometer at gasolina), ang loob at anumang pinsala, sa pag-abot at sa pagbabalik."
    check_rows:
      - { en: "Odometer", local: "Odometer" }
      - { en: "Fuel / battery level", local: "Antas ng gasolina / baterya" }
      - { en: "Body: front / rear / left / right", local: "Katawan: harap / likod / kaliwa / kanan" }
      - { en: "Glass, mirrors and lights", local: "Salamin, side mirror at ilaw" }
      - { en: "Tyres and wheels", local: "Gulong at rim" }
      - { en: "Interior and seats", local: "Loob at upuan" }
      - { en: "Keys, remote, documents (OR/CR)", local: "Susi, remote, dokumento (OR/CR)" }
      - { en: "Helmets / child seat / accessories", local: "Helmet / child seat / kagamitan" }
      - { en: "Photos taken (number)", local: "Bilang ng litratong kinuha" }
      - { en: "Owner's and Renter's initials", local: "Inisyal ng May-ari at Umuupa" }
    columns: { item: { en: "Item", local: "Bahagi" }, out: { en: "At handover", local: "Sa pag-abot" }, in: { en: "At return", local: "Sa pagbabalik" } }

  - id: annex_b
    title: { en: "Annex B: Damage and replacement price list", local: "Annex B: Listahan ng presyo ng pinsala at pagpapalit" }
    pricelist: true
    clauses:
      - id: annex_b.1
        en: "Agreed prices for common damage and lost items. Damage not listed is charged per section 12."
        local: "Napagkasunduang presyo para sa karaniwang pinsala at nawawalang gamit. Ang pinsalang hindi nakalista ay sisingilin ayon sa seksyon 12."
    price_rows:
      - { en: "Scratch, per panel (polish / repaint)", local: "Gasgas, bawat panel (polish / repaint)" }
      - { en: "Dent, per panel", local: "Yupi, bawat panel" }
      - { en: "Mirror", local: "Side mirror" }
      - { en: "Headlight / tail light / indicator", local: "Headlight / tail light / signal light" }
      - { en: "Tyre (each)", local: "Gulong (bawat isa)" }
      - { en: "Key / remote", local: "Susi / remote" }
      - { en: "Helmet", local: "Helmet" }
      - { en: "Number plate replacement", local: "Pagpapalit ng plaka" }
      - { en: "Vehicle value (for total loss or theft)", local: "Halaga ng sasakyan (para sa total loss o pagnanakaw)" }
    columns: { item: { en: "Item", local: "Bahagi" }, price: { en: "Price", local: "Presyo" } }
