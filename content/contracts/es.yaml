  - id: annex_b
    title:
      en: "Annex B: Damage and replacement price list"
      local: "Anexo B: Lista de precios de daños y reposición"
    pricelist: true
    clauses:
      - id: annex_b.1
        en: Agreed prices for common damage and lost items, based on typical repair costs. Damage not listed is charged per section 12. Where a damage waiver applies, the Renter never pays more than the excess.
        local: Precios acordados para daños y pérdidas habituales, basados en costes de reparación típicos. Los daños no incluidos se cobran según la sección 12. Cuando hay exención de daños, el Arrendatario nunca paga más que la franquicia.
