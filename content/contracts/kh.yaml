# RoveHQ vehicle rental agreement: CAMBODIA (English + Khmer). Generated from master.en.yaml by build_country.py.
# Prevailing language: Khmer. Article 5 of the Constitution makes Khmer the official language, and Prakas 0067 (2022) under the
# Law on Consumer Protection (2019) requires standard-form consumer contracts to be prepared in Khmer, so the Khmer version prevails.
# Currency: USD, which is widely used alongside the riel; the form's {{currency}} value is kept as given.
# Not reviewed by a lawyer. Country-specific statements are limited to what public sources (listed under `sources`) support;
# where a rule could not be verified the text uses cautious wording ("where the law requires").
