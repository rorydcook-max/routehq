  - id: annex_b
    title:
      en: "Annex B: Damage and replacement price list"
      local: "Anexo B: Tabela de preços de danos e substituição"
    pricelist: true
    clauses:
      - id: annex_b.1
        en: Agreed prices for common damage and lost items, based on typical repair costs. Damage not listed is charged per section 12. Where a damage waiver applies, the Renter never pays more than the excess.
        local: Preços acordados para danos e perdas comuns, com base em custos típicos de reparação. Os danos não incluídos são cobrados nos termos da secção 12. Havendo isenção de danos, o Locatário nunca paga mais do que a franquia.
    price_rows:
      - en: Scratch, per panel (polish / repaint)
        local: Risco, por painel (polimento / pintura)
      - en: Dent, per panel
        local: Mossa, por painel
      - en: Windscreen chip / replacement
        local: "Para-brisas: impacto / substituição"
      - en: Mirror
