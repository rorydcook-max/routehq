# Open points (not settled by a public source; check with a Turkish lawyer or operator before relying on them):
#  1. KABİS: the portal is behind a business login, so the exact fields and the deadline (at handover, same day?) come
#     from secondary sources; lib/kabis.ts collects name, T.C. Kimlik No or passport and nationality, date of birth,
#     licence number/class/issue date/country, phone, address, plate and rental start and end.
#  2. GPS: a vendor and a law firm say rental cars must carry GPS and keep location data for 3 years (a rule from
#     30 Nov 2024); the official text was not found, so area.3 does not say it is compulsory.
#  3. The 2026 Ministry of Trade regulation covers cars and light vans (M1/N1) to consumers for up to 29 days; whether
#     motorbike, scooter and quad rentals need the authorisation certificate (yetki belgesi) is not clear from its text.
#  4. Periodic inspection interval for rental cars (yearly as commercial vehicles, or private-car intervals) depends on
#     how the vehicle is registered: lib/country-paperwork.ts leaves the date to the owner.
#  5. Whether a foreign B licence with a "125 cc" code (EU countries that allow it) lets a tourist ride a 125 cc
#     motorbike in Türkiye: no public source; renter.2 asks for the A1/A2/A class.
#  6. Alcohol limit and child-seat thresholds are left to "the legal limit" / "as Turkish law requires" rather than
#     quoted figures.
#  7. D2 authorisation: D-class authorisations under the Road Transport Regulation are for carrying passengers; no
#     source requires one for self-drive rental. The Ministry of Trade's yetki belgesi (from 1 Jul 2027 for existing
#     businesses) is the rental licence.
#  8. Taking a Turkish-plated rental vehicle abroad: a notarised authorisation from the owner is the usual practice;
#     confirm the documents per destination.
