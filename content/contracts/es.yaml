    page_break: true
    checklist: true
    clauses:
      - id: annex_a.1
        en: Mark existing scratches (S), dents (D), cracks (C) and missing items (M). Take dated photos of all four sides, the dashboard (odometer and fuel), the interior and any damage, at both handover and return.
        local: Marque los arañazos (A), abolladuras (B), grietas (G) y elementos que falten (F). Haga fotos fechadas de los cuatro lados, el salpicadero (kilometraje y combustible), el interior y cualquier daño, tanto en la entrega como en la devolución.
