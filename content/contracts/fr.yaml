      local: "Annexe A : État des lieux de départ et de retour"
    page_break: true
    checklist: true
    clauses:
      - id: annex_a.1
        en: Mark existing scratches (S), dents (D), cracks (C) and missing items (M). Take dated photos of all four sides, the dashboard (odometer and fuel), the interior and any damage, at both handover and return.
        local: Indiquer les rayures (R), bosses (B), fissures (F) et éléments manquants (M). Prendre des photos datées des quatre côtés, du tableau de bord (kilométrage et carburant), de l'intérieur et de tout dommage, au départ comme au retour.
