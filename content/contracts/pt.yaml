      - en: Key / remote
        local: Chave / comando
      - en: Helmet / child seat
        local: Capacete / cadeira de criança
      - en: Number plate replacement
        local: Substituição de chapa de matrícula
      - en: Vehicle value (for total loss or theft)
        local: Valor do veículo (perda total ou furto)
    columns:
