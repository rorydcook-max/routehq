  - id: annex_b
    title:
      en: "Annex B: Damage and replacement price list"
      local: "Annexe B : Grille tarifaire des dommages et remplacements"
    pricelist: true
    clauses:
      - id: annex_b.1
        en: Agreed prices for common damage and lost items, based on typical repair costs. Damage not listed is charged per section 12. Where a damage waiver applies, the Renter never pays more than the excess.
        local: Prix convenus pour les dommages et pertes courants, fondés sur des coûts de réparation habituels. Les dommages non listés sont facturés selon la section 12. En cas de garantie dommages, le Locataire ne paie jamais plus que la franchise.
