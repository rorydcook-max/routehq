    local: ລາຍເຊັນ
  signature: true
  clauses:
  - id: signatures.1
    en: By signing, the parties confirm they have read and understood this agreement, including Annexes A and B, and agree to it. The Renter confirms they received a copy.
    local: ໂດຍການລົງລາຍເຊັນ, ຄູ່ສັນຍາຢືນຢັນວ່າ ໄດ້ອ່ານ ແລະ ເຂົ້າໃຈສັນຍານີ້ ລວມທັງເອກະສານຊ້ອນທ້າຍ A ແລະ B, ແລະ ເຫັນດີນຳ. ຜູ້ເຊົ່າຢືນຢັນວ່າ ໄດ້ຮັບສຳເນົາແລ້ວ.
