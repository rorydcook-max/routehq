- id: annex_a
  title:
    en: 'Annex A: Handover and return check'
    local: 'ເອກະສານຊ້ອນທ້າຍ A: ການກວດກາຕອນຮັບ ແລະ ຕອນສົ່ງຄືນ'
  page_break: true
  checklist: true
  clauses:
  - id: annex_a.1
    en: Mark existing scratches (S), dents (D), cracks (C) and missing items (M). Take photos of all four sides, the dashboard (odometer and fuel), the interior and any damage, at both handover and return.
    local: ໝາຍຮອຍຂີດຂ່ວນ (S), ຮອຍບຸບ (D), ຮອຍແຕກ (C) ແລະ ສິ່ງທີ່ຂາດ (M) ທີ່ມີຢູ່ແລ້ວ. ຖ່າຍຮູບທັງສີ່ດ້ານ, ໜ້າປັດ (ເລກໄມລ໌ ແລະ ນ້ຳມັນ), ພາຍໃນ ແລະ ຄວາມເສຍຫາຍທຸກຈຸດ ທັງຕອນຮັບລົດ ແລະ ຕອນສົ່ງຄືນ.
  check_rows:
