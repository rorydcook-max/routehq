    en: Emergency contact (name and phone)
    local: អ្នកទំនាក់ទំនងពេលអាសន្ន (ឈ្មោះ និងលេខទូរស័ព្ទ)
  - key: driver2_details
    en: Additional driver (name, ID, licence), if any
    local: អ្នកបើកបរបន្ថែម (ឈ្មោះ អត្តសញ្ញាណ ប័ណ្ណបើកបរ) ប្រសិនបើមាន
  clauses:
  - id: renter.1
    en: The Renter confirms that the details above are true and complete, and that every person who will drive or ride the vehicle is named here. Only the Renter and any additional driver named above may drive or ride the vehicle.
    local: អ្នកជួលបញ្ជាក់ថា ព័ត៌មានខាងលើពិតប្រាកដ និងពេញលេញ ហើយអ្នកដែលនឹងបើកបរ ឬជិះយានយន្តទាំងអស់ មានឈ្មោះនៅទីនេះ។ មានតែអ្នកជួល និងអ្នកបើកបរបន្ថែមដែលមានឈ្មោះខាងលើប៉ុណ្ណោះ ដែលអាចបើកបរ ឬជិះយានយន្តបាន។
  - id: renter.2
    en: Every driver must hold any driving licence the law requires for this class of vehicle and carry it at all times while driving. For a car or a motorbike over 125cc, this is a Cambodian licence, or a foreign licence together with an International Driving Permit where the authorities accept it. Where the law does not require a licence (for some small motorbikes), the Renter must still be able to ride safely, and insurance may not apply to an unlicensed rider. A car licence does not allow a person to ride a motorbike.
    local: អ្នកបើកបរគ្រប់រូបត្រូវមានប័ណ្ណបើកបរដែលច្បាប់តម្រូវ សម្រាប់ប្រភេទយានយន្តនេះ ហើយត្រូវយកតាមខ្លួនជានិច្ចពេលបើកបរ។ សម្រាប់រថយន្ត ឬម៉ូតូលើសពី 125cc គឺប័ណ្ណបើកបរកម្ពុជា ឬប័ណ្ណបើកបរបរទេសរួមជាមួយប័ណ្ណបើកបរអន្តរជាតិ ក្នុងករណីដែលអាជ្ញាធរទទួលស្គាល់។ ក្នុងករណីដែលច្បាប់មិនតម្រូវឱ្យមានប័ណ្ណបើកបរ (សម្រាប់ម៉ូតូតូចៗមួយចំនួន) អ្នកជួលនៅតែត្រូវមានសមត្ថភាពជិះប្រកបដោយសុវត្ថិភាព ហើយធានារ៉ាប់រងអាចមិនអនុវត្តចំពោះអ្នកជិះដែលគ្មានប័ណ្ណបើកបរ។ ប័ណ្ណបើកបររថយន្ត មិនអនុញ្ញាតឱ្យជិះម៉ូតូទេ។
    country: true
- id: vehicle
  title:
    en: 3. The vehicle
    local: ៣. យានយន្ត
  fields:
  - key: vehicle_type_label
    en: Type
    local: ប្រភេទ
  - key: vehicle_make_model
    en: Make and model
    local: ម៉ាក និងម៉ូដែល
  - key: vehicle_year
    en: Year
    local: ឆ្នាំ
  - key: vehicle_plate
    en: Registration (plate) number
    local: ផ្លាកលេខ
  - key: vehicle_colour
    en: Colour
    local: ពណ៌
  - key: renter_vin
    en: Chassis / VIN number
    local: លេខតួ / VIN
  - key: out_odometer
    en: Odometer at handover
    local: លេខគីឡូម៉ែត្រ ពេលប្រគល់
  - key: out_fuel
    en: Fuel / battery level at handover
    local: កម្រិតប្រេង / ថ្ម ពេលប្រគល់
