      en: "Annex B: Damage and replacement price list"
      local: "Anlage B: Preisliste für Schäden und Ersatz"
    pricelist: true
    clauses:
      - id: annex_b.1
        en: Agreed prices for common damage and lost items, based on typical repair costs. Damage not listed is charged per section 12. Where a damage waiver applies, the Renter never pays more than the excess.
        local: Vereinbarte Preise für häufige Schäden und Verluste, auf Grundlage üblicher Reparaturkosten. Nicht aufgeführte Schäden werden nach Abschnitt 12 berechnet. Bei Haftungsfreistellung zahlt der Mieter nie mehr als die Selbstbeteiligung.
