# Türkiye (4 Nov 2026). English beside Turkish, in formal legal register. Written from the public sources listed below,
# not reviewed by a Turkish lawyer. Open points (things a public source did not settle) are listed at the end of this
# file as comments, not guessed into the clauses.
#
# Two regimes, both covered:
#  - Today: Turkish Code of Obligations No. 6098 (lease of movables), Consumer Protection Law No. 6502 and its
#    Regulation on Unfair Terms in Consumer Contracts, Highway Traffic Act No. 2918, Identity Notification Law No. 1774
#    (KABİS), KVKK No. 6698.
#  - From 1 Jan 2027: the Ministry of Trade's Regulation on the Rental of Motor Land Vehicles (Resmî Gazete 15 Aug 2026,
#    No. 33341) for short-term (up to 29 days) car and light-van rentals (M1, M1G, N1, N1G) to consumers: deposit caps,
#    refunds within 7 days, independent expert reports for damage, no charge for the first hour late, free cancellation up
#    to 24 hours before pickup. Motorbikes, scooters and quads are not in its definition, but the same terms are used for
#    them here because they are fair and the consumer-law test (Law 6502 art. 5) applies to every rental.
