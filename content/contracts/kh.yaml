sources:
- url: https://www.constituteproject.org/constitution/Cambodia_2008
  supports: 'Constitution of the Kingdom of Cambodia, Article 5: the official language and script is Khmer (basis for Khmer prevailing).'
- url: https://www.dfdl.com/insights/legal-and-tax-updates/cambodia-implementation-of-prakas-on-unfair-contract-terms
  supports: 'Law on Consumer Protection (2 Nov 2019) and Prakas 0067 on Unfair Contract Terms (1 Mar 2022): standard-form consumer contracts must be prepared in Khmer; clauses excluding or limiting the business operator''s liability, or allowing unilateral changes or arbitrary termination, are unfair.'
- url: https://www.dfdl.com/insights/legal-and-tax-updates/the-implementation-of-cambodias-new-civil-code/
  supports: 'Civil Code (Royal Kram NS/RKM/1207/030, 8 Dec 2007; in force 21 Dec 2011): contracts formed by consent; remedies for breach; advance exclusion of liability for intentional or grossly negligent non-performance is void; pre-agreed damages allowed.'
- url: https://www.smartraveller.gov.au/destinations/asia/cambodia
  supports: 'Australian Smartraveller: a car or motorcycle over 125cc needs a Cambodian licence, or a foreign licence plus IDP (carry both); up to 125cc can be ridden without a licence under Cambodian law; helmets compulsory; speeding fines paid at a payment centre within 30 days.'
- url: https://www.gov.uk/foreign-travel-advice/cambodia/safety-and-security
  supports: 'UK FCDO: to hire a car or motorcycle over 125cc you may need a 1949 IDP and national licence; long-term drivers need a Cambodian licence; on-the-spot fines for riding without a helmet; do not hand over a passport as a guarantee for a motorcycle or scooter.'
- url: https://khmer.voanews.com/a/new-law-to-address-the-high-death-toll-on-cambodia-roads/3121604.html
  supports: 'VOA (28 Dec 2015): new Road Traffic Law in force 1 Jan 2016; all riders on a motorbike, including a child passenger, must wear a helmet; Article 36 lets parties settle property-only accidents between themselves.'
- url: https://grsproadsafety.org/?p=713
  supports: Road Traffic Law approved by the Senate 30 Dec 2014 and signed by the King 9 Jan 2015; covers drink-driving, speeding, helmets, licensing and vehicle registration.
- url: https://www.tilleke.com/wp-content/uploads/2019/11/Insurance-and-reinsurance-in-Cambodia-overview-Tilleke-Gibbins-2019.pdf
  supports: 'Law on Insurance (2014): compulsory insurance for motor vehicles; third-party liability insurance for certain commercial motor vehicles as set by MEF prakas; implementing regulation status unclear (as of 2019).'
- url: https://www.insurancebusinessmag.com/asia/news/breaking-news/cambodia-regulator-eyes-stronger-uptake-of-compulsory-insurance-567080.aspx
  supports: 'Insurance Business Asia (3 Mar 2026): Insurance Regulator of Cambodia says the law requires motor third-party liability insurance for business vehicles, but implementation remains uneven.'
- url: https://treatydatabase.overheid.nl/en/Treaty/Details/007193_p
  supports: Cambodia acceded to the 1949 Geneva Convention on Road Traffic (14 Mar 1956), the convention behind the 1949-type International Driving Permit.
- url: https://m.phnompenhpost.com/national/siem-reap-reminded-tourist-moto-car-rental-ban
  supports: 'Phnom Penh Post (20 Nov 2017): Siem Reap governor reminded businesses that renting or lending motorbikes and cars to foreigners in Siem Reap town is forbidden (bicycles and e-bicycles excepted), a rule in place since 2002.'
- url: https://www.cambodianess.com/article/should-bicycle-and-motorcycle-rental-service-be-stopped-in-siem-reap
  supports: 'Cambodianess (7 Jan 2024): Siem Reap rental rules say international tourists may rent only bicycles or e-bikes; a later Cambodianess article (14 Oct 2026) describes the ban as a measure "previously implemented", so current enforcement is unclear.'
- url: https://travel.state.gov/content/travel/en/international-travel/International-Travel-Country-Information-Pages/Cambodia.html
  supports: 'US State Department: do not give your passport as collateral for motorcycle rentals; carry copies of passport and licence; cooperate with police after an accident.'
- url: https://www.gov.uk/foreign-travel-advice/cambodia/getting-help
  supports: 'UK FCDO emergency numbers for Cambodia: police 117, fire 118, ambulance 119.'
- url: https://www.hlc.com/en/publications/cambodia-moves-to-enact-comprehensive-data-privacy-law
  supports: 'Hogan Lovells (28 Jul 2025): Cambodia''s Law on Personal Data Protection was still a draft; no comprehensive data protection law in force at that date.'
- url: https://aseancob.org/coverage-and-blue-card
  supports: 'ASEAN Compulsory Motor Insurance (Blue Card) system for cross-border vehicles covers Cambodia, Laos and Thailand: separate cross-border insurance is needed.'
