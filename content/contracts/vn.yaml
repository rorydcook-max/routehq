jurisdiction: { en: "the Socialist Republic of Vietnam", local: "nước Cộng hòa xã hội chủ nghĩa Việt Nam" }
court_place: { en: "Vietnam, determined under the Civil Procedure Code", local: "Việt Nam, được xác định theo Bộ luật Tố tụng dân sự" }
words:
  per_day: { en: per day, local: "mỗi ngày" }
  per_week: { en: per week, local: "mỗi tuần" }
  per_month: { en: per month, local: "mỗi tháng" }
  day: { en: day, local: "ngày" }
  month: { en: month, local: "tháng" }
  days: { en: days, local: "ngày" }
  business_days: { en: business days after return, local: "ngày làm việc sau khi trả xe" }
  car: { en: Car, local: "Ô tô" }
  motorbike: { en: Motorbike / scooter, local: "Xe máy / xe tay ga" }
  ins_compulsory: { en: "Compulsory civil liability insurance only", local: "Chỉ có bảo hiểm bắt buộc trách nhiệm dân sự" }
  ins_third_party: { en: "Compulsory + voluntary third-party liability insurance", local: "Bảo hiểm bắt buộc + bảo hiểm tự nguyện trách nhiệm dân sự với bên thứ ba" }
  ins_comprehensive: { en: "Comprehensive insurance (incl. physical damage to the vehicle)", local: "Bảo hiểm toàn diện (gồm bảo hiểm vật chất xe)" }
  free: { en: Free, local: "Miễn phí" }
  payment_default: { en: "Cash, bank transfer or QR payment", local: "Tiền mặt, chuyển khoản ngân hàng hoặc thanh toán QR" }
