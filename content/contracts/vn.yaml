# Lokalfleet vehicle rental agreement — VIETNAM (English + Vietnamese, Vietnamese prevails).
# Structure copied from master.en.yaml. Country clauses adapted to Vietnamese law as checked in October 2026.
# Vietnam-only additions: vehicle.docs_cc (documents to carry), fines.camera_cc (camera fines / phạt nguội).
# Not legal advice. Sources listed under `sources`.

country: VN
locale: vi
language: Vietnamese
currency: VND
prevailing_language: { en: Vietnamese, local: "tiếng Việt" }
local_language: { en: Vietnamese, local: "tiếng Việt" }
