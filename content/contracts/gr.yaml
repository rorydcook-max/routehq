sources:
  - url: https://eur-lex.europa.eu/eli/dir/1993/13/oj
    supports: "Unfair Contract Terms Directive 93/13/EEC: terms must be plain and intelligible, doubts are read in the consumer's favor (Art 5), disproportionate compensation is unfair (Annex point e). Basis for general.4, general.7, deposit.2, damage.2."
  - url: https://eur-lex.europa.eu/eli/dir/2011/83/oj
    supports: "Consumer Rights Directive 2011/83/EU: total price including all compulsory charges (Arts 5-6); Art 16(l) no withdrawal right for car rental for a specific date or period (charges.1, cancellation.7)."
  - url: https://commission.europa.eu/topics/consumers/consumer-rights-and-complaints/enforcement-consumer-protection/coordinated-actions/other-travel-services_en
    supports: "EU consumer authorities (CPC) and the main rental companies, 2017: price transparency, clear insurance and waiver terms, fuel options and fairer damage handling. Basis for charges.1, insurance, fuel and damage.2."
  - url: https://eur-lex.europa.eu/eli/dir/2009/103/oj
    supports: "Motor Insurance Directive 2009/103/EC (as amended by 2021/2118): compulsory third-party cover with EU minimum amounts, valid across the EU (insurance.1)."
  - url: https://eur-lex.europa.eu/eli/dir/2006/126/oj
    supports: "Driving Licence Directive 2006/126/EC: categories AM, A1, A2, A and B; EU licenses recognized in every member state (renter.2)."
  - url: https://eur-lex.europa.eu/eli/dir/2015/413/oj
    supports: "Directive (EU) 2015/413: cross-border exchange of vehicle registration data for road-safety offenses, so fines follow foreign renters (fines.1)."
  - url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
    supports: "GDPR: controller duties, lawful bases (contract, legal obligation for giving driver details to authorities, legitimate interest), data subject rights (data.1, data.2)."
  - url: https://eur-lex.europa.eu/eli/reg/2014/910/oj
    supports: "eIDAS Regulation Art 25(1): an electronic signature may not be denied legal effect solely because it is electronic (general.8)."
  - url: https://eur-lex.europa.eu/eli/reg/2008/593/oj
    supports: "Rome I Regulation Art 6: consumer contracts and mandatory protection of the consumer's own law (general.5, general.7)."
  - url: https://eur-lex.europa.eu/eli/reg/2012/1215/oj
    supports: "Brussels I bis Regulation Arts 17-19: a consumer may sue in the courts where they live when the business directs its activities to that country (general.5)."
  - url: https://www.ccpc.ie/news-and-media/news/article/2026/06/16/consumer-rights-explained--i-think-my-holiday-car-hire-firm-is-trying-to-rip-me-off-what-are-my-rights
    supports: "CCPC (Irish consumer authority), 2026: damage may be charged only with clear evidence it happened during the rental; renters can ask for inspection reports and a cost breakdown; ECRCS conciliation (damage.2)."
  - url: https://www.rac.co.uk/drive/travel/country/greece
    supports: "RAC Greece: IDP not needed with a UK license; children under 12 / 1.35 m need a restraint; crash helmets compulsory for moped and motorcycle riders; 0.05% limit, 0.02% for professional and new drivers; usual minimum hire age 21; check before taking the car out of Greece (renter.2, use.2, use.3, use.4, area.2)."
  - url: https://www.athenstoolkit.com/2025/11/new-traffic-law-in-greece-Sept-2025.html
    supports: "New Greek Highway Code (Law 5209/2025) in force since 2025: higher fines, camera enforcement, license and plate removal for serious offenses (fines.2)."
  - url: https://www.iefimerida.gr/english/greece-bans-rental-scooters-and-quads-without-helmets-and-bars-minors-e-scooters-tourism
    supports: "June 2026 announcement: rental firms not to hand over motorcycles, scooters or quads without helmets; quad renters to have held a license for five years. Proposal only, not confirmed in force; not written into this agreement as law (open item)."
  - url: https://zeya.com/newsletters/amendment-and-codification-law-consumers-protection-law-22511994
    supports: "Law 2251/1994 on consumer protection, Article 2: unfair general terms (general.7)."
  - url: https://www.dpa.gr/
    supports: Hellenic Data Protection Authority; Law 4624/2019 implementing the GDPR (data.2).
title:
  en: Vehicle Rental Agreement
  local: Σύμβαση μίσθωσης οχήματος
subtitle:
  en: Self-drive car, motorbike, scooter and quad rental. {{country_name}}
  local: Μίσθωση αυτοκινήτων, μοτοσικλετών, σκούτερ και γουρουνών (ATV) χωρίς οδηγό. {{country_name}}
footer:
  en: Vehicle rental agreement · {{business_name}}
  local: Σύμβαση μίσθωσης οχήματος · {{business_name}}
page_words:
  page: Σελίδα
  of: από
sections:
  - id: parties
    title:
      en: 1. The parties
      local: 1. Τα συμβαλλόμενα μέρη
    fields:
      - key: business_name
        en: Owner (rental business)
        local: Εκμισθωτής (επιχείρηση ενοικίασης)
      - key: business_reg_no
        en: Company / VAT registration number
        local: ΑΦΜ / αριθμός ΓΕΜΗ
      - key: business_address
        en: Business address
        local: Διεύθυνση επιχείρησης
      - key: business_phone
        en: Phone / WhatsApp
        local: Τηλέφωνο / WhatsApp
      - key: business_email
        en: Email
        local: Email
    clauses:
      - id: parties.1
        en: This agreement is made on {{renter_contract_date}} between the rental business named above (the "Owner") and the person named in section 2 (the "Renter"). Where there is more than one renter or driver, each of them is jointly responsible for every obligation in this agreement.
        local: Η παρούσα σύμβαση συνάπτεται στις {{renter_contract_date}} μεταξύ της επιχείρησης ενοικίασης που αναφέρεται παραπάνω (ο «Εκμισθωτής») και του προσώπου της ενότητας 2 (ο «Μισθωτής»). Αν υπάρχουν περισσότεροι μισθωτές ή οδηγοί, ο καθένας ευθύνεται εις ολόκληρον για όλες τις υποχρεώσεις της σύμβασης.
  - id: renter
    title:
      en: 2. The Renter and drivers
      local: 2. Ο Μισθωτής και οι οδηγοί
    fields:
      - key: renter_name
        en: Full name (as on passport or ID)
        local: Ονοματεπώνυμο (όπως στο διαβατήριο ή την ταυτότητα)
      - key: renter_nationality
        en: Nationality
        local: Υπηκοότητα
      - key: renter_dob
        en: Date of birth
        local: Ημερομηνία γέννησης
      - key: renter_id_no
        en: Passport or national ID number
        local: Αριθμός διαβατηρίου ή ταυτότητας
      - key: renter_home_address
        en: Home address
        local: Διεύθυνση κατοικίας
      - key: renter_local_address
        en: Address during the rental (hotel / apartment)
        local: Διεύθυνση κατά τη μίσθωση (ξενοδοχείο / κατάλυμα)
      - key: renter_phone
        en: Phone / WhatsApp
        local: Τηλέφωνο / WhatsApp
      - key: renter_email
        en: Email
        local: Email
      - key: renter_licence
        en: Driver's license number, categories and issuing country
        local: Αριθμός άδειας οδήγησης, κατηγορίες και χώρα έκδοσης
      - key: renter_licence_expiry
        en: License expiry date / date first issued
        local: Λήξη άδειας / ημερομηνία πρώτης έκδοσης
      - key: renter_idp
        en: International Driving Permit (number / not required)
        local: Διεθνής άδεια οδήγησης (αριθμός / δεν απαιτείται)
      - key: renter_emergency
        en: Emergency contact (name and phone)
        local: Επαφή έκτακτης ανάγκης (όνομα και τηλέφωνο)
      - key: driver2_details
        en: Additional driver (name, ID, license), if any
        local: Πρόσθετος οδηγός (όνομα, ταυτότητα, άδεια), εφόσον υπάρχει
    clauses:
      - id: renter.1
        en: The Renter confirms that the details above are true and complete, and that every person who will drive or ride the vehicle is named here. Only the Renter and any additional driver named above may drive or ride the vehicle.
        local: Ο Μισθωτής βεβαιώνει ότι τα παραπάνω στοιχεία είναι αληθή και πλήρη και ότι αναφέρονται όλα τα πρόσωπα που θα οδηγήσουν το όχημα. Μόνο ο Μισθωτής και ο πρόσθετος οδηγός που αναφέρεται επιτρέπεται να το οδηγούν.
      - id: renter.2
        en: "Every driver must hold a full, valid driver's license for this class of vehicle: category B for cars; for motorcycles and scooters, category AM, A1, A2 or A as the engine requires (a car license does not cover motorcycles); for quads (ATVs), the category the vehicle's registration requires, which the Owner checks at handover. Licenses from the EU and EEA are valid; a visitor with another license must also carry an International Driving Permit unless Greece accepts that license on its own (as it does UK licenses)."
        local: "Κάθε οδηγός πρέπει να έχει πλήρη, έγκυρη άδεια οδήγησης για την κατηγορία του οχήματος: κατηγορία Β για αυτοκίνητα· για μοτοσικλέτες και σκούτερ, κατηγορία AM, A1, A2 ή A ανάλογα με τον κινητήρα (η άδεια αυτοκινήτου δεν καλύπτει μοτοσικλέτες)· για γουρούνες (ATV), την κατηγορία που απαιτεί η άδεια κυκλοφορίας του οχήματος, την οποία ελέγχει ο Εκμισθωτής κατά την παράδοση. Οι άδειες της ΕΕ και του ΕΟΧ ισχύουν· επισκέπτης με άλλη άδεια πρέπει να φέρει και Διεθνή Άδεια Οδήγησης, εκτός αν η Ελλάδα αναγνωρίζει την άδειά του αυτοτελώς (όπως τις άδειες του Ηνωμένου Βασιλείου)."
        country: true
      - id: renter.3
        en: Each driver must meet the minimum age and the minimum period of holding a full license that the Owner stated at booking. Any young-driver or additional-driver charge is shown in this agreement before it is signed.
        local: Κάθε οδηγός πρέπει να έχει την ελάχιστη ηλικία και τον ελάχιστο χρόνο κατοχής άδειας που δήλωσε ο Εκμισθωτής κατά την κράτηση. Κάθε επιβάρυνση για νέο ή πρόσθετο οδηγό αναγράφεται στη σύμβαση πριν από την υπογραφή.
  - id: vehicle
    title:
      en: 3. The vehicle
      local: 3. Το όχημα
    fields:
      - key: vehicle_type_label
        en: Type
        local: Τύπος
      - key: vehicle_make_model
        en: Make and model
        local: Μάρκα και μοντέλο
      - key: vehicle_year
        en: Year
        local: Έτος
      - key: vehicle_plate
        en: Registration (plate) number
        local: Αριθμός κυκλοφορίας
      - key: vehicle_colour
        en: Color
        local: Χρώμα
      - key: renter_vin
        en: Chassis / VIN number
        local: Αριθμός πλαισίου (VIN)
      - key: out_odometer
        en: Odometer at handover
        local: Χιλιόμετρα κατά την παράδοση
      - key: out_fuel
        en: Fuel / battery level at handover
        local: Στάθμη καυσίμου / μπαταρίας κατά την παράδοση
      - key: renter_accessories
        en: Accessories handed over (helmets, keys, child seat, warning triangle, vest, etc.)
        local: Εξοπλισμός που παραδόθηκε (κράνη, κλειδιά, παιδικό κάθισμα, τρίγωνο, γιλέκο κ.λπ.)
    clauses:
      - id: vehicle.1
        en: The Owner rents the vehicle described above, with the accessories listed, to the Renter for the rental period and on the terms of this agreement. The vehicle remains the property of the Owner at all times.
        local: Ο Εκμισθωτής εκμισθώνει στον Μισθωτή το όχημα που περιγράφεται, με τον εξοπλισμό που αναφέρεται, για τη διάρκεια της μίσθωσης και με τους όρους της σύμβασης. Το όχημα παραμένει πάντα ιδιοκτησία του Εκμισθωτή.
      - id: vehicle.2
        en: The Owner confirms that the vehicle is registered, has a valid roadworthiness test where one is required (KTEO), and has compulsory motor insurance valid for the whole rental period, and that it is handed over roadworthy, with the documents and safety equipment the law requires to be carried.
        local: Ο Εκμισθωτής βεβαιώνει ότι το όχημα είναι ταξινομημένο, έχει σε ισχύ τεχνικό έλεγχο όπου απαιτείται (ΚΤΕΟ) και υποχρεωτική ασφάλιση για όλη τη μίσθωση, και ότι παραδίδεται σε καλή κατάσταση, με τα έγγραφα και τον εξοπλισμό ασφαλείας που απαιτεί ο νόμος.
        country: true
      - id: vehicle.3
        en: The Owner keeps the vehicle serviced as the manufacturer recommends and pays for normal mechanical repairs and wear unless this agreement says otherwise. On longer rentals the Owner arranges servicing with the Renter at a convenient time; if servicing takes more than one day, section 13 applies.
        local: Ο Εκμισθωτής συντηρεί το όχημα σύμφωνα με τον κατασκευαστή και αναλαμβάνει τις συνήθεις μηχανικές επισκευές και τη φθορά, εκτός αν η σύμβαση ορίζει διαφορετικά. Σε μακροχρόνιες μισθώσεις συμφωνεί τη συντήρηση με τον Μισθωτή σε κατάλληλη ώρα· αν διαρκέσει πάνω από μία ημέρα, εφαρμόζεται η ενότητα 13.
      - id: vehicle.4
        en: "During the rental the Renter looks after the vehicle's day-to-day condition: checking that tires, lights, brakes, oil and coolant look normal, and not driving or riding it if it becomes unsafe or unroadworthy."
        local: "Κατά τη μίσθωση ο Μισθωτής φροντίζει την καθημερινή κατάσταση του οχήματος: ελέγχει ότι ελαστικά, φώτα, φρένα, λάδια και ψυκτικό φαίνονται κανονικά και δεν το χρησιμοποιεί αν δεν είναι πλέον ασφαλές."
  - id: period
    title:
      en: 4. Rental period, pickup and return
      local: 4. Διάρκεια μίσθωσης, παραλαβή και επιστροφή
    fields:
      - key: renter_start
        en: Start (date and time)
        local: Έναρξη (ημερομηνία και ώρα)
      - key: renter_end
        en: End (date and time)
        local: Λήξη (ημερομηνία και ώρα)
      - key: renter_pickup_place
        en: Pickup / delivery place
        local: Τόπος παραλαβής / παράδοσης
      - key: renter_return_place
        en: Return / collection place
        local: Τόπος επιστροφής / παραλαβής
    clauses:
      - id: period.1
        en: The Renter must return the vehicle at the agreed place, date and time. An extension is valid only when the Owner agrees to it in writing (a message is enough) and the extra rent is paid.
        local: Ο Μισθωτής πρέπει να επιστρέψει το όχημα στον συμφωνημένο τόπο, ημερομηνία και ώρα. Παράταση ισχύει μόνο αν ο Εκμισθωτής τη δεχτεί γραπτώς (αρκεί ένα μήνυμα) και πληρωθεί το επιπλέον μίσθωμα.
      - id: period.2
        if: late_hour_fee
        en: "Late return: after a grace period of {{late_grace_minutes}} minutes, each started hour costs {{currency}} {{late_hour_fee}}. A return more than {{late_full_day_hours}} hours late is charged as an extra full day at the daily rate."
        local: "Καθυστερημένη επιστροφή: μετά από ανοχή {{late_grace_minutes}} λεπτών, κάθε ώρα που αρχίζει κοστίζει {{currency}} {{late_hour_fee}}. Καθυστέρηση άνω των {{late_full_day_hours}} ωρών χρεώνεται ως επιπλέον ημέρα με την ημερήσια τιμή."
      - id: period.3
        unless: late_hour_fee
        en: "Late return: a return more than one hour late may be charged as an extra day at the daily rate."
        local: "Καθυστερημένη επιστροφή: καθυστέρηση άνω της μίας ώρας μπορεί να χρεωθεί ως επιπλέον ημέρα με την ημερήσια τιμή."
      - id: period.4
        en: If the vehicle is not returned and the Renter cannot be reached within 24 hours of the end time, the Owner may report it to the police and recover it, at the Renter's reasonable cost.
        local: Αν το όχημα δεν επιστραφεί και ο Μισθωτής δεν είναι προσβάσιμος εντός 24 ωρών από τη λήξη, ο Εκμισθωτής μπορεί να το δηλώσει στην αστυνομία και να το ανακτήσει, με εύλογη δαπάνη του Μισθωτή.
      - id: period.5
        when:
          rate_period: month
        en: "Rolling monthly rental: where no end date is written above, the rental continues from month to month on the same terms until either party ends it as set out in section 7."
        local: "Μηνιαία μίσθωση που ανανεώνεται: αν δεν αναγράφεται ημερομηνία λήξης, η μίσθωση συνεχίζεται από μήνα σε μήνα με τους ίδιους όρους μέχρι να τη λύσει ένα από τα μέρη κατά την ενότητα 7."
  - id: charges
    title:
      en: 5. Price and payment
      local: 5. Τιμή και πληρωμή
    fields:
      - key: rate_text
        en: Rental rate
        local: Τιμή μίσθωσης
      - key: renter_total
        en: Total price for this booking (all compulsory charges included)
        local: Συνολική τιμή κράτησης (με όλες τις υποχρεωτικές χρεώσεις)
      - key: delivery_fee_text
        en: Delivery / collection fee
        local: Χρέωση παράδοσης / παραλαβής
      - key: payment_methods
        en: Payment methods accepted
        local: Αποδεκτοί τρόποι πληρωμής
    clauses:
      - id: charges.1
        en: The Renter pays the price stated above in advance, unless the Owner agrees otherwise in writing. Prices are in {{currency_name}}, include VAT and every charge the Renter must pay (such as location surcharges, road tax and compulsory insurance), and show optional extras separately.
        local: Ο Μισθωτής πληρώνει την αναγραφόμενη τιμή προκαταβολικά, εκτός αν ο Εκμισθωτής συμφωνήσει γραπτώς διαφορετικά. Οι τιμές είναι σε {{currency_name}}, περιλαμβάνουν ΦΠΑ και κάθε χρέωση που οφείλει ο Μισθωτής (όπως επιβαρύνσεις τοποθεσίας, τέλη κυκλοφορίας και υποχρεωτική ασφάλιση), και οι προαιρετικές παροχές αναγράφονται χωριστά.
      - id: charges.2
        when:
          rate_period: month
        en: "Monthly rentals: rent is paid monthly in advance on the same day each month. If a payment is more than 7 days late and the Owner has reminded the Renter in writing, the Owner may end the rental and collect the vehicle (section 15)."
        local: "Μηνιαίες μισθώσεις: το μίσθωμα καταβάλλεται μηνιαίως προκαταβολικά την ίδια ημέρα κάθε μήνα. Αν μια πληρωμή καθυστερήσει πάνω από 7 ημέρες και ο Εκμισθωτής την έχει ζητήσει γραπτώς, μπορεί να λύσει τη μίσθωση και να παραλάβει το όχημα (ενότητα 15)."
      - id: charges.3
        en: Extras (child seats, delivery, additional drivers, excess reduction, snow chains and similar) cost what is written in this agreement or what the Owner confirmed in writing before the rental.
        local: Οι πρόσθετες παροχές (παιδικά καθίσματα, παράδοση, πρόσθετοι οδηγοί, μείωση απαλλαγής, αλυσίδες χιονιού κ.λπ.) κοστίζουν όσα αναγράφονται στη σύμβαση ή επιβεβαίωσε γραπτώς ο Εκμισθωτής πριν από τη μίσθωση.
  - id: deposit
    title:
      en: 6. Security deposit
      local: 6. Εγγύηση
    fields:
      - key: deposit_text
        en: Deposit
        local: Εγγύηση
      - key: renter_deposit_method
        en: Paid by (card hold / transfer / cash)
        local: Καταβλήθηκε με (δέσμευση κάρτας / μεταφορά / μετρητά)
      - key: deposit_return_text
        en: Returned or released within
        local: Επιστρέφεται ή αποδεσμεύεται εντός
    clauses:
      - id: deposit.1
        en: "The deposit secures the Renter's obligations: unpaid rent, damage up to the amount the Renter is liable for, fuel, mileage, cleaning, late return, lost keys or accessories and any other amount owed under this agreement."
        local: "Η εγγύηση εξασφαλίζει τις υποχρεώσεις του Μισθωτή: απλήρωτο μίσθωμα, ζημιές έως το ποσό για το οποίο ευθύνεται, καύσιμα, χιλιόμετρα, καθαρισμό, καθυστερημένη επιστροφή, χαμένα κλειδιά ή εξοπλισμό και κάθε άλλο ποσό που οφείλεται βάσει της σύμβασης."
      - id: deposit.2
        en: The Owner returns the deposit (or releases the card hold) after the vehicle has been returned and checked, less only amounts the Renter actually owes under this agreement. Each deduction is listed in writing with photos, receipts or quotes. If the amounts owed are more than the deposit, the Renter pays the difference within 14 days of receiving that list.
        local: Ο Εκμισθωτής επιστρέφει την εγγύηση (ή αποδεσμεύει την κάρτα) μετά την επιστροφή και τον έλεγχο του οχήματος, αφαιρώντας μόνο τα ποσά που ο Μισθωτής πράγματι οφείλει βάσει της σύμβασης. Κάθε αφαίρεση αναλύεται γραπτώς με φωτογραφίες, αποδείξεις ή προσφορές. Αν τα οφειλόμενα υπερβαίνουν την εγγύηση, ο Μισθωτής πληρώνει τη διαφορά εντός 14 ημερών από την παραλαβή της ανάλυσης.
      - id: deposit.3
        en: The Owner does not hold back the deposit to wait for traffic fines. A fine that arrives after the rental is charged as set out in section 14.
        local: Ο Εκμισθωτής δεν παρακρατεί την εγγύηση περιμένοντας πρόστιμα. Πρόστιμο που φτάνει μετά τη μίσθωση χρεώνεται κατά την ενότητα 14.
      - id: deposit.4
        en: The Owner will not keep the Renter's passport or identity card as a deposit. The Owner may check them and keep a copy to identify the Renter (section 17).
        local: Ο Εκμισθωτής δεν θα κρατήσει το διαβατήριο ή την ταυτότητα του Μισθωτή ως εγγύηση. Μπορεί να τα ελέγξει και να κρατήσει αντίγραφο για την ταυτοποίησή του (ενότητα 17).
  - id: cancellation
    title:
      en: 7. Cancellation and early return
      local: 7. Ακύρωση και πρόωρη επιστροφή
    clauses:
      - id: cancellation.1
        if: cancel_free_hours
        en: The Renter may cancel free of charge up to {{cancel_free_hours}} hours before the start time. A later cancellation costs {{cancel_fee_percent}}% of the rent for the booked period (or of the first month on a monthly rental). If the Renter does not arrive at the start time and does not tell the Owner (a no-show), the Owner may keep the amount paid for the first {{no_show_days}} day(s) and release the vehicle.
        local: Ο Μισθωτής μπορεί να ακυρώσει δωρεάν έως {{cancel_free_hours}} ώρες πριν από την έναρξη. Μεταγενέστερη ακύρωση κοστίζει το {{cancel_fee_percent}}% του μισθώματος της κρατημένης περιόδου (ή του πρώτου μήνα σε μηνιαία μίσθωση). Αν ο Μισθωτής δεν εμφανιστεί κατά την έναρξη χωρίς ειδοποίηση, ο Εκμισθωτής μπορεί να κρατήσει το ποσό της πρώτης ή των πρώτων {{no_show_days}} ημερών και να διαθέσει το όχημα.
      - id: cancellation.2
        unless: cancel_free_hours
        en: "Cancellation by the Renter before the start time: the Owner keeps only a booking payment that the booking confirmation clearly said was non-refundable, and refunds the rest."
        local: "Ακύρωση από τον Μισθωτή πριν από την έναρξη: ο Εκμισθωτής κρατά μόνο την προκαταβολή που η επιβεβαίωση κράτησης ανέφερε σαφώς ως μη επιστρεπτέα και επιστρέφει τα υπόλοιπα."
      - id: cancellation.3
        when:
          early_return: none
        en: "Early return: rent for the booked period is not refunded if the Renter returns the vehicle early."
        local: "Πρόωρη επιστροφή: το μίσθωμα της κρατημένης περιόδου δεν επιστρέφεται αν ο Μισθωτής επιστρέψει νωρίτερα το όχημα."
      - id: cancellation.4
        when:
          early_return: prorata
        en: "Early return: the Owner refunds the rent for the full unused days, less an early-return fee of {{currency}} {{early_return_fee}}. Long-term discounts that no longer apply may be recalculated at the rate for the period actually used."
        local: "Πρόωρη επιστροφή: ο Εκμισθωτής επιστρέφει το μίσθωμα για τις ολόκληρες αχρησιμοποίητες ημέρες, μείον χρέωση {{currency}} {{early_return_fee}}. Οι εκπτώσεις μακροχρόνιας μίσθωσης που δεν ισχύουν πλέον μπορούν να υπολογιστούν εκ νέου με την τιμή της περιόδου που χρησιμοποιήθηκε."
      - id: cancellation.5
        when:
          rate_period: month
        en: "Monthly rentals: either party may end the rental by giving {{notice_days}} days' written notice. Without notice, the Renter pays rent for the notice period."
        local: "Μηνιαίες μισθώσεις: κάθε μέρος μπορεί να λύσει τη μίσθωση με γραπτή προειδοποίηση {{notice_days}} ημερών. Χωρίς προειδοποίηση, ο Μισθωτής πληρώνει το μίσθωμα της περιόδου προειδοποίησης."
      - id: cancellation.6
        en: If the Owner cannot provide the vehicle (or a similar or better one) at the start time, the Renter may cancel and receive a full refund of everything paid.
        local: Αν ο Εκμισθωτής δεν μπορεί να διαθέσει το όχημα (ή παρόμοιο ή καλύτερο) κατά την έναρξη, ο Μισθωτής μπορεί να ακυρώσει και να λάβει πίσω όλα τα ποσά που πλήρωσε.
      - id: cancellation.7
        en: This rental is for specific dates, so the 14-day right of withdrawal for contracts made online or by phone does not apply (Directive 2011/83/EU, Article 16(l)).
        local: Η μίσθωση αφορά συγκεκριμένες ημερομηνίες, οπότε δεν ισχύει το δικαίωμα υπαναχώρησης 14 ημερών για συμβάσεις που συνάπτονται διαδικτυακά ή τηλεφωνικά (Οδηγία 2011/83/ΕΕ, άρθρο 16).
  - id: fuel
    title:
      en: 8. Fuel, charging and mileage
      local: 8. Καύσιμα, φόρτιση και χιλιόμετρα
    clauses:
      - id: fuel.1
        when:
          fuel_policy: same
        en: "Fuel policy: same-to-same. The vehicle must be returned with at least the fuel (or battery) level it had at handover."
        local: "Πολιτική καυσίμου: ίδια στάθμη. Το όχημα επιστρέφεται με τουλάχιστον τη στάθμη καυσίμου (ή μπαταρίας) που είχε κατά την παράδοση."
      - id: fuel.2
        when:
          fuel_policy: full
        en: "Fuel policy: full-to-full. The vehicle is handed over with a full tank and must be returned full."
        local: "Πολιτική καυσίμου: γεμάτο-γεμάτο. Το όχημα παραδίδεται με γεμάτο ρεζερβουάρ και επιστρέφεται γεμάτο."
      - id: fuel.3
        en: Missing fuel is charged at the local pump price for the amount needed{{#if fuel_service_fee}}, plus a refuelling service fee of {{currency}} {{fuel_service_fee}}{{/if}}.
        local: Το καύσιμο που λείπει χρεώνεται με την τοπική τιμή αντλίας για την απαιτούμενη ποσότητα{{#if fuel_service_fee}}, πλέον τέλους υπηρεσίας ανεφοδιασμού {{currency}} {{fuel_service_fee}}{{/if}}.
      - id: fuel.4
        if: mileage_limit
        en: "Mileage allowance: {{mileage_limit}} km per {{mileage_period_label}}. Each extra kilometer costs {{currency}} {{excess_km_fee}}."
        local: "Χιλιόμετρα που περιλαμβάνονται: {{mileage_limit}} χλμ. ανά {{mileage_period_label}}. Κάθε επιπλέον χιλιόμετρο κοστίζει {{currency}} {{excess_km_fee}}."
      - id: fuel.5
        unless: mileage_limit
        en: "Mileage: unlimited, within the permitted area (section 10)."
        local: "Χιλιόμετρα: απεριόριστα, εντός της επιτρεπόμενης περιοχής (ενότητα 10)."
      - id: fuel.6
        en: The Renter must not tamper with the odometer, speed limiter or GPS tracker. Tampering is a serious breach (section 15).
        local: Ο Μισθωτής δεν πρέπει να παρεμβαίνει στον χιλιομετρητή, τον περιοριστή ταχύτητας ή τη συσκευή GPS. Η παρέμβαση αποτελεί σοβαρή παράβαση (ενότητα 15).
      - id: fuel.7
        en: Only the fuel type stated by the manufacturer (or in the vehicle's documents) may be used. If the wrong fuel is put in, the Renter pays the actual, evidenced cost of draining the tank and of any repair it causes.
        local: Επιτρέπεται μόνο το καύσιμο που ορίζει ο κατασκευαστής (ή τα έγγραφα του οχήματος). Σε περίπτωση λάθους καυσίμου, ο Μισθωτής πληρώνει το πραγματικό, αποδεδειγμένο κόστος αποστράγγισης και κάθε επισκευής που προκαλείται.
  - id: use
    title:
      en: 9. Safe and lawful use
      local: 9. Ασφαλής και νόμιμη χρήση
    clauses:
      - id: use.1
        en: The Renter must drive or ride carefully, obey all traffic laws, and keep the vehicle locked with the keys removed whenever it is left. Keys must never be left in or on the vehicle.
        local: Ο Μισθωτής οδηγεί προσεκτικά, τηρεί όλους τους κανόνες κυκλοφορίας και αφήνει πάντα το όχημα κλειδωμένο, χωρίς τα κλειδιά. Τα κλειδιά δεν πρέπει ποτέ να μένουν μέσα ή πάνω στο όχημα.
      - id: use.2
        when:
          vehicle_type:
            - motorbike
            - ""
        en: "Motorbikes, scooters and quads: the rider and any passenger must wear a fastened, approved helmet at all times; the Owner provides helmets. Quads (ATVs) must not be ridden on beaches, dunes or off-road tracks. No more than one passenger, and only where the vehicle is approved to carry one."
        local: "Μοτοσικλέτες, σκούτερ και γουρούνες: ο οδηγός και ο συνεπιβάτης φορούν πάντα εγκεκριμένο, δεμένο κράνος· τα κράνη τα παρέχει ο Εκμισθωτής. Οι γουρούνες (ATV) δεν επιτρέπεται να κινούνται σε παραλίες, αμμοθίνες ή χωματόδρομους εκτός δικτύου. Το πολύ ένας συνεπιβάτης, και μόνο αν το όχημα είναι εγκεκριμένο για αυτό."
        country: true
      - id: use.3
        when:
          vehicle_type:
            - car
            - ""
        en: "Cars: every occupant must wear a seatbelt, and children under 12 years old and under 135 cm must travel in an approved child restraint suited to their weight and height. The number of passengers must not exceed the number of seats."
        local: "Αυτοκίνητα: όλοι οι επιβάτες φορούν ζώνη ασφαλείας και τα παιδιά κάτω των 12 ετών και κάτω από 1,35 μ. ταξιδεύουν σε εγκεκριμένο σύστημα συγκράτησης κατάλληλο για το βάρος και το ύψος τους. Οι επιβάτες δεν υπερβαίνουν τις θέσεις."
        country: true
      - id: use.4
        en: "It is forbidden to: drive with alcohol above the legal limit (0.5 g/l in blood (0.25 mg/l in breath); 0.2 g/l for drivers in their first two years, professional drivers and riders of motorcycles, mopeds and quads) or under the influence of drugs; use a hand-held phone while driving; race, perform stunts or drive off-road (unless the vehicle is meant for it and the Owner agreed); tow or push anything; carry {{#if commercial_use_banned}}goods for payment, {{/if}}illegal goods or dangerous loads; use the vehicle for {{#if commercial_use_banned}}ride-hailing, delivery work, {{/if}}driving lessons or to rent it to anyone else; let anyone not named in section 2 drive or ride."
        local: "Απαγορεύεται: η οδήγηση με αλκοόλ πάνω από το νόμιμο όριο (0,5 g/l στο αίμα (0,25 mg/l στον εκπνεόμενο αέρα)· 0,2 g/l για οδηγούς στα πρώτα δύο έτη, επαγγελματίες και οδηγούς μοτοσικλετών, μοτοποδηλάτων και γουρουνών) ή υπό την επήρεια ουσιών· η χρήση κινητού στο χέρι κατά την οδήγηση· οι αγώνες, τα ακροβατικά ή η οδήγηση εκτός δρόμου (εκτός αν το όχημα προορίζεται για αυτό και συμφωνεί ο Εκμισθωτής)· η ρυμούλκηση ή ώθηση οτιδήποτε· η μεταφορά {{#if commercial_use_banned}}εμπορευμάτων έναντι αμοιβής, {{/if}}παράνομων αγαθών ή επικίνδυνων φορτίων· η χρήση για {{#if commercial_use_banned}}μεταφορά επιβατών, διανομές, {{/if}}σχολή οδηγών ή υπεκμίσθωση· η οδήγηση από πρόσωπο που δεν αναφέρεται στην ενότητα 2."
        country: true
      - id: use.9
        en: "No subletting or lending: the Renter must not sublet, rent out, lend or hand over the vehicle to anyone else, or let anyone not named in section 2 drive or ride it. Breaking this rule is a serious breach of this agreement."
        local: "Απαγόρευση υπεκμίσθωσης και δανεισμού: ο Μισθωτής δεν επιτρέπεται να υπεκμισθώσει, να εκμισθώσει, να δανείσει ή να παραδώσει το όχημα σε άλλο πρόσωπο, ούτε να επιτρέψει την οδήγησή του από πρόσωπο που δεν αναφέρεται στην ενότητα 2. Η παράβαση αυτού του όρου αποτελεί σοβαρή παράβαση της σύμβασης."
      - id: use.10
        when: { commercial_use: "yes" }
        en: "Paid rides and deliveries. The Renter may use the vehicle to carry passengers or deliver food or goods for payment, including through ride-hailing or delivery apps, on these conditions: (a) the Renter holds, and keeps valid, every license, permit and registration the law requires for that work, such as a ride-hailing or commercial driver permit where one applies; (b) the vehicle's standard insurance may not cover paid passenger or delivery use, so the Renter must have insurance suitable for that use, or use the app's own cover where it applies; (c) the Renter follows the app's rules and the law; (d) the Renter is responsible for any fines, damage and wear arising from that use; (e) subletting, lending and drivers not named in this agreement remain forbidden; (f) the vehicle's insurance terms and any extra deposit, mileage limit or other terms in this agreement still apply."
        local: "Μεταφορές επιβατών και διανομές έναντι αμοιβής. Ο Μισθωτής μπορεί να χρησιμοποιεί το όχημα για μεταφορά επιβατών ή διανομή φαγητού ή αγαθών έναντι αμοιβής, και μέσω εφαρμογών μεταφοράς ή διανομής, υπό τους εξής όρους: (α) ο Μισθωτής διαθέτει, και διατηρεί σε ισχύ, κάθε άδεια, έγκριση και εγγραφή που απαιτεί ο νόμος για την εργασία αυτή, όπως άδεια μεταφοράς επιβατών μέσω εφαρμογής ή επαγγελματική άδεια οδήγησης όπου απαιτείται· (β) η συνήθης ασφάλιση του οχήματος ενδέχεται να μην καλύπτει τη μεταφορά επιβατών ή τις διανομές έναντι αμοιβής, γι' αυτό ο Μισθωτής πρέπει να έχει ασφάλιση κατάλληλη για τη χρήση αυτή ή να χρησιμοποιεί την κάλυψη της εφαρμογής όπου υπάρχει· (γ) ο Μισθωτής τηρεί τους κανόνες της εφαρμογής και τον νόμο· (δ) ο Μισθωτής ευθύνεται για πρόστιμα, ζημίες και φθορές που προκύπτουν από τη χρήση αυτή· (ε) η υπεκμίσθωση, ο δανεισμός και οδηγοί που δεν αναφέρονται στη σύμβαση εξακολουθούν να απαγορεύονται· (στ) οι ασφαλιστικοί όροι του οχήματος και κάθε πρόσθετη εγγύηση, όριο χιλιομέτρων ή άλλος όρος της σύμβασης εξακολουθούν να ισχύουν."
      - id: use.5
        when:
          smoking: no
        en: Smoking and vaping are not allowed in the vehicle.{{#if smoking_fee}} Breaking this rule costs a fee of {{currency}} {{smoking_fee}} for odor removal.{{/if}}
        local: Το κάπνισμα και το ηλεκτρονικό τσιγάρο απαγορεύονται στο όχημα.{{#if smoking_fee}} Η παράβαση κοστίζει {{currency}} {{smoking_fee}} για απομάκρυνση οσμών.{{/if}}
      - id: use.6
        when:
          pets: no
        en: Pets and animals are not allowed in or on the vehicle, except assistance animals.
        local: Δεν επιτρέπονται κατοικίδια και ζώα στο όχημα, εκτός από σκύλους βοήθειας.
      - id: use.7
        when:
          pets: fee
        en: Pets are allowed if they are kept in a carrier or on a seat cover. A pet cleaning fee of {{currency}} {{pet_fee}} applies.
        local: Τα κατοικίδια επιτρέπονται σε κλουβί μεταφοράς ή πάνω σε κάλυμμα. Ισχύει χρέωση καθαρισμού {{currency}} {{pet_fee}}.
  - id: area
    title:
      en: 10. Permitted area
      local: 10. Επιτρεπόμενη περιοχή
    fields:
      - key: area_of_use
        en: The vehicle may be used in
        local: Το όχημα επιτρέπεται να κινείται σε
    clauses:
      - id: area.1
        en: The vehicle must stay within the permitted area above. Taking it further, on a ferry or to another island, needs the Owner's written permission first, and the Renter pays any ferry fees agreed and any recovery costs caused by breaking this rule.
        local: Το όχημα παραμένει εντός της παραπάνω επιτρεπόμενης περιοχής. Για μετακίνηση πέρα από αυτήν, με πλοίο ή σε άλλο νησί, απαιτείται προηγουμένως γραπτή άδεια του Εκμισθωτή· ο Μισθωτής πληρώνει τα συμφωνημένα ναύλα και τα έξοδα ανάκτησης που προκαλεί η παράβαση του κανόνα.
      - id: area.2
        en: "The vehicle must not leave Greece, and may be taken on a ferry to another island only with the Owner's prior written permission (section 10). It must not be taken to a country outside the EU (such as Albania, North Macedonia or Turkey): the insurance does not cover it there."
        local: "Το όχημα δεν επιτρέπεται να εξέλθει από την Ελλάδα και μπορεί να μεταφερθεί με πλοίο σε άλλο νησί μόνο με προηγούμενη γραπτή άδεια του Εκμισθωτή (ενότητα 10). Δεν επιτρέπεται η μεταφορά του σε χώρα εκτός ΕΕ (όπως Αλβανία, Βόρεια Μακεδονία ή Τουρκία): η ασφάλιση δεν το καλύπτει εκεί."
        country: true
      - id: area.3
        en: The vehicle may be fitted with a GPS tracker, used only for security, recovery and checking that this agreement is kept (section 17). The Renter has been told about it.
        local: Το όχημα μπορεί να διαθέτει συσκευή GPS, που χρησιμοποιείται μόνο για ασφάλεια, ανάκτηση και έλεγχο τήρησης της σύμβασης (ενότητα 17). Ο Μισθωτής έχει ενημερωθεί.
  - id: insurance
    title:
      en: 11. Insurance and damage waiver
      local: 11. Ασφάλιση και απαλλαγή από ζημιές
    fields:
      - key: insurance_text
        en: Cover on this vehicle
        local: Κάλυψη του οχήματος
      - key: insurance_excess_text
        en: Renter's excess (most the Renter pays per incident, if the rules are kept)
        local: Απαλλαγή του Μισθωτή (το μέγιστο που πληρώνει ανά συμβάν, αν τηρεί τους κανόνες)
    clauses:
      - id: insurance.1
        en: The price includes the compulsory motor third-party liability insurance required in Greece, which covers injury and damage the vehicle causes to other people, at least to the minimum amounts set by EU law. It does not cover damage to or theft of the rented vehicle itself.
        local: Η τιμή περιλαμβάνει την υποχρεωτική ασφάλιση αστικής ευθύνης αυτοκινήτου που απαιτείται στην Ελλάδα, η οποία καλύπτει σωματικές βλάβες και υλικές ζημιές που προκαλεί το όχημα σε τρίτους, τουλάχιστον έως τα ελάχιστα ποσά που ορίζει η νομοθεσία της ΕΕ. Δεν καλύπτει ζημιά ή κλοπή του ίδιου του μισθωμένου οχήματος.
        country: true
      - id: insurance.2
        when:
          insurance_level: comprehensive
        en: "Damage waiver (CDW) and theft protection: damage to and theft of the rented vehicle are also covered. Per incident, the Renter pays no more than the excess shown above, provided the Renter has kept the rules of this agreement."
        local: "Απαλλαγή από ζημιές (CDW) και προστασία κλοπής: καλύπτονται επίσης οι ζημιές και η κλοπή του μισθωμένου οχήματος. Ανά συμβάν ο Μισθωτής πληρώνει το πολύ την αναγραφόμενη απαλλαγή, εφόσον τήρησε τους όρους της σύμβασης."
      - id: insurance.3
        when:
          insurance_level: third_party
        en: "No damage waiver: the vehicle has third-party insurance with extended cover for other people's property, but damage to or theft of the rented vehicle is the Renter's responsibility (section 12), limited to the actual, evidenced cost."
        local: "Χωρίς απαλλαγή από ζημιές: το όχημα έχει ασφάλιση αστικής ευθύνης με διευρυμένη κάλυψη για ξένη περιουσία, αλλά για ζημιά ή κλοπή του μισθωμένου οχήματος ευθύνεται ο Μισθωτής (ενότητα 12), έως το πραγματικό, αποδεδειγμένο κόστος."
      - id: insurance.4
        when:
          insurance_level: compulsory
        en: The vehicle has only the compulsory insurance. Damage to or theft of the rented vehicle is the Renter's responsibility (section 12), limited to the actual, evidenced cost.
        local: Το όχημα έχει μόνο την υποχρεωτική ασφάλιση. Για ζημιά ή κλοπή του μισθωμένου οχήματος ευθύνεται ο Μισθωτής (ενότητα 12), έως το πραγματικό, αποδεδειγμένο κόστος.
      - id: insurance.5
        en: "The damage waiver and insurance do not protect the Renter, and the Renter pays the actual cost, when damage or loss happens: while driving under the influence, without a valid license for the vehicle, by a driver not named in section 2, outside the permitted area, during forbidden use (section 9), through deliberate or grossly negligent acts, or when keys were left with the vehicle. Tires, wheels, glass, underbody, interior, keys and accessories are covered only if the Owner says so in writing."
        local: "Η απαλλαγή από ζημιές και η ασφάλιση δεν προστατεύουν τον Μισθωτή, που πληρώνει το πραγματικό κόστος, όταν η ζημιά ή η απώλεια συμβαίνει: με οδήγηση υπό την επήρεια αλκοόλ ή ουσιών, χωρίς έγκυρη άδεια για το όχημα, από οδηγό που δεν αναφέρεται στην ενότητα 2, εκτός της επιτρεπόμενης περιοχής, κατά απαγορευμένη χρήση (ενότητα 9), από δόλο ή βαριά αμέλεια, ή όταν τα κλειδιά αφέθηκαν στο όχημα. Ελαστικά, ζάντες, κρύσταλλα, κάτω μέρος, εσωτερικό, κλειδιά και εξοπλισμός καλύπτονται μόνο αν το δηλώσει γραπτώς ο Εκμισθωτής."
      - id: insurance.6
        en: Personal belongings left in or on the vehicle are not insured by the Owner, and the Owner is not responsible for their loss or damage except through its own fault.
        local: Τα προσωπικά αντικείμενα που αφήνονται στο όχημα δεν ασφαλίζονται από τον Εκμισθωτή, ο οποίος δεν ευθύνεται για απώλεια ή ζημιά τους, εκτός από δική του υπαιτιότητα.
      - id: insurance.7
        en: "Excess reduction: if the Renter buys the Owner's optional excess reduction, the excess is reduced as written in this agreement. Excess insurance bought by the Renter from another company is between the Renter and that insurer: the Renter pays the Owner and claims the amount back from it."
        local: "Μείωση απαλλαγής: αν ο Μισθωτής αγοράσει την προαιρετική μείωση απαλλαγής του Εκμισθωτή, η απαλλαγή μειώνεται όπως αναγράφεται στη σύμβαση. Ασφάλιση απαλλαγής που αγόρασε ο Μισθωτής από άλλη εταιρεία αφορά μόνο τον Μισθωτή και εκείνη την ασφαλιστική: ο Μισθωτής πληρώνει τον Εκμισθωτή και ζητά το ποσό από την ασφαλιστική του."
  - id: damage
    title:
      en: 12. Damage, theft and loss
      local: 12. Ζημιές, κλοπή και απώλεια
    clauses:
      - id: damage.1
        en: The Renter is responsible for the vehicle from handover until it is returned and checked. The condition at handover is recorded in Annex A with photos; damage not recorded there is treated as new unless it is normal wear and tear.
        local: Ο Μισθωτής ευθύνεται για το όχημα από την παράδοση έως την επιστροφή και τον έλεγχο. Η κατάσταση κατά την παράδοση καταγράφεται στο Παράρτημα Α με φωτογραφίες· ζημιές που δεν καταγράφονται εκεί θεωρούνται νέες, εκτός από τη συνήθη φθορά.
      - id: damage.2
        en: Damage is charged at its actual, reasonable repair cost, shown by a garage quote or invoice, or at the agreed price in Annex B for listed items, never more than the excess where a damage waiver applies. The Owner sends the Renter any damage charge in writing within 30 days of return, with the photos and the quote or invoice. The Renter may ask for a second quote from a garage the Owner approves within 7 days.
        local: Οι ζημιές χρεώνονται με το πραγματικό, εύλογο κόστος επισκευής, όπως αποδεικνύεται από προσφορά ή τιμολόγιο συνεργείου, ή με τη συμφωνημένη τιμή του Παραρτήματος Β για όσα αναφέρονται εκεί, και ποτέ πάνω από την απαλλαγή όταν ισχύει απαλλαγή από ζημιές. Ο Εκμισθωτής γνωστοποιεί γραπτώς κάθε χρέωση ζημιάς εντός 30 ημερών από την επιστροφή, με τις φωτογραφίες και την προσφορά ή το τιμολόγιο. Ο Μισθωτής μπορεί εντός 7 ημερών να ζητήσει δεύτερη προσφορά από συνεργείο που αποδέχεται ο Εκμισθωτής.
      - id: damage.3
        if: loss_of_use_fee
        en: While the vehicle cannot be rented because of damage the Renter is responsible for, the Renter pays loss of use of {{currency}} {{loss_of_use_fee}} per day, for up to {{loss_of_use_max_days}} days, within the excess where a damage waiver applies.
        local: Όσο το όχημα δεν μπορεί να ενοικιαστεί λόγω ζημιάς για την οποία ευθύνεται ο Μισθωτής, αυτός πληρώνει αποζημίωση ακινητοποίησης {{currency}} {{loss_of_use_fee}} ανά ημέρα, για έως {{loss_of_use_max_days}} ημέρες, εντός της απαλλαγής όταν ισχύει απαλλαγή από ζημιές.
      - id: damage.4
        en: If the vehicle or its keys are stolen, the Renter must report it to the police at once and give the Owner the police report and the keys. Where the theft happened because the vehicle was left unlocked, with the keys, or outside the permitted area, the Renter pays the vehicle's value as stated in Annex B (or its market value).
        local: Αν κλαπεί το όχημα ή τα κλειδιά του, ο Μισθωτής το δηλώνει αμέσως στην αστυνομία και παραδίδει στον Εκμισθωτή τη δήλωση και τα κλειδιά. Αν η κλοπή έγινε επειδή το όχημα αφέθηκε ξεκλείδωτο, με τα κλειδιά ή εκτός της επιτρεπόμενης περιοχής, ο Μισθωτής πληρώνει την αξία του οχήματος του Παραρτήματος Β (ή την αγοραία αξία).
      - id: damage.5
        en: Lost keys, remote controls, helmets, documents, number plates and accessories are charged at their replacement cost, plus any locksmith or re-registration cost.
        local: Τα χαμένα κλειδιά, τηλεχειριστήρια, κράνη, έγγραφα, πινακίδες και εξοπλισμός χρεώνονται με το κόστος αντικατάστασης, πλέον τυχόν εξόδων κλειδαρά ή επανέκδοσης πινακίδων.
  - id: accident
    title:
      en: 13. Accidents and breakdowns
      local: 13. Ατυχήματα και βλάβες
    clauses:
      - id: accident.1
        en: "In an accident, the Renter must: make the area safe, wear the reflective vest and set out the warning triangle where required, and call 112 (or 100 for the police) if anyone is hurt; call the Owner straight away on the number in section 1; call the police whenever someone is injured, the other party has no insurance or drives off, or the law requires it; complete and sign a European Accident Statement with the other driver where possible; take photos of all vehicles, plates, the place and any damage; and not admit fault, pay or accept money without the Owner's agreement."
        local: "Σε ατύχημα ο Μισθωτής πρέπει: να ασφαλίσει το σημείο, να φορέσει το ανακλαστικό γιλέκο και να τοποθετήσει το τρίγωνο όπου απαιτείται, και να καλέσει το 112 (ή 100 για την αστυνομία) αν υπάρχουν τραυματίες· να καλέσει αμέσως τον Εκμισθωτή στον αριθμό της ενότητας 1· να καλέσει την αστυνομία όποτε υπάρχει τραυματισμός, ο άλλος οδηγός είναι ανασφάλιστος ή διαφεύγει, ή το απαιτεί ο νόμος· να συμπληρώσει και να υπογράψει με τον άλλο οδηγό Δήλωση Ατυχήματος (Φιλικό Διακανονισμό) όπου είναι δυνατόν· να φωτογραφίσει όλα τα οχήματα, τις πινακίδες, το σημείο και τις ζημιές· και να μην παραδεχτεί υπαιτιότητα, πληρώσει ή δεχτεί χρήματα χωρίς τη συμφωνία του Εκμισθωτή."
        country: true
      - id: accident.2
        en: "Breakdowns: the Renter must stop safely, tell the Owner and follow the Owner's instructions (or call the roadside assistance number the Owner gave). The Renter must not have the vehicle repaired without the Owner's permission, except for minor emergency costs up to {{currency}} {{emergency_repair_limit}}, which the Owner refunds against a receipt."
        local: "Βλάβες: ο Μισθωτής σταματά με ασφάλεια, ενημερώνει τον Εκμισθωτή και ακολουθεί τις οδηγίες του (ή καλεί τον αριθμό οδικής βοήθειας που του δόθηκε). Δεν επισκευάζει το όχημα χωρίς άδεια του Εκμισθωτή, εκτός από μικρά επείγοντα έξοδα έως {{currency}} {{emergency_repair_limit}}, που ο Εκμισθωτής επιστρέφει με απόδειξη."
      - id: accident.3
        en: If the vehicle stops working through no fault of the Renter, the Owner will repair it or provide a similar vehicle within 24 hours of being told where reasonably possible. If the Owner cannot, the Renter may end the rental and receive a refund of the rent for the unused days.
        local: Αν το όχημα σταματήσει να λειτουργεί χωρίς υπαιτιότητα του Μισθωτή, ο Εκμισθωτής το επισκευάζει ή διαθέτει παρόμοιο όχημα εντός 24 ωρών από την ειδοποίηση, όπου είναι εύλογα δυνατό. Αν δεν μπορεί, ο Μισθωτής μπορεί να λύσει τη μίσθωση και να λάβει πίσω το μίσθωμα των αχρησιμοποίητων ημερών.
      - id: accident.4
        en: The Renter must report any warning light, unusual noise, puncture or fault promptly and must not keep using a vehicle that is unsafe.
        local: Ο Μισθωτής αναφέρει αμέσως κάθε προειδοποιητική λυχνία, ασυνήθιστο θόρυβο, σκασμένο λάστιχο ή βλάβη και δεν συνεχίζει να χρησιμοποιεί μη ασφαλές όχημα.
      - id: accident.5
        en: "Breakdowns caused by misuse: if a fault or damage is caused by the Renter's misuse or negligence (for example ignoring a warning light, the wrong fuel, overloading, towing, racing or driving off-road), and this is shown by a mechanic's report or other evidence, the Renter has no right to a refund for that breakdown and pays the actual, evidenced cost of repair and recovery."
        local: "Βλάβες από κακή χρήση: αν βλάβη ή ζημιά οφείλεται σε κακή χρήση ή αμέλεια του Μισθωτή (π.χ. αγνόηση προειδοποιητικής λυχνίας, λάθος καύσιμο, υπερφόρτωση, ρυμούλκηση, αγώνες ή οδήγηση εκτός δρόμου) και αυτό αποδεικνύεται από έκθεση συνεργείου ή άλλο στοιχείο, ο Μισθωτής δεν δικαιούται επιστροφή για τη βλάβη αυτή και πληρώνει το πραγματικό, αποδεδειγμένο κόστος επισκευής και ρυμούλκησης."
  - id: fines
    title:
      en: 14. Fines, tolls and charges
      local: 14. Πρόστιμα, διόδια και τέλη
    clauses:
      - id: fines.1
        en: The Renter pays all traffic and parking fines, tolls, congestion and low-emission-zone charges, towing, impound and clamping costs arising during the rental, including those that reach the Owner after the vehicle is returned{{#if fine_admin_fee}}, plus a handling fee of {{currency}} {{fine_admin_fee}} for each fine or notice the Owner has to handle{{/if}}.
        local: Ο Μισθωτής πληρώνει όλα τα πρόστιμα κυκλοφορίας και στάθμευσης, τα διόδια, τα τέλη ζωνών χαμηλών εκπομπών, τα έξοδα ρυμούλκησης, φύλαξης και ακινητοποίησης που προκύπτουν κατά τη μίσθωση, ακόμη και όσα φτάνουν στον Εκμισθωτή μετά την επιστροφή{{#if fine_admin_fee}}, πλέον τέλους διαχείρισης {{currency}} {{fine_admin_fee}} για κάθε πρόστιμο ή ειδοποίηση που πρέπει να χειριστεί ο Εκμισθωτής{{/if}}.
      - id: fines.2
        en: Traffic fines in Greece are issued to the driver; for offenses recorded by camera, the Owner will identify the Renter to the authority as the law requires. For serious offenses the police may remove the vehicle's number plates or the driver's license; loss of use caused in this way is charged under section 12.
        local: Τα πρόστιμα τροχαίας στην Ελλάδα επιβάλλονται στον οδηγό· για παραβάσεις που καταγράφονται από κάμερα, ο Εκμισθωτής θα γνωστοποιήσει τα στοιχεία του Μισθωτή στην αρχή, όπως απαιτεί ο νόμος. Για σοβαρές παραβάσεις η αστυνομία μπορεί να αφαιρέσει τις πινακίδες του οχήματος ή την άδεια του οδηγού· η ακινητοποίηση που προκαλείται έτσι χρεώνεται κατά την ενότητα 12.
        country: true
  - id: termination
    title:
      en: 15. Ending the agreement by the Owner
      local: 15. Καταγγελία από τον Εκμισθωτή
    clauses:
      - id: termination.1
        en: "The Owner may end this agreement and take the vehicle back at once if the Renter: does not pay; gave false details; lets an unnamed person drive; uses the vehicle unlawfully or against section 9; takes it outside the permitted area without permission; tampers with the odometer or tracker; abandons it; or puts the vehicle or other people at serious risk. The Owner then deducts only what the Renter owes under this agreement, including reasonable recovery costs, and refunds the prepaid rent for the days after the vehicle is recovered."
        local: "Ο Εκμισθωτής μπορεί να καταγγείλει τη σύμβαση και να πάρει αμέσως πίσω το όχημα αν ο Μισθωτής: δεν πληρώσει· έδωσε ψευδή στοιχεία· αφήσει να οδηγήσει πρόσωπο που δεν αναφέρεται· χρησιμοποιεί το όχημα παράνομα ή αντίθετα με την ενότητα 9· το βγάλει από την επιτρεπόμενη περιοχή χωρίς άδεια· παρεμβαίνει στον χιλιομετρητή ή τη συσκευή GPS· το εγκαταλείψει· ή θέσει σε σοβαρό κίνδυνο το όχημα ή άλλα πρόσωπα. Ο Εκμισθωτής παρακρατεί τότε μόνο όσα οφείλει ο Μισθωτής βάσει της σύμβασης, μαζί με εύλογα έξοδα ανάκτησης, και επιστρέφει το προπληρωμένο μίσθωμα για τις ημέρες μετά την ανάκτηση."
      - id: termination.2
        en: The Renter must make the vehicle available for collection, and pays reasonable recovery costs where the Owner has to fetch it.
        local: Ο Μισθωτής διαθέτει το όχημα για παραλαβή και πληρώνει εύλογα έξοδα ανάκτησης όταν ο Εκμισθωτής πρέπει να πάει να το πάρει.
  - id: return
    title:
      en: 16. Returning the vehicle
      local: 16. Επιστροφή του οχήματος
    clauses:
      - id: return.1
        en: The vehicle must be returned with its keys, documents and accessories, with the fuel level agreed in section 8, and reasonably clean. Both parties check the vehicle together and record the condition, odometer and fuel in Annex A with photos. If the Renter chooses not to be present, the Owner's dated photos taken at the return are the record, and the Renter receives a copy.
        local: Το όχημα επιστρέφεται με τα κλειδιά, τα έγγραφα και τον εξοπλισμό του, με τη στάθμη καυσίμου της ενότητας 8 και εύλογα καθαρό. Τα μέρη ελέγχουν μαζί το όχημα και καταγράφουν κατάσταση, χιλιόμετρα και καύσιμο στο Παράρτημα Α με φωτογραφίες. Αν ο Μισθωτής επιλέξει να μην είναι παρών, οι χρονολογημένες φωτογραφίες του Εκμισθωτή κατά την επιστροφή αποτελούν την καταγραφή και ο Μισθωτής λαμβάνει αντίγραφο.
      - id: return.2
        if: cleaning_fee
        en: A vehicle returned with excessive dirt, sand, mud, stains, food or odor inside costs a cleaning fee of {{currency}} {{cleaning_fee}} (more only if specialist cleaning is needed, against a receipt).
        local: Όχημα που επιστρέφεται με υπερβολική βρωμιά, άμμο, λάσπη, λεκέδες, υπολείμματα φαγητού ή οσμές στο εσωτερικό χρεώνεται καθαρισμό {{currency}} {{cleaning_fee}} (περισσότερο μόνο αν απαιτείται ειδικός καθαρισμός, με απόδειξη).
      - id: return.3
        unless: cleaning_fee
        en: A vehicle returned with excessive dirt, sand, mud, stains, food or odor inside may be charged the reasonable cost of cleaning.
        local: Όχημα που επιστρέφεται με υπερβολική βρωμιά, άμμο, λάσπη, λεκέδες, υπολείμματα φαγητού ή οσμές στο εσωτερικό μπορεί να χρεωθεί το εύλογο κόστος καθαρισμού.
  - id: data
    title:
      en: 17. Personal data
      local: 17. Προσωπικά δεδομένα
    clauses:
      - id: data.1
        en: The Owner is the controller of the personal data of the Renter and drivers (names, contact details, ID and license details, copies of documents, vehicle photos and any tracker location data) under the GDPR and Law 4624/2019. It uses them to provide this rental, check identity and license, meet legal duties (accounting, fines, police requests), handle claims and disputes, and protect the vehicle. It keeps them only as long as those purposes and the law require, keeps them secure and never sells them.
        local: Ο Εκμισθωτής είναι υπεύθυνος επεξεργασίας των προσωπικών δεδομένων του Μισθωτή και των οδηγών (ονοματεπώνυμο, στοιχεία επικοινωνίας, στοιχεία ταυτότητας και άδειας, αντίγραφα εγγράφων, φωτογραφίες του οχήματος και τυχόν δεδομένα θέσης GPS) κατά τον ΓΚΠΔ (Κανονισμός (ΕΕ) 2016/679) και τον ν. 4624/2019. Τα χρησιμοποιεί για την παροχή της μίσθωσης, τον έλεγχο ταυτότητας και άδειας, την εκπλήρωση νόμιμων υποχρεώσεων (λογιστικά, πρόστιμα, αιτήματα της αστυνομίας), τη διαχείριση ζημιών και διαφορών και την προστασία του οχήματος. Τα διατηρεί μόνο όσο απαιτούν οι σκοποί αυτοί και ο νόμος, τα προστατεύει και δεν τα πωλεί ποτέ.
        country: true
      - id: data.2
        en: "The Owner shares data only where needed: with insurers, repairers, the police, courts and the authorities that issue fines (a legal obligation), and with IT providers working for the Owner. The Renter may ask for access to, correction or deletion of, or a copy of their data, may object to processing based on the Owner's legitimate interests, and may complain to the Hellenic Data Protection Authority."
        local: "Ο Εκμισθωτής διαβιβάζει δεδομένα μόνο όταν χρειάζεται: σε ασφαλιστές, συνεργεία, αστυνομία, δικαστήρια και αρχές που επιβάλλουν πρόστιμα (νόμιμη υποχρέωση) και σε παρόχους πληροφορικής που εργάζονται για αυτόν. Ο Μισθωτής μπορεί να ζητήσει πρόσβαση, διόρθωση, διαγραφή ή αντίγραφο των δεδομένων του, να αντιταχθεί σε επεξεργασία που βασίζεται σε έννομο συμφέρον του Εκμισθωτή και να υποβάλει καταγγελία στην Αρχή Προστασίας Δεδομένων Προσωπικού Χαρακτήρα."
        country: true
  - id: general
    title:
      en: 18. General terms
      local: 18. Γενικοί όροι
    clauses:
      - id: general.1
        en: "Messages: notices under this agreement may be sent by phone, message app (such as WhatsApp), SMS or email to the contact details in sections 1 and 2. Messages, call logs and photos exchanged this way may be used as evidence of what was agreed."
        local: "Επικοινωνία: οι ειδοποιήσεις της σύμβασης μπορούν να στέλνονται τηλεφωνικά, μέσω εφαρμογής μηνυμάτων (όπως WhatsApp), SMS ή email στα στοιχεία των ενοτήτων 1 και 2. Τα μηνύματα, τα αρχεία κλήσεων και οι φωτογραφίες που ανταλλάσσονται έτσι μπορούν να χρησιμοποιηθούν ως απόδειξη των συμφωνηθέντων."
      - id: general.2
        en: "Force majeure: neither party is responsible for a delay or failure caused by events outside their control, such as natural disasters, storms, wildfires, government orders or ferry cancellations. Rent for days the vehicle could not be used because of such an event is agreed fairly between the parties."
        local: "Ανωτέρα βία: κανένα μέρος δεν ευθύνεται για καθυστέρηση ή αδυναμία εκπλήρωσης λόγω γεγονότων εκτός του ελέγχου του, όπως φυσικές καταστροφές, καταιγίδες, δασικές πυρκαγιές, αποφάσεις αρχών ή ακυρώσεις πλοίων. Το μίσθωμα των ημερών που το όχημα δεν μπόρεσε να χρησιμοποιηθεί για τον λόγο αυτό συμφωνείται δίκαια μεταξύ των μερών."
      - id: general.3
        en: "Whole agreement: this agreement, its annexes and any special conditions are the whole agreement. Changes are valid only in writing (a message from both parties is enough). If any part is found invalid, the rest still applies."
        local: "Ολότητα: η σύμβαση, τα παραρτήματά της και οι ειδικοί όροι αποτελούν το σύνολο της συμφωνίας. Τροποποιήσεις ισχύουν μόνο γραπτώς (αρκεί μήνυμα και των δύο μερών). Αν κάποιος όρος κριθεί άκυρος, οι υπόλοιποι εξακολουθούν να ισχύουν."
      - id: general.4
        en: "Language: this agreement is written in English and Greek, and the Owner will explain any term the Renter does not understand. If the two versions differ, the meaning more favorable to the Renter applies."
        local: "Γλώσσα: η σύμβαση συντάσσεται στα αγγλικά και στα ελληνικά, και ο Εκμισθωτής εξηγεί κάθε όρο που δεν κατανοεί ο Μισθωτής. Αν οι δύο εκδοχές διαφέρουν, ισχύει η έννοια που είναι ευνοϊκότερη για τον Μισθωτή."
        country: true
      - id: general.5
        en: "Governing law: this agreement is governed by Greek law and disputes are decided by the competent courts of the place where the vehicle was rented. A Renter who is a consumer living in another EU country may also sue in the courts where they live where EU law allows it."
        local: "Εφαρμοστέο δίκαιο: η σύμβαση διέπεται από το ελληνικό δίκαιο και οι διαφορές επιλύονται από τα αρμόδια δικαστήρια του τόπου μίσθωσης του οχήματος. Μισθωτής-καταναλωτής που κατοικεί σε άλλη χώρα της ΕΕ μπορεί επίσης να προσφύγει στα δικαστήρια του τόπου κατοικίας του, όπου το επιτρέπει το δίκαιο της ΕΕ."
        country: true
      - id: general.6
        if: special_terms
        en: "Special conditions agreed between the parties: {{special_terms}}"
        local: "Ειδικοί όροι που συμφώνησαν τα μέρη: {{special_terms}}"
      - id: general.7
        en: "Consumer rights: nothing in this agreement limits the rights a Renter who is a consumer has under mandatory consumer law, including the rules on unfair terms (Law 2251/1994, Article 2, and Directive 93/13/EEC). The charges in this agreement are a genuine estimate of the Owner's loss and are never charged twice for the same loss. A dispute may also be taken to the Consumer Ombudsman or another approved ADR body."
        local: "Δικαιώματα καταναλωτή: καμία διάταξη της σύμβασης δεν περιορίζει τα δικαιώματα που έχει ο Μισθωτής ως καταναλωτής από το αναγκαστικό δίκαιο, συμπεριλαμβανομένων των κανόνων για καταχρηστικούς όρους (ν. 2251/1994, άρθρο 2, και Οδηγία 93/13/ΕΟΚ). Οι χρεώσεις της σύμβασης αποτελούν πραγματική εκτίμηση της ζημίας του Εκμισθωτή και δεν χρεώνονται ποτέ δύο φορές για την ίδια ζημία. Μια διαφορά μπορεί επίσης να υποβληθεί στον Συνήγορο του Καταναλωτή ή σε άλλο εγκεκριμένο φορέα εναλλακτικής επίλυσης διαφορών."
        country: true
      - id: general.8
        en: "Electronic signature: this agreement may be signed on paper or electronically; both have the same effect (Regulation (EU) No 910/2014 (eIDAS), Article 25)."
        local: "Ηλεκτρονική υπογραφή: η σύμβαση μπορεί να υπογραφεί σε χαρτί ή ηλεκτρονικά· και οι δύο τρόποι έχουν την ίδια ισχύ (Κανονισμός (ΕΕ) αριθ. 910/2014 (eIDAS), άρθρο 25)."
  - id: signatures
    title:
      en: Signatures
      local: Υπογραφές
    signature: true
    clauses:
      - id: signatures.1
        en: By signing, the parties confirm they have read and understood this agreement, including Annexes A and B, and agree to it. The Renter confirms they received a copy.
        local: Με την υπογραφή τους τα μέρη βεβαιώνουν ότι διάβασαν και κατανόησαν τη σύμβαση, μαζί με τα Παραρτήματα Α και Β, και τη δέχονται. Ο Μισθωτής βεβαιώνει ότι έλαβε αντίγραφο.
    sign_rows:
      - en: Owner (name, signature, date)
        local: Εκμισθωτής (όνομα, υπογραφή, ημερομηνία)
      - en: Renter (name, signature, date)
        local: Μισθωτής (όνομα, υπογραφή, ημερομηνία)
      - en: Additional driver (name, signature, date)
        local: Πρόσθετος οδηγός (όνομα, υπογραφή, ημερομηνία)
  - id: annex_a
    title:
      en: "Annex A: Handover and return check"
      local: "Παράρτημα Α: Έλεγχος παράδοσης και επιστροφής"
    page_break: true
    checklist: true
    clauses:
      - id: annex_a.1
        en: Mark existing scratches (S), dents (D), cracks (C) and missing items (M). Take dated photos of all four sides, the dashboard (odometer and fuel), the interior and any damage, at both handover and return.
        local: Σημειώστε γρατζουνιές (Γ), βαθουλώματα (Β), ραγίσματα (Ρ) και ελλείψεις (Ε). Τραβήξτε χρονολογημένες φωτογραφίες και των τεσσάρων πλευρών, του ταμπλό (χιλιόμετρα και καύσιμο), του εσωτερικού και κάθε ζημιάς, κατά την παράδοση και την επιστροφή.
    check_rows:
      - en: Odometer
        local: Χιλιόμετρα
      - en: Fuel / battery level
        local: Στάθμη καυσίμου / μπαταρίας
      - en: "Body: front / rear / left / right"
        local: "Αμάξωμα: εμπρός / πίσω / αριστερά / δεξιά"
      - en: Windscreen, glass, mirrors and lights
        local: Παρμπρίζ, κρύσταλλα, καθρέφτες και φώτα
      - en: Tires and wheels
        local: Ελαστικά και ζάντες
      - en: Interior and seats
        local: Εσωτερικό και καθίσματα
      - en: Keys, documents, warning triangle, vest
        local: Κλειδιά, έγγραφα, τρίγωνο, γιλέκο
      - en: Helmets / child seat / accessories
        local: Κράνη / παιδικό κάθισμα / εξοπλισμός
      - en: Photos taken (number)
        local: Φωτογραφίες (αριθμός)
      - en: Owner's and Renter's initials
        local: Μονογραφές Εκμισθωτή και Μισθωτή
    columns:
      item:
        en: Item
        local: Στοιχείο
      out:
        en: At handover
        local: Κατά την παράδοση
      in:
        en: At return
        local: Κατά την επιστροφή
  - id: annex_b
    title:
      en: "Annex B: Damage and replacement price list"
      local: "Παράρτημα Β: Τιμοκατάλογος ζημιών και αντικατάστασης"
    pricelist: true
    clauses:
      - id: annex_b.1
        en: Agreed prices for common damage and lost items, based on typical repair costs. Damage not listed is charged per section 12. Where a damage waiver applies, the Renter never pays more than the excess.
        local: Συμφωνημένες τιμές για συνήθεις ζημιές και απώλειες, με βάση τα τυπικά κόστη επισκευής. Ζημιές που δεν αναφέρονται χρεώνονται κατά την ενότητα 12. Όταν ισχύει απαλλαγή από ζημιές, ο Μισθωτής δεν πληρώνει ποτέ περισσότερο από την απαλλαγή.
    price_rows:
      - en: Scratch, per panel (polish / repaint)
        local: Γρατζουνιά, ανά τεμάχιο (γυάλισμα / βαφή)
      - en: Dent, per panel
        local: Βαθούλωμα, ανά τεμάχιο
      - en: Windscreen chip / replacement
        local: "Παρμπρίζ: χτύπημα / αντικατάσταση"
      - en: Mirror
        local: Καθρέφτης
      - en: Headlight / tail light / indicator
        local: Φανάρι / πίσω φως / φλας
      - en: Tire (each)
        local: Ελαστικό (το καθένα)
      - en: Key / remote
        local: Κλειδί / τηλεχειριστήριο
      - en: Helmet / child seat
        local: Κράνος / παιδικό κάθισμα
      - en: Number plate replacement
        local: Αντικατάσταση πινακίδας
      - en: Vehicle value (for total loss or theft)
        local: Αξία οχήματος (ολική απώλεια ή κλοπή)
    columns:
      item:
        en: Item
        local: Στοιχείο
      price:
        en: Price
        local: Τιμή
