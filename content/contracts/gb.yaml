sources:
  - url: https://www.gov.uk/view-driving-licence
    supports: "DVLA 'View or share your driving licence information': the check code lets a hire company see a GB licence's categories and penalty points (renter.2)."
  - url: https://www.gov.uk/government/news/driving-licence-check-code-extended-from-72-hours-to-21-days
    supports: Licence check codes are valid for 21 days (renter.2).
  - url: https://www.legislation.gov.uk/ukpga/2015/15/part/2
    supports: "Consumer Rights Act 2015 Part 2: unfair terms and the transparency requirement; Schedule 2 grey list (disproportionate compensation). Basis for general.7, deposit.2, damage.2."
  - url: https://www.legislation.gov.uk/uksi/2013/3134/regulation/28
    supports: "Consumer Contracts Regulations 2013 reg. 28(1)(b): no 14-day cancellation right for car rental for a specific date or period (cancellation.7)."
  - url: https://www.legislation.gov.uk/ukpga/2000/7/section/7
    supports: "Electronic Communications Act 2000 s.7: electronic signatures are admissible in evidence (general.8)."
  - url: https://www.legislation.gov.uk/ukpga/1988/52/section/172
    supports: "Road Traffic Act 1988 s.172: the keeper must give information identifying the driver (fines.2)."
  - url: https://www.newham.gov.uk/parking-permits/penalty-charge-notices-hire-vehicles
    supports: "Council guidance: a hire company can transfer a PCN to the hirer by sending a copy of the hire agreement and the hirer's signed statement of liability (fines.2)."
  - url: https://www.gov.uk/government/publications/renting-a-car-advice-for-consumers/hiring-a-car-what-to-watch-out-for
    supports: "CMA/GOV.UK car hire advice: damage charges are the top complaint, ask for evidence and invoices; excess and deposits; fuel policies (damage.2, fuel)."
  - url: https://www.bvrla.co.uk/resource/new-service-check-code-for-driving-licence-on-gov-uk.html
    supports: BVRLA (rental trade body) on licence check codes for rental; BVRLA also issues VE103 vehicle-on-hire certificates and runs a conciliation service (area.2, general.7).
  - url: https://www.gov.uk/driving-nongb-licence
    supports: Visitors may drive in GB on a valid licence from their country for up to 12 months (renter.2).
  - url: https://www.gov.uk/child-car-seats-the-rules
    supports: Children must use a child car seat until 12 years old or 135 cm tall (use.3).
  - url: https://www.gov.uk/drink-drive-limit
    supports: "Drink-drive limits: 80 mg/100 ml blood in England, Wales and Northern Ireland, 50 mg in Scotland (use.4)."
  - url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
    supports: GDPR, retained in UK law as the UK GDPR with the Data Protection Act 2018 (data.1, data.2).
title:
  en: Vehicle Rental Agreement
  local: Vehicle Rental Agreement
subtitle:
  en: Self-drive car, motorbike, scooter and quad rental. {{country_name}}
  local: ""
footer:
  en: Vehicle rental agreement · {{business_name}}
  local: ""
page_words:
  page: Page
  of: of
sections:
  - id: parties
    title:
      en: 1. The parties
      local: ""
    fields:
      - key: business_name
        en: Owner (rental business)
        local: ""
      - key: business_reg_no
        en: Company / VAT registration number
        local: ""
      - key: business_address
        en: Business address
        local: ""
      - key: business_phone
        en: Phone / WhatsApp
        local: ""
      - key: business_email
        en: Email
        local: ""
    clauses:
      - id: parties.1
        en: This agreement is made on {{renter_contract_date}} between the rental business named above (the "Owner") and the person named in section 2 (the "Renter"). Where there is more than one renter or driver, each of them is jointly responsible for every obligation in this agreement.
        local: ""
  - id: renter
    title:
      en: 2. The Renter and drivers
      local: ""
    fields:
      - key: renter_name
        en: Full name (as on passport or ID)
        local: ""
      - key: renter_nationality
        en: Nationality
        local: ""
      - key: renter_dob
        en: Date of birth
        local: ""
      - key: renter_id_no
        en: Passport or national ID number
        local: ""
      - key: renter_home_address
        en: Home address
        local: ""
      - key: renter_local_address
        en: Address during the rental (hotel / apartment)
        local: ""
      - key: renter_phone
        en: Phone / WhatsApp
        local: ""
      - key: renter_email
        en: Email
        local: ""
      - key: renter_licence
        en: Driving licence number, categories and issuing country
        local: ""
      - key: renter_licence_expiry
        en: Licence expiry date / date first issued
        local: ""
      - key: renter_idp
        en: International Driving Permit (number / not required)
        local: ""
      - key: renter_emergency
        en: Emergency contact (name and phone)
        local: ""
      - key: driver2_details
        en: Additional driver (name, ID, licence), if any
        local: ""
      - key: renter_dvla_code
        en: DVLA licence check code (Great Britain licences)
        local: ""
    clauses:
      - id: renter.1
        en: The Renter confirms that the details above are true and complete, and that every person who will drive or ride the vehicle is named here. Only the Renter and any additional driver named above may drive or ride the vehicle.
        local: ""
      - id: renter.2
        en: Every driver must hold a full, valid driving licence for this class of vehicle (category B for cars; A, A2 or A1 for motorcycles; AM or a valid CBT certificate for mopeds) and carry it while driving. A driver with a Great Britain licence gives the Owner a DVLA licence check code (from gov.uk/view-driving-licence, valid for 21 days) so the Owner can see the licence categories and any penalty points. A visitor may drive on a valid licence from their home country for up to 12 months from arrival.
        local: ""
        country: true
      - id: renter.3
        en: Each driver must meet the minimum age and the minimum period of holding a full licence that the Owner stated at booking. Any young-driver or additional-driver charge is shown in this agreement before it is signed.
        local: ""
  - id: vehicle
    title:
      en: 3. The vehicle
      local: ""
    fields:
      - key: vehicle_type_label
        en: Type
        local: ""
      - key: vehicle_make_model
        en: Make and model
        local: ""
      - key: vehicle_year
        en: Year
        local: ""
      - key: vehicle_plate
        en: Registration (plate) number
        local: ""
      - key: vehicle_colour
        en: Colour
        local: ""
      - key: renter_vin
        en: Chassis / VIN number
        local: ""
      - key: out_odometer
        en: Odometer at handover
        local: ""
      - key: out_fuel
        en: Fuel / battery level at handover
        local: ""
      - key: renter_accessories
        en: Accessories handed over (helmets, keys, child seat, warning triangle, vest, etc.)
        local: ""
    clauses:
      - id: vehicle.1
        en: The Owner rents the vehicle described above, with the accessories listed, to the Renter for the rental period and on the terms of this agreement. The vehicle remains the property of the Owner at all times.
        local: ""
      - id: vehicle.2
        en: The Owner confirms that the vehicle is registered, has a valid roadworthiness test where one is required (MOT), and has compulsory motor insurance valid for the whole rental period, and that it is handed over roadworthy, with the documents and safety equipment the law requires to be carried.
        local: ""
        country: true
      - id: vehicle.3
        en: The Owner keeps the vehicle serviced as the manufacturer recommends and pays for normal mechanical repairs and wear unless this agreement says otherwise. On longer rentals the Owner arranges servicing with the Renter at a convenient time; if servicing takes more than one day, section 13 applies.
        local: ""
      - id: vehicle.4
        en: "During the rental the Renter looks after the vehicle's day-to-day condition: checking that tyres, lights, brakes, oil and coolant look normal, and not driving or riding it if it becomes unsafe or unroadworthy."
        local: ""
  - id: period
    title:
      en: 4. Rental period, pickup and return
      local: ""
    fields:
      - key: renter_start
        en: Start (date and time)
        local: ""
      - key: renter_end
        en: End (date and time)
        local: ""
      - key: renter_pickup_place
        en: Pickup / delivery place
        local: ""
      - key: renter_return_place
        en: Return / collection place
        local: ""
    clauses:
      - id: period.1
        en: The Renter must return the vehicle at the agreed place, date and time. An extension is valid only when the Owner agrees to it in writing (a message is enough) and the extra rent is paid.
        local: ""
      - id: period.2
        if: late_hour_fee
        en: "Late return: after a grace period of {{late_grace_minutes}} minutes, each started hour costs {{currency}} {{late_hour_fee}}. A return more than {{late_full_day_hours}} hours late is charged as an extra full day at the daily rate."
        local: ""
      - id: period.3
        unless: late_hour_fee
        en: "Late return: a return more than one hour late may be charged as an extra day at the daily rate."
        local: ""
      - id: period.4
        en: If the vehicle is not returned and the Renter cannot be reached within 24 hours of the end time, the Owner may report it to the police and recover it, at the Renter's reasonable cost.
        local: ""
      - id: period.5
        when:
          rate_period: month
        en: "Rolling monthly rental: where no end date is written above, the rental continues from month to month on the same terms until either party ends it as set out in section 7."
        local: ""
  - id: charges
    title:
      en: 5. Price and payment
      local: ""
    fields:
      - key: rate_text
        en: Rental rate
        local: ""
      - key: renter_total
        en: Total price for this booking (all compulsory charges included)
        local: ""
      - key: delivery_fee_text
        en: Delivery / collection fee
        local: ""
      - key: payment_methods
        en: Payment methods accepted
        local: ""
    clauses:
      - id: charges.1
        en: The Renter pays the price stated above in advance, unless the Owner agrees otherwise in writing. Prices are in {{currency_name}}, include VAT and every charge the Renter must pay (such as location surcharges, road tax and compulsory insurance), and show optional extras separately.
        local: ""
      - id: charges.2
        when:
          rate_period: month
        en: "Monthly rentals: rent is paid monthly in advance on the same day each month. If a payment is more than 7 days late and the Owner has reminded the Renter in writing, the Owner may end the rental and collect the vehicle (section 15)."
        local: ""
      - id: charges.3
        en: Extras (child seats, delivery, additional drivers, excess reduction, snow chains and similar) cost what is written in this agreement or what the Owner confirmed in writing before the rental.
        local: ""
  - id: deposit
    title:
      en: 6. Security deposit
      local: ""
    fields:
      - key: deposit_text
        en: Deposit
        local: ""
      - key: renter_deposit_method
        en: Paid by (card hold / transfer / cash)
        local: ""
      - key: deposit_return_text
        en: Returned or released within
        local: ""
    clauses:
      - id: deposit.1
        en: "The deposit secures the Renter's obligations: unpaid rent, damage up to the amount the Renter is liable for, fuel, mileage, cleaning, late return, lost keys or accessories and any other amount owed under this agreement."
        local: ""
      - id: deposit.2
        en: The Owner returns the deposit (or releases the card hold) after the vehicle has been returned and checked, less only amounts the Renter actually owes under this agreement. Each deduction is listed in writing with photos, receipts or quotes. If the amounts owed are more than the deposit, the Renter pays the difference within 14 days of receiving that list.
        local: ""
      - id: deposit.3
        en: The Owner does not hold back the deposit to wait for traffic fines. A fine that arrives after the rental is charged as set out in section 14.
        local: ""
      - id: deposit.4
        en: The Owner will not keep the Renter's passport or identity card as a deposit. The Owner may check them and keep a copy to identify the Renter (section 17).
        local: ""
  - id: cancellation
    title:
      en: 7. Cancellation and early return
      local: ""
    clauses:
      - id: cancellation.1
        if: cancel_free_hours
        en: The Renter may cancel free of charge up to {{cancel_free_hours}} hours before the start time. A later cancellation costs {{cancel_fee_percent}}% of the rent for the booked period (or of the first month on a monthly rental). If the Renter does not arrive at the start time and does not tell the Owner (a no-show), the Owner may keep the amount paid for the first {{no_show_days}} day(s) and release the vehicle.
        local: ""
      - id: cancellation.2
        unless: cancel_free_hours
        en: "Cancellation by the Renter before the start time: the Owner keeps only a booking payment that the booking confirmation clearly said was non-refundable, and refunds the rest."
        local: ""
      - id: cancellation.3
        when:
          early_return: none
        en: "Early return: rent for the booked period is not refunded if the Renter returns the vehicle early."
        local: ""
      - id: cancellation.4
        when:
          early_return: prorata
        en: "Early return: the Owner refunds the rent for the full unused days, less an early-return fee of {{currency}} {{early_return_fee}}. Long-term discounts that no longer apply may be recalculated at the rate for the period actually used."
        local: ""
      - id: cancellation.5
        when:
          rate_period: month
        en: "Monthly rentals: either party may end the rental by giving {{notice_days}} days' written notice. Without notice, the Renter pays rent for the notice period."
        local: ""
      - id: cancellation.6
        en: If the Owner cannot provide the vehicle (or a similar or better one) at the start time, the Renter may cancel and receive a full refund of everything paid.
        local: ""
      - id: cancellation.7
        en: This rental is for specific dates, so the 14-day right of withdrawal for contracts made online or by phone does not apply (Consumer Contracts (Information, Cancellation and Additional Charges) Regulations 2013, regulation 28(1)(b)).
        local: ""
  - id: fuel
    title:
      en: 8. Fuel, charging and mileage
      local: ""
    clauses:
      - id: fuel.1
        when:
          fuel_policy: same
        en: "Fuel policy: same-to-same. The vehicle must be returned with at least the fuel (or battery) level it had at handover."
        local: ""
      - id: fuel.2
        when:
          fuel_policy: full
        en: "Fuel policy: full-to-full. The vehicle is handed over with a full tank and must be returned full."
        local: ""
      - id: fuel.3
        en: Missing fuel is charged at the local pump price for the amount needed{{#if fuel_service_fee}}, plus a refuelling service fee of {{currency}} {{fuel_service_fee}}{{/if}}.
        local: ""
      - id: fuel.4
        if: mileage_limit
        en: "Mileage allowance: {{mileage_limit}} miles per {{mileage_period_label}}. Each extra mile costs {{currency}} {{excess_km_fee}}."
        local: ""
      - id: fuel.5
        unless: mileage_limit
        en: "Mileage: unlimited, within the permitted area (section 10)."
        local: ""
      - id: fuel.6
        en: The Renter must not tamper with the odometer, speed limiter or GPS tracker. Tampering is a serious breach (section 15).
        local: ""
      - id: fuel.7
        en: Only the fuel type stated by the manufacturer (or in the vehicle's documents) may be used. If the wrong fuel is put in, the Renter pays the actual, evidenced cost of draining the tank and of any repair it causes.
        local: ""
  - id: use
    title:
      en: 9. Safe and lawful use
      local: ""
    clauses:
      - id: use.1
        en: The Renter must drive or ride carefully, obey all traffic laws, and keep the vehicle locked with the keys removed whenever it is left. Keys must never be left in or on the vehicle.
        local: ""
      - id: use.2
        when:
          vehicle_type:
            - motorbike
            - ""
        en: "Motorbikes, scooters and quads: the rider and any passenger must wear a fastened, approved helmet at all times; the Owner provides helmets. No more than one passenger, and only where the vehicle is approved to carry one."
        local: ""
        country: true
      - id: use.3
        when:
          vehicle_type:
            - car
            - ""
        en: "Cars: every occupant must wear a seatbelt, and children under 12 years old or under 135 cm tall must travel in an approved child restraint suited to their weight and height. The number of passengers must not exceed the number of seats."
        local: ""
        country: true
      - id: use.4
        en: "It is forbidden to: drive with alcohol above the legal limit (80 mg per 100 ml of blood in England, Wales and Northern Ireland; 50 mg in Scotland) or under the influence of drugs; use a hand-held phone while driving; race, perform stunts or drive off-road (unless the vehicle is meant for it and the Owner agreed); tow or push anything; carry goods for payment, illegal goods or dangerous loads; use the vehicle for ride-hailing, delivery work, driving lessons or to rent it to anyone else; let anyone not named in section 2 drive or ride."
        local: ""
        country: true
      - id: use.8_gb
        en: In the United Kingdom vehicles drive on the left, and speed limits and road signs are in miles and miles per hour.
        local: ""
        country: true
      - id: use.5
        when:
          smoking: no
        en: Smoking and vaping are not allowed in the vehicle.{{#if smoking_fee}} Breaking this rule costs a fee of {{currency}} {{smoking_fee}} for odour removal.{{/if}}
        local: ""
      - id: use.6
        when:
          pets: no
        en: Pets and animals are not allowed in or on the vehicle, except assistance animals.
        local: ""
      - id: use.7
        when:
          pets: fee
        en: Pets are allowed if they are kept in a carrier or on a seat cover. A pet cleaning fee of {{currency}} {{pet_fee}} applies.
        local: ""
  - id: area
    title:
      en: 10. Permitted area
      local: ""
    fields:
      - key: area_of_use
        en: The vehicle may be used in
        local: ""
    clauses:
      - id: area.1
        en: The vehicle must stay within the permitted area above. Taking it further, on a ferry or to another island, needs the Owner's written permission first, and the Renter pays any ferry fees agreed and any recovery costs caused by breaking this rule.
        local: ""
      - id: area.2
        en: Taking the vehicle out of the United Kingdom (including to Ireland or mainland Europe by ferry or the Channel Tunnel) needs the Owner's prior written permission, a VE103 vehicle-on-hire certificate and the insurance documents the Owner provides. Without them the vehicle is not insured abroad.
        local: ""
        country: true
      - id: area.3
        en: The vehicle may be fitted with a GPS tracker, used only for security, recovery and checking that this agreement is kept (section 17). The Renter has been told about it.
        local: ""
  - id: insurance
    title:
      en: 11. Insurance and damage waiver
      local: ""
    fields:
      - key: insurance_text
        en: Cover on this vehicle
        local: ""
      - key: insurance_excess_text
        en: Renter's excess (most the Renter pays per incident, if the rules are kept)
        local: ""
    clauses:
      - id: insurance.1
        en: The price includes the compulsory motor third-party liability insurance required in the United Kingdom, which covers injury and damage the vehicle causes to other people, at least to the minimum amounts set by UK law (Road Traffic Act 1988, Part VI). It does not cover damage to or theft of the rented vehicle itself.
        local: ""
        country: true
      - id: insurance.2
        when:
          insurance_level: comprehensive
        en: "Damage waiver (CDW) and theft protection: damage to and theft of the rented vehicle are also covered. Per incident, the Renter pays no more than the excess shown above, provided the Renter has kept the rules of this agreement."
        local: ""
      - id: insurance.3
        when:
          insurance_level: third_party
        en: "No damage waiver: the vehicle has third-party insurance with extended cover for other people's property, but damage to or theft of the rented vehicle is the Renter's responsibility (section 12), limited to the actual, evidenced cost."
        local: ""
      - id: insurance.4
        when:
          insurance_level: compulsory
        en: The vehicle has only the compulsory insurance. Damage to or theft of the rented vehicle is the Renter's responsibility (section 12), limited to the actual, evidenced cost.
        local: ""
      - id: insurance.5
        en: "The damage waiver and insurance do not protect the Renter, and the Renter pays the actual cost, when damage or loss happens: while driving under the influence, without a valid licence for the vehicle, by a driver not named in section 2, outside the permitted area, during forbidden use (section 9), through deliberate or grossly negligent acts, or when keys were left with the vehicle. Tyres, wheels, glass, underbody, interior, keys and accessories are covered only if the Owner says so in writing."
        local: ""
      - id: insurance.6
        en: Personal belongings left in or on the vehicle are not insured by the Owner, and the Owner is not responsible for their loss or damage except through its own fault.
        local: ""
      - id: insurance.7
        en: "Excess reduction: if the Renter buys the Owner's optional excess reduction, the excess is reduced as written in this agreement. Excess insurance bought by the Renter from another company is between the Renter and that insurer: the Renter pays the Owner and claims the amount back from it."
        local: ""
  - id: damage
    title:
      en: 12. Damage, theft and loss
      local: ""
    clauses:
      - id: damage.1
        en: The Renter is responsible for the vehicle from handover until it is returned and checked. The condition at handover is recorded in Annex A with photos; damage not recorded there is treated as new unless it is normal wear and tear.
        local: ""
      - id: damage.2
        en: Damage is charged at its actual, reasonable repair cost, shown by a garage quote or invoice, or at the agreed price in Annex B for listed items, never more than the excess where a damage waiver applies. The Owner sends the Renter any damage charge in writing within 30 days of return, with the photos and the quote or invoice. The Renter may ask for a second quote from a garage the Owner approves within 7 days.
        local: ""
      - id: damage.3
        if: loss_of_use_fee
        en: While the vehicle cannot be rented because of damage the Renter is responsible for, the Renter pays loss of use of {{currency}} {{loss_of_use_fee}} per day, for up to {{loss_of_use_max_days}} days, within the excess where a damage waiver applies.
        local: ""
      - id: damage.4
        en: If the vehicle or its keys are stolen, the Renter must report it to the police at once and give the Owner the police report and the keys. Where the theft happened because the vehicle was left unlocked, with the keys, or outside the permitted area, the Renter pays the vehicle's value as stated in Annex B (or its market value).
        local: ""
      - id: damage.5
        en: Lost keys, remote controls, helmets, documents, number plates and accessories are charged at their replacement cost, plus any locksmith or re-registration cost.
        local: ""
  - id: accident
    title:
      en: 13. Accidents and breakdowns
      local: ""
    clauses:
      - id: accident.1
        en: "In an accident, the Renter must: make the area safe, wear the reflective vest and set out the warning triangle where required, and call 999 or 112 if anyone is hurt; call the Owner straight away on the number in section 1; call the police whenever someone is injured, the other party has no insurance or drives off, or the law requires it; complete and sign a European Accident Statement with the other driver where possible; take photos of all vehicles, plates, the place and any damage; and not admit fault, pay or accept money without the Owner's agreement."
        local: ""
        country: true
      - id: accident.2
        en: "Breakdowns: the Renter must stop safely, tell the Owner and follow the Owner's instructions (or call the roadside assistance number the Owner gave). The Renter must not have the vehicle repaired without the Owner's permission, except for minor emergency costs up to {{currency}} {{emergency_repair_limit}}, which the Owner refunds against a receipt."
        local: ""
      - id: accident.3
        en: If the vehicle stops working through no fault of the Renter, the Owner will repair it or provide a similar vehicle within 24 hours of being told where reasonably possible. If the Owner cannot, the Renter may end the rental and receive a refund of the rent for the unused days.
        local: ""
      - id: accident.4
        en: The Renter must report any warning light, unusual noise, puncture or fault promptly and must not keep using a vehicle that is unsafe.
        local: ""
      - id: accident.5
        en: "Breakdowns caused by misuse: if a fault or damage is caused by the Renter's misuse or negligence (for example ignoring a warning light, the wrong fuel, overloading, towing, racing or driving off-road), and this is shown by a mechanic's report or other evidence, the Renter has no right to a refund for that breakdown and pays the actual, evidenced cost of repair and recovery."
        local: ""
  - id: fines
    title:
      en: 14. Fines, tolls and charges
      local: ""
    clauses:
      - id: fines.1
        en: The Renter pays all traffic and parking fines, tolls, congestion and low-emission-zone charges, towing, impound and clamping costs arising during the rental, including those that reach the Owner after the vehicle is returned{{#if fine_admin_fee}}, plus a handling fee of {{currency}} {{fine_admin_fee}} for each fine or notice the Owner has to handle{{/if}}.
        local: ""
      - id: fines.2
        en: "Statement of liability: the Renter acknowledges that from the start of the hire until the vehicle is returned, the Renter is liable for any penalty charge notice (PCN), fixed penalty notice, parking charge, congestion charge, clean-air or ultra low emission zone (ULEZ) charge, road-user charge and toll (such as the Dartford Crossing) incurred in respect of the vehicle, and that the Owner may transfer liability for them to the Renter by sending the issuing authority or operator a copy of this agreement. Where the police ask who was driving (Road Traffic Act 1988, section 172), the Owner must give the Renter's details."
        local: ""
        country: true
      - id: fines.3_gb
        en: Road-user charges that are paid online, such as the London Congestion Charge, ULEZ and the Dartford Crossing (Dart Charge), must be paid by the Renter by their deadline unless the Owner has said the vehicle is registered for automatic payment. An unpaid charge becomes a penalty charge, which the Renter pays.
        local: ""
        country: true
  - id: termination
    title:
      en: 15. Ending the agreement by the Owner
      local: ""
    clauses:
      - id: termination.1
        en: "The Owner may end this agreement and take the vehicle back at once if the Renter: does not pay; gave false details; lets an unnamed person drive; uses the vehicle unlawfully or against section 9; takes it outside the permitted area without permission; tampers with the odometer or tracker; abandons it; or puts the vehicle or other people at serious risk. The Owner then deducts only what the Renter owes under this agreement, including reasonable recovery costs, and refunds the prepaid rent for the days after the vehicle is recovered."
        local: ""
      - id: termination.2
        en: The Renter must make the vehicle available for collection, and pays reasonable recovery costs where the Owner has to fetch it.
        local: ""
  - id: return
    title:
      en: 16. Returning the vehicle
      local: ""
    clauses:
      - id: return.1
        en: The vehicle must be returned with its keys, documents and accessories, with the fuel level agreed in section 8, and reasonably clean. Both parties check the vehicle together and record the condition, odometer and fuel in Annex A with photos. If the Renter chooses not to be present, the Owner's dated photos taken at the return are the record, and the Renter receives a copy.
        local: ""
      - id: return.2
        if: cleaning_fee
        en: A vehicle returned with excessive dirt, sand, mud, stains, food or odour inside costs a cleaning fee of {{currency}} {{cleaning_fee}} (more only if specialist cleaning is needed, against a receipt).
        local: ""
      - id: return.3
        unless: cleaning_fee
        en: A vehicle returned with excessive dirt, sand, mud, stains, food or odour inside may be charged the reasonable cost of cleaning.
        local: ""
  - id: data
    title:
      en: 17. Personal data
      local: ""
    clauses:
      - id: data.1
        en: The Owner is the controller of the personal data of the Renter and drivers (names, contact details, ID and licence details, copies of documents, vehicle photos and any tracker location data) under the UK GDPR and the Data Protection Act 2018. It uses them to provide this rental, check identity and licence, meet legal duties (accounting, fines, police requests), handle claims and disputes, and protect the vehicle. It keeps them only as long as those purposes and the law require, keeps them secure and never sells them.
        local: ""
        country: true
      - id: data.2
        en: "The Owner shares data only where needed: with insurers, repairers, the police, courts and the authorities that issue fines (a legal obligation), and with IT providers working for the Owner. The Renter may ask for access to, correction or deletion of, or a copy of their data, may object to processing based on the Owner's legitimate interests, and may complain to the Information Commissioner's Office (ICO)."
        local: ""
        country: true
  - id: general
    title:
      en: 18. General terms
      local: ""
    clauses:
      - id: general.1
        en: "Messages: notices under this agreement may be sent by phone, message app (such as WhatsApp), SMS or email to the contact details in sections 1 and 2. Messages, call logs and photos exchanged this way may be used as evidence of what was agreed."
        local: ""
      - id: general.2
        en: "Force majeure: neither party is responsible for a delay or failure caused by events outside their control, such as natural disasters, storms, wildfires, government orders or ferry cancellations. Rent for days the vehicle could not be used because of such an event is agreed fairly between the parties."
        local: ""
      - id: general.3
        en: "Whole agreement: this agreement, its annexes and any special conditions are the whole agreement. Changes are valid only in writing (a message from both parties is enough). If any part is found invalid, the rest still applies."
        local: ""
      - id: general.4
        en: "Language: this agreement is written in English."
        local: ""
        country: true
      - id: general.5
        en: "Governing law: this agreement is governed by the law of England and Wales. A Renter who is a consumer living in Scotland or Northern Ireland may also bring proceedings there, and keeps the mandatory consumer protection of that part of the United Kingdom. The parties will first try to settle any dispute by discussion."
        local: ""
        country: true
      - id: general.6
        if: special_terms
        en: "Special conditions agreed between the parties: {{special_terms}}"
        local: ""
      - id: general.7
        en: "Consumer rights: nothing in this agreement limits the rights a Renter who is a consumer has under mandatory consumer law, including the rules on unfair terms (Consumer Rights Act 2015, Part 2). The charges in this agreement are a genuine estimate of the Owner's loss and are never charged twice for the same loss. A dispute may also be taken to an alternative dispute resolution scheme the Owner belongs to (such as the BVRLA conciliation service) or the small claims court."
        local: ""
        country: true
      - id: general.8
        en: "Electronic signature: this agreement may be signed on paper or electronically; both have the same effect (Electronic Communications Act 2000, section 7)."
        local: ""
  - id: signatures
    title:
      en: Signatures
      local: ""
    signature: true
    clauses:
      - id: signatures.1
        en: By signing, the parties confirm they have read and understood this agreement, including Annexes A and B, and agree to it. The Renter confirms they received a copy.
        local: ""
    sign_rows:
      - en: Owner (name, signature, date)
        local: ""
      - en: Renter (name, signature, date)
        local: ""
      - en: Additional driver (name, signature, date)
        local: ""
  - id: annex_a
    title:
      en: "Annex A: Handover and return check"
      local: ""
    page_break: true
    checklist: true
    clauses:
      - id: annex_a.1
        en: Mark existing scratches (S), dents (D), cracks (C) and missing items (M). Take dated photos of all four sides, the dashboard (odometer and fuel), the interior and any damage, at both handover and return.
        local: ""
    check_rows:
      - en: Odometer
        local: ""
      - en: Fuel / battery level
        local: ""
      - en: "Body: front / rear / left / right"
        local: ""
      - en: Windscreen, glass, mirrors and lights
        local: ""
      - en: Tyres and wheels
        local: ""
      - en: Interior and seats
        local: ""
      - en: Keys, documents, warning triangle, vest
        local: ""
      - en: Helmets / child seat / accessories
        local: ""
      - en: Photos taken (number)
        local: ""
      - en: Owner's and Renter's initials
        local: ""
    columns:
      item:
        en: Item
        local: ""
      out:
        en: At handover
        local: ""
      in:
        en: At return
        local: ""
  - id: annex_b
    title:
      en: "Annex B: Damage and replacement price list"
      local: ""
    pricelist: true
    clauses:
      - id: annex_b.1
        en: Agreed prices for common damage and lost items, based on typical repair costs. Damage not listed is charged per section 12. Where a damage waiver applies, the Renter never pays more than the excess.
        local: ""
    price_rows:
      - en: Scratch, per panel (polish / repaint)
        local: ""
      - en: Dent, per panel
        local: ""
      - en: Windscreen chip / replacement
        local: ""
      - en: Mirror
        local: ""
      - en: Headlight / tail light / indicator
        local: ""
      - en: Tyre (each)
        local: ""
      - en: Key / remote
        local: ""
      - en: Helmet / child seat
        local: ""
      - en: Number plate replacement
        local: ""
      - en: Vehicle value (for total loss or theft)
        local: ""
    columns:
      item:
        en: Item
        local: ""
      price:
        en: Price
        local: ""
