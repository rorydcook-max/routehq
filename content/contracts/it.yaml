sources:
  - url: https://eur-lex.europa.eu/eli/dir/1993/13/oj
    supports: "Unfair Contract Terms Directive 93/13/EEC: terms must be plain and intelligible, doubts are read in the consumer's favor (Art 5), disproportionate compensation is unfair (Annex point e). Basis for general.4, general.7, deposit.2, damage.2."
  - url: https://eur-lex.europa.eu/eli/dir/2011/83/oj
    supports: "Consumer Rights Directive 2011/83/EU: total price including all compulsory charges (Arts 5-6); Art 16(l) no withdrawal right for car rental for a specific date or period (charges.1, cancellation.7)."
  - url: https://commission.europa.eu/topics/consumers/consumer-rights-and-complaints/enforcement-consumer-protection/coordinated-actions/other-travel-services_en
    supports: "EU consumer authorities (CPC) and the main rental companies, 2017: price transparency, clear insurance and waiver terms, fuel options and fairer damage handling. Basis for charges.1, insurance, fuel and damage.2."
  - url: https://eur-lex.europa.eu/eli/dir/2009/103/oj
    supports: "Motor Insurance Directive 2009/103/EC (as amended by 2021/2118): compulsory third-party cover with EU minimum amounts, valid across the EU (insurance.1)."
  - url: https://eur-lex.europa.eu/eli/dir/2006/126/oj
    supports: "Driving Licence Directive 2006/126/EC: categories AM, A1, A2, A and B; EU licenses recognized in every member state (renter.2)."
  - url: https://eur-lex.europa.eu/eli/dir/2015/413/oj
    supports: "Directive (EU) 2015/413: cross-border exchange of vehicle registration data for road-safety offenses, so fines follow foreign renters (fines.1)."
  - url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
    supports: "GDPR: controller duties, lawful bases (contract, legal obligation for giving driver details to authorities, legitimate interest), data subject rights (data.1, data.2)."
  - url: https://eur-lex.europa.eu/eli/reg/2014/910/oj
    supports: "eIDAS Regulation Art 25(1): an electronic signature may not be denied legal effect solely because it is electronic (general.8)."
  - url: https://eur-lex.europa.eu/eli/reg/2008/593/oj
    supports: "Rome I Regulation Art 6: consumer contracts and mandatory protection of the consumer's own law (general.5, general.7)."
  - url: https://eur-lex.europa.eu/eli/reg/2012/1215/oj
    supports: "Brussels I bis Regulation Arts 17-19: a consumer may sue in the courts where they live when the business directs its activities to that country (general.5)."
  - url: https://www.ccpc.ie/news-and-media/news/article/2026/06/16/consumer-rights-explained--i-think-my-holiday-car-hire-firm-is-trying-to-rip-me-off-what-are-my-rights
    supports: "CCPC (Irish consumer authority), 2026: damage may be charged only with clear evidence it happened during the rental; renters can ask for inspection reports and a cost breakdown; ECRCS conciliation (damage.2)."
  - url: https://brocardi.it/codice-del-consumo/parte-ii/titolo-ii/capo-ii/art9.html
    supports: "Consumer Code Art 9: all information for consumers must be given at least in Italian, no less visible than other languages (general.4)."
  - url: https://www.brocardi.it/codice-della-strada/titolo-vi/capo-i/sezione-i/art196.html
    supports: "Highway Code Art 196: in rental without driver, joint liability falls on the renter (fines.2)."
  - url: https://miolegale.it/codici/codice-strada/art-126-bis/
    supports: "Highway Code Art 126-bis: communication of the driver's details for license points (fines.2)."
  - url: https://www.brocardi.it/codice-del-consumo/parte-iii/titolo-i/art33.html
    supports: "Consumer Code Arts 33-38: unfair terms, including the consumer's court (general.7, general.5)."
  - url: https://www.rac.co.uk/drive/travel/country/italy
    supports: "RAC Italy: UK licenses need no IDP; helmets for moped, motorcycle and quad riders; 0.05% limit, zero for new and professional drivers; ZTL camera zones; winter tires or chains 15 Nov-15 Apr (Valle d'Aosta from 15 Oct); usual minimum hire age 21 (use.2, use.4, fines.2, use.8_it)."
  - url: https://www.garanteprivacy.it/
    supports: Italian Data Protection Authority (data.2).
title:
  en: Vehicle Rental Agreement
  local: Contratto di noleggio veicolo
subtitle:
  en: Self-drive car, motorbike, scooter and quad rental. {{country_name}}
  local: Noleggio senza conducente di auto, moto, scooter e quad. {{country_name}}
footer:
  en: Vehicle rental agreement · {{business_name}}
  local: Contratto di noleggio veicolo · {{business_name}}
page_words:
  page: Pagina
  of: di
sections:
  - id: parties
    title:
      en: 1. The parties
      local: 1. Le parti
    fields:
      - key: business_name
        en: Owner (rental business)
        local: Locatore (società di noleggio)
      - key: business_reg_no
        en: Company / VAT registration number
        local: Partita IVA / numero REA
      - key: business_address
        en: Business address
        local: Indirizzo della società
      - key: business_phone
        en: Phone / WhatsApp
        local: Telefono / WhatsApp
      - key: business_email
        en: Email
        local: E-mail
    clauses:
      - id: parties.1
        en: This agreement is made on {{renter_contract_date}} between the rental business named above (the "Owner") and the person named in section 2 (the "Renter"). Where there is more than one renter or driver, each of them is jointly responsible for every obligation in this agreement.
        local: Il presente contratto è stipulato il {{renter_contract_date}} tra la società di noleggio sopra indicata (il «Locatore») e la persona indicata nella sezione 2 (il «Conduttore»). Se vi sono più conduttori o conducenti, ciascuno risponde in solido di tutti gli obblighi del presente contratto.
  - id: renter
    title:
      en: 2. The Renter and drivers
      local: 2. Il Conduttore e i conducenti
    fields:
      - key: renter_name
        en: Full name (as on passport or ID)
        local: Nome e cognome (come sul passaporto o documento)
      - key: renter_nationality
        en: Nationality
        local: Nazionalità
      - key: renter_dob
        en: Date of birth
        local: Data di nascita
      - key: renter_id_no
        en: Passport or national ID number
        local: N. passaporto o documento d'identità
      - key: renter_home_address
        en: Home address
        local: Residenza
      - key: renter_local_address
        en: Address during the rental (hotel / apartment)
        local: Indirizzo durante il noleggio (hotel / appartamento)
      - key: renter_phone
        en: Phone / WhatsApp
        local: Telefono / WhatsApp
      - key: renter_email
        en: Email
        local: E-mail
      - key: renter_licence
        en: Driver's license number, categories and issuing country
        local: N. patente, categorie e paese di rilascio
      - key: renter_licence_expiry
        en: License expiry date / date first issued
        local: Scadenza patente / data del primo rilascio
      - key: renter_idp
        en: International Driving Permit (number / not required)
        local: Permesso internazionale di guida (numero / non necessario)
      - key: renter_emergency
        en: Emergency contact (name and phone)
        local: Contatto di emergenza (nome e telefono)
      - key: driver2_details
        en: Additional driver (name, ID, license), if any
        local: Conducente aggiuntivo (nome, documento, patente), se presente
    clauses:
      - id: renter.1
        en: The Renter confirms that the details above are true and complete, and that every person who will drive or ride the vehicle is named here. Only the Renter and any additional driver named above may drive or ride the vehicle.
        local: Il Conduttore conferma che i dati sopra indicati sono veri e completi e che vi figurano tutte le persone che guideranno il veicolo. Solo il Conduttore e il conducente aggiuntivo indicato possono guidarlo.
      - id: renter.2
        en: Every driver must hold a valid driver's license for this class of vehicle (category B for cars; AM, A1, A2 or A for motorcycles; in Italy a category B license also allows motorcycles up to 125 cc and 11 kW) and carry it while driving. Licenses from the EU and EEA are valid. A visitor with a license from outside the EU and EEA must carry an International Driving Permit or an official translation with it.
        local: Ogni conducente deve essere titolare di una patente valida per questa categoria di veicolo (categoria B per le auto; AM, A1, A2 o A per le moto; in Italia la patente B consente anche la guida di moto fino a 125 cc e 11 kW) e portarla con sé durante la guida. Le patenti dell'UE e del SEE sono valide. Un visitatore con patente rilasciata fuori dall'UE e dal SEE deve portare con sé un permesso internazionale di guida o una traduzione ufficiale.
        country: true
      - id: renter.3
        en: Each driver must meet the minimum age and the minimum period of holding a full license that the Owner stated at booking. Any young-driver or additional-driver charge is shown in this agreement before it is signed.
        local: Ogni conducente deve avere l'età minima e l'anzianità minima di patente indicate dal Locatore alla prenotazione. L'eventuale supplemento per conducente giovane o aggiuntivo è indicato nel presente contratto prima della firma.
  - id: vehicle
    title:
      en: 3. The vehicle
      local: 3. Il veicolo
    fields:
      - key: vehicle_type_label
        en: Type
        local: Tipo
      - key: vehicle_make_model
        en: Make and model
        local: Marca e modello
      - key: vehicle_year
        en: Year
        local: Anno
      - key: vehicle_plate
        en: Registration (plate) number
        local: Targa
      - key: vehicle_colour
        en: Color
        local: Colore
      - key: renter_vin
        en: Chassis / VIN number
        local: N. telaio (VIN)
      - key: out_odometer
        en: Odometer at handover
        local: Chilometri alla consegna
      - key: out_fuel
        en: Fuel / battery level at handover
        local: Livello carburante / batteria alla consegna
      - key: renter_accessories
        en: Accessories handed over (helmets, keys, child seat, warning triangle, vest, etc.)
        local: Accessori consegnati (caschi, chiavi, seggiolino, triangolo, giubbotto, ecc.)
    clauses:
      - id: vehicle.1
        en: The Owner rents the vehicle described above, with the accessories listed, to the Renter for the rental period and on the terms of this agreement. The vehicle remains the property of the Owner at all times.
        local: Il Locatore concede in noleggio al Conduttore il veicolo descritto, con gli accessori indicati, per il periodo di noleggio e alle condizioni del presente contratto. Il veicolo resta sempre di proprietà del Locatore.
      - id: vehicle.2
        en: The Owner confirms that the vehicle is registered, has a valid roadworthiness test where one is required (revisione), and has compulsory motor insurance valid for the whole rental period, and that it is handed over roadworthy, with the documents and safety equipment the law requires to be carried.
        local: Il Locatore conferma che il veicolo è immatricolato, ha la revisione in regola quando prevista (revisione) e l'assicurazione obbligatoria valida per tutto il noleggio, e che è consegnato in condizioni di efficienza, con i documenti e le dotazioni di sicurezza richiesti dalla legge.
        country: true
      - id: vehicle.3
        en: The Owner keeps the vehicle serviced as the manufacturer recommends and pays for normal mechanical repairs and wear unless this agreement says otherwise. On longer rentals the Owner arranges servicing with the Renter at a convenient time; if servicing takes more than one day, section 13 applies.
        local: Il Locatore esegue la manutenzione secondo le indicazioni del costruttore e sostiene le normali riparazioni meccaniche e l'usura, salvo diversa previsione. Nei noleggi lunghi il Locatore concorda la manutenzione con il Conduttore in un momento comodo; se dura più di un giorno si applica la sezione 13.
      - id: vehicle.4
        en: "During the rental the Renter looks after the vehicle's day-to-day condition: checking that tires, lights, brakes, oil and coolant look normal, and not driving or riding it if it becomes unsafe or unroadworthy."
        local: "Durante il noleggio il Conduttore cura lo stato quotidiano del veicolo: verifica che pneumatici, luci, freni, olio e liquido di raffreddamento appaiano normali e non lo usa se non è più sicuro."
  - id: period
    title:
      en: 4. Rental period, pickup and return
      local: 4. Periodo di noleggio, ritiro e riconsegna
    fields:
      - key: renter_start
        en: Start (date and time)
        local: Inizio (data e ora)
      - key: renter_end
        en: End (date and time)
        local: Fine (data e ora)
      - key: renter_pickup_place
        en: Pickup / delivery place
        local: Luogo di ritiro / consegna
      - key: renter_return_place
        en: Return / collection place
        local: Luogo di riconsegna / ritiro
    clauses:
      - id: period.1
        en: The Renter must return the vehicle at the agreed place, date and time. An extension is valid only when the Owner agrees to it in writing (a message is enough) and the extra rent is paid.
        local: Il Conduttore deve riconsegnare il veicolo nel luogo, nella data e all'ora concordati. Una proroga è valida solo se il Locatore la accetta per iscritto (basta un messaggio) e il canone aggiuntivo è pagato.
      - id: period.2
        if: late_hour_fee
        en: "Late return: after a grace period of {{late_grace_minutes}} minutes, each started hour costs {{currency}} {{late_hour_fee}}. A return more than {{late_full_day_hours}} hours late is charged as an extra full day at the daily rate."
        local: "Riconsegna tardiva: dopo una tolleranza di {{late_grace_minutes}} minuti, ogni ora iniziata costa {{currency}} {{late_hour_fee}}. Un ritardo superiore a {{late_full_day_hours}} ore è addebitato come un giorno in più alla tariffa giornaliera."
      - id: period.3
        unless: late_hour_fee
        en: "Late return: a return more than one hour late may be charged as an extra day at the daily rate."
        local: "Riconsegna tardiva: un ritardo superiore a un'ora può essere addebitato come un giorno in più alla tariffa giornaliera."
      - id: period.4
        en: If the vehicle is not returned and the Renter cannot be reached within 24 hours of the end time, the Owner may report it to the police and recover it, at the Renter's reasonable cost.
        local: Se il veicolo non viene riconsegnato e il Conduttore non è raggiungibile entro 24 ore dall'ora di fine, il Locatore può denunciare il fatto alla polizia e recuperare il veicolo, a spese ragionevoli del Conduttore.
      - id: period.5
        when:
          rate_period: month
        en: "Rolling monthly rental: where no end date is written above, the rental continues from month to month on the same terms until either party ends it as set out in section 7."
        local: "Noleggio mensile rinnovabile: se non è indicata una data di fine, il noleggio prosegue di mese in mese alle stesse condizioni finché una delle parti vi pone termine secondo la sezione 7."
  - id: charges
    title:
      en: 5. Price and payment
      local: 5. Prezzo e pagamento
    fields:
      - key: rate_text
        en: Rental rate
        local: Tariffa di noleggio
      - key: renter_total
        en: Total price for this booking (all compulsory charges included)
        local: Prezzo totale della prenotazione (tutti gli oneri obbligatori inclusi)
      - key: delivery_fee_text
        en: Delivery / collection fee
        local: Costo di consegna / ritiro
      - key: payment_methods
        en: Payment methods accepted
        local: Metodi di pagamento accettati
    clauses:
      - id: charges.1
        en: The Renter pays the price stated above in advance, unless the Owner agrees otherwise in writing. Prices are in {{currency_name}}, include VAT and every charge the Renter must pay (such as location surcharges, road tax and compulsory insurance), and show optional extras separately.
        local: Il Conduttore paga in anticipo il prezzo indicato, salvo diverso accordo scritto con il Locatore. I prezzi sono in {{currency_name}}, comprendono l'IVA e tutti gli oneri a carico del Conduttore (come supplementi di sede, tasse di circolazione e assicurazione obbligatoria) e indicano a parte gli extra facoltativi.
      - id: charges.2
        when:
          rate_period: month
        en: "Monthly rentals: rent is paid monthly in advance on the same day each month. If a payment is more than 7 days late and the Owner has reminded the Renter in writing, the Owner may end the rental and collect the vehicle (section 15)."
        local: "Noleggi mensili: il canone è pagato mensilmente in anticipo lo stesso giorno di ogni mese. Se un pagamento è in ritardo di oltre 7 giorni e il Locatore lo ha sollecitato per iscritto, il Locatore può porre fine al noleggio e ritirare il veicolo (sezione 15)."
      - id: charges.3
        en: Extras (child seats, delivery, additional drivers, excess reduction, snow chains and similar) cost what is written in this agreement or what the Owner confirmed in writing before the rental.
        local: Gli extra (seggiolini, consegna, conducenti aggiuntivi, riduzione della franchigia, catene da neve e simili) costano quanto indicato nel presente contratto o confermato per iscritto dal Locatore prima del noleggio.
  - id: deposit
    title:
      en: 6. Security deposit
      local: 6. Deposito cauzionale
    fields:
      - key: deposit_text
        en: Deposit
        local: Deposito cauzionale
      - key: renter_deposit_method
        en: Paid by (card hold / transfer / cash)
        local: Versato con (blocco su carta / bonifico / contanti)
      - key: deposit_return_text
        en: Returned or released within
        local: Restituito o sbloccato entro
    clauses:
      - id: deposit.1
        en: "The deposit secures the Renter's obligations: unpaid rent, damage up to the amount the Renter is liable for, fuel, mileage, cleaning, late return, lost keys or accessories and any other amount owed under this agreement."
        local: "Il deposito cauzionale garantisce gli obblighi del Conduttore: canoni non pagati, danni fino all'importo di cui risponde, carburante, chilometri, pulizia, riconsegna tardiva, chiavi o accessori smarriti e ogni altra somma dovuta in base al presente contratto."
      - id: deposit.2
        en: The Owner returns the deposit (or releases the card hold) after the vehicle has been returned and checked, less only amounts the Renter actually owes under this agreement. Each deduction is listed in writing with photos, receipts or quotes. If the amounts owed are more than the deposit, the Renter pays the difference within 14 days of receiving that list.
        local: Il Locatore restituisce il deposito (o sblocca la carta) dopo la riconsegna e la verifica del veicolo, trattenendo solo quanto il Conduttore deve effettivamente in base al presente contratto. Ogni trattenuta è indicata per iscritto con foto, fatture o preventivi. Se le somme dovute superano il deposito, il Conduttore paga la differenza entro 14 giorni dal ricevimento di tale elenco.
      - id: deposit.3
        en: The Owner does not hold back the deposit to wait for traffic fines. A fine that arrives after the rental is charged as set out in section 14.
        local: Il Locatore non trattiene il deposito in attesa di multe. Una multa che arriva dopo il noleggio è addebitata come previsto dalla sezione 14.
      - id: deposit.4
        en: The Owner will not keep the Renter's passport or identity card as a deposit. The Owner may check them and keep a copy to identify the Renter (section 17).
        local: Il Locatore non tratterrà il passaporto né la carta d'identità del Conduttore come garanzia. Può verificarli e conservarne una copia per identificarlo (sezione 17).
  - id: cancellation
    title:
      en: 7. Cancellation and early return
      local: 7. Cancellazione e riconsegna anticipata
    clauses:
      - id: cancellation.1
        if: cancel_free_hours
        en: The Renter may cancel free of charge up to {{cancel_free_hours}} hours before the start time. A later cancellation costs {{cancel_fee_percent}}% of the rent for the booked period (or of the first month on a monthly rental). If the Renter does not arrive at the start time and does not tell the Owner (a no-show), the Owner may keep the amount paid for the first {{no_show_days}} day(s) and release the vehicle.
        local: Il Conduttore può cancellare gratuitamente fino a {{cancel_free_hours}} ore prima dell'inizio. Una cancellazione successiva costa il {{cancel_fee_percent}}% del canone del periodo prenotato (o del primo mese per un noleggio mensile). Se il Conduttore non si presenta all'ora di inizio senza avvisare, il Locatore può trattenere quanto pagato per il primo giorno o i primi {{no_show_days}} giorni e disporre del veicolo.
      - id: cancellation.2
        unless: cancel_free_hours
        en: "Cancellation by the Renter before the start time: the Owner keeps only a booking payment that the booking confirmation clearly said was non-refundable, and refunds the rest."
        local: "Cancellazione da parte del Conduttore prima dell'inizio: il Locatore trattiene solo l'acconto che la conferma indicava chiaramente come non rimborsabile e restituisce il resto."
      - id: cancellation.3
        when:
          early_return: none
        en: "Early return: rent for the booked period is not refunded if the Renter returns the vehicle early."
        local: "Riconsegna anticipata: il canone del periodo prenotato non viene rimborsato se il Conduttore riconsegna prima il veicolo."
      - id: cancellation.4
        when:
          early_return: prorata
        en: "Early return: the Owner refunds the rent for the full unused days, less an early-return fee of {{currency}} {{early_return_fee}}. Long-term discounts that no longer apply may be recalculated at the rate for the period actually used."
        local: "Riconsegna anticipata: il Locatore rimborsa i giorni interi non utilizzati, meno una penale di {{currency}} {{early_return_fee}}. Gli sconti di lunga durata non più applicabili possono essere ricalcolati alla tariffa del periodo effettivamente utilizzato."
      - id: cancellation.5
        when:
          rate_period: month
        en: "Monthly rentals: either party may end the rental by giving {{notice_days}} days' written notice. Without notice, the Renter pays rent for the notice period."
        local: "Noleggi mensili: ciascuna parte può porre fine al noleggio con un preavviso scritto di {{notice_days}} giorni. In mancanza di preavviso, il Conduttore paga il canone del periodo di preavviso."
      - id: cancellation.6
        en: If the Owner cannot provide the vehicle (or a similar or better one) at the start time, the Renter may cancel and receive a full refund of everything paid.
        local: Se il Locatore non può fornire il veicolo (o uno simile o superiore) all'ora di inizio, il Conduttore può cancellare e ricevere il rimborso integrale di quanto pagato.
      - id: cancellation.7
        en: This rental is for specific dates, so the 14-day right of withdrawal for contracts made online or by phone does not apply (Directive 2011/83/EU, Article 16(l)).
        local: Il noleggio riguarda date determinate, quindi non si applica il diritto di recesso di 14 giorni dei contratti conclusi online o per telefono (direttiva 2011/83/UE, art. 16, lettera l)).
  - id: fuel
    title:
      en: 8. Fuel, charging and mileage
      local: 8. Carburante, ricarica e chilometraggio
    clauses:
      - id: fuel.1
        when:
          fuel_policy: same
        en: "Fuel policy: same-to-same. The vehicle must be returned with at least the fuel (or battery) level it had at handover."
        local: "Politica carburante: stesso livello. Il veicolo deve essere riconsegnato con almeno il livello di carburante (o batteria) che aveva alla consegna."
      - id: fuel.2
        when:
          fuel_policy: full
        en: "Fuel policy: full-to-full. The vehicle is handed over with a full tank and must be returned full."
        local: "Politica carburante: pieno/pieno. Il veicolo è consegnato con il pieno e deve essere riconsegnato con il pieno."
      - id: fuel.3
        en: Missing fuel is charged at the local pump price for the amount needed{{#if fuel_service_fee}}, plus a refuelling service fee of {{currency}} {{fuel_service_fee}}{{/if}}.
        local: Il carburante mancante è addebitato al prezzo locale alla pompa per la quantità necessaria{{#if fuel_service_fee}}, più un costo del servizio di rifornimento di {{currency}} {{fuel_service_fee}}{{/if}}.
      - id: fuel.4
        if: mileage_limit
        en: "Mileage allowance: {{mileage_limit}} km per {{mileage_period_label}}. Each extra kilometer costs {{currency}} {{excess_km_fee}}."
        local: "Chilometraggio incluso: {{mileage_limit}} km per {{mileage_period_label}}. Ogni chilometro in più costa {{currency}} {{excess_km_fee}}."
      - id: fuel.5
        unless: mileage_limit
        en: "Mileage: unlimited, within the permitted area (section 10)."
        local: "Chilometraggio: illimitato, all'interno della zona consentita (sezione 10)."
      - id: fuel.6
        en: The Renter must not tamper with the odometer, speed limiter or GPS tracker. Tampering is a serious breach (section 15).
        local: Il Conduttore non deve manomettere il contachilometri, il limitatore di velocità o il localizzatore GPS. La manomissione è un grave inadempimento (sezione 15).
      - id: fuel.7
        en: Only the fuel type stated by the manufacturer (or in the vehicle's documents) may be used. If the wrong fuel is put in, the Renter pays the actual, evidenced cost of draining the tank and of any repair it causes.
        local: Può essere usato solo il carburante indicato dal costruttore (o nei documenti del veicolo). In caso di carburante errato, il Conduttore paga il costo effettivo e documentato dello svuotamento del serbatoio e delle eventuali riparazioni.
  - id: use
    title:
      en: 9. Safe and lawful use
      local: 9. Uso sicuro e conforme alla legge
    clauses:
      - id: use.1
        en: The Renter must drive or ride carefully, obey all traffic laws, and keep the vehicle locked with the keys removed whenever it is left. Keys must never be left in or on the vehicle.
        local: Il Conduttore deve guidare con prudenza, rispettare tutte le norme della circolazione e lasciare il veicolo chiuso a chiave e senza chiavi ogni volta che si allontana. Le chiavi non devono mai restare dentro o sopra il veicolo.
      - id: use.2
        when:
          vehicle_type:
            - motorbike
            - ""
        en: "Motorbikes, scooters and quads: the rider and any passenger must wear a fastened, approved helmet at all times; the Owner provides helmets. No more than one passenger, and only where the vehicle is approved to carry one."
        local: "Moto, scooter e quad: conducente e passeggero devono indossare sempre un casco omologato e allacciato; il Locatore fornisce i caschi. Al massimo un passeggero, e solo se il veicolo è omologato per trasportarlo."
        country: true
      - id: use.3
        when:
          vehicle_type:
            - car
            - ""
        en: "Cars: every occupant must wear a seatbelt, and children under 150 cm tall (with an anti-abandonment device for children under 4) must travel in an approved child restraint suited to their weight and height. The number of passengers must not exceed the number of seats."
        local: "Auto: tutti gli occupanti devono allacciare le cinture e i bambini di statura inferiore a 150 cm (con dispositivo antiabbandono per i bambini sotto i 4 anni) devono viaggiare su un sistema di ritenuta omologato adatto al loro peso e alla loro statura. I passeggeri non possono superare i posti disponibili."
        country: true
      - id: use.4
        en: "It is forbidden to: drive with alcohol above the legal limit (0.5 g/l; zero for drivers under 21, in their first three years and professional drivers) or under the influence of drugs; use a hand-held phone while driving; race, perform stunts or drive off-road (unless the vehicle is meant for it and the Owner agreed); tow or push anything; carry {{#if commercial_use_banned}}goods for payment, {{/if}}illegal goods or dangerous loads; use the vehicle for {{#if commercial_use_banned}}ride-hailing, delivery work, {{/if}}driving lessons or to rent it to anyone else; let anyone not named in section 2 drive or ride."
        local: "È vietato: guidare con un tasso alcolemico superiore al limite di legge (0,5 g/l; zero per i conducenti sotto i 21 anni, nei primi tre anni di patente e professionali) o sotto l'effetto di droghe; usare il telefono in mano durante la guida; fare gare, acrobazie o guida fuoristrada (salvo che il veicolo sia adatto e il Locatore lo consenta); trainare o spingere alcunché; trasportare {{#if commercial_use_banned}}merci a pagamento, {{/if}}merci illecite o carichi pericolosi; usare il veicolo per {{#if commercial_use_banned}}servizi NCC, consegne, {{/if}}scuola guida o per noleggiarlo ad altri; far guidare persone non indicate nella sezione 2."
        country: true
      - id: use.8_it
        en: Between 15 November and 15 April, winter tires or snow chains on board are required on roads where signs show it (in Valle d'Aosta from 15 October). The Owner states what is fitted.
        local: Dal 15 novembre al 15 aprile, sulle strade dove è segnalato, sono obbligatori pneumatici invernali o catene a bordo (in Valle d'Aosta dal 15 ottobre). Il Locatore indica la dotazione del veicolo.
        country: true
      - id: use.9
        en: "No subletting or lending: the Renter must not sublet, rent out, lend or hand over the vehicle to anyone else, or let anyone not named in section 2 drive or ride it. Breaking this rule is a serious breach of this agreement."
        local: "Divieto di sublocazione e di prestito: il Conduttore non può sublocare, noleggiare, prestare o consegnare il veicolo ad altri, né farlo guidare a persone non indicate nella sezione 2. La violazione di questa regola costituisce grave inadempimento del presente contratto."
      - id: use.10
        when: { commercial_use: "yes" }
        en: "Paid rides and deliveries. The Renter may use the vehicle to carry passengers or deliver food or goods for payment, including through ride-hailing or delivery apps, on these conditions: (a) the Renter holds, and keeps valid, every license, permit and registration the law requires for that work, such as a ride-hailing or commercial driver permit where one applies; (b) the vehicle's standard insurance may not cover paid passenger or delivery use, so the Renter must have insurance suitable for that use, or use the app's own cover where it applies; (c) the Renter follows the app's rules and the law; (d) the Renter is responsible for any fines, damage and wear arising from that use; (e) subletting, lending and drivers not named in this agreement remain forbidden; (f) the vehicle's insurance terms and any extra deposit, mileage limit or other terms in this agreement still apply."
        local: "Trasporto di persone e consegne a pagamento. Il Conduttore può usare il veicolo per trasportare persone o consegnare cibo o merci a pagamento, anche tramite app di trasporto o di consegna, alle seguenti condizioni: (a) il Conduttore possiede, e mantiene validi, tutte le patenti, licenze, autorizzazioni e iscrizioni richieste dalla legge per tale attività, come un'autorizzazione per il trasporto di persone tramite app o una patente professionale ove previste; (b) l'assicurazione ordinaria del veicolo potrebbe non coprire il trasporto di persone o le consegne a pagamento, quindi il Conduttore deve avere un'assicurazione adatta a tale uso, o usare la copertura dell'app ove prevista; (c) il Conduttore rispetta le regole dell'app e la legge; (d) il Conduttore risponde di multe, danni e usura derivanti da tale uso; (e) restano vietati la sublocazione, il prestito e i conducenti non indicati nel contratto; (f) restano applicabili le condizioni assicurative del veicolo e ogni ulteriore deposito, limite di chilometraggio o altra condizione del contratto."
      - id: use.5
        when:
          smoking: no
        en: Smoking and vaping are not allowed in the vehicle.{{#if smoking_fee}} Breaking this rule costs a fee of {{currency}} {{smoking_fee}} for odor removal.{{/if}}
        local: È vietato fumare e svapare nel veicolo.{{#if smoking_fee}} La violazione costa {{currency}} {{smoking_fee}} per l'eliminazione degli odori.{{/if}}
      - id: use.6
        when:
          pets: no
        en: Pets and animals are not allowed in or on the vehicle, except assistance animals.
        local: Non sono ammessi animali nel veicolo, salvo i cani di assistenza.
      - id: use.7
        when:
          pets: fee
        en: Pets are allowed if they are kept in a carrier or on a seat cover. A pet cleaning fee of {{currency}} {{pet_fee}} applies.
        local: Gli animali sono ammessi se trasportati in un trasportino o su un telo coprisedile. Si applica un costo di pulizia di {{currency}} {{pet_fee}}.
  - id: area
    title:
      en: 10. Permitted area
      local: 10. Zona consentita
    fields:
      - key: area_of_use
        en: The vehicle may be used in
        local: Il veicolo può essere usato in
    clauses:
      - id: area.1
        en: The vehicle must stay within the permitted area above. Taking it further, on a ferry or to another island, needs the Owner's written permission first, and the Renter pays any ferry fees agreed and any recovery costs caused by breaking this rule.
        local: Il veicolo deve restare entro la zona consentita sopra indicata. Portarlo oltre, in traghetto o su un'altra isola richiede prima l'autorizzazione scritta del Locatore, e il Conduttore paga i traghetti concordati e i costi di recupero causati dalla violazione di questa regola.
      - id: area.2
        en: The vehicle may leave Italy only with the Owner's prior written permission and the insurance documents (Green Card where needed) the Owner provides; San Marino and Vatican City need no permission. Ferry travel to Sardinia, Sicily or abroad also needs permission.
        local: Il veicolo può uscire dall'Italia solo con la previa autorizzazione scritta del Locatore e con i documenti assicurativi (Carta Verde, se necessaria) da questi forniti; San Marino e la Città del Vaticano non richiedono autorizzazione. Anche il traghetto per la Sardegna, la Sicilia o l'estero richiede autorizzazione.
        country: true
      - id: area.3
        en: The vehicle may be fitted with a GPS tracker, used only for security, recovery and checking that this agreement is kept (section 17). The Renter has been told about it.
        local: Il veicolo può essere dotato di localizzatore GPS, usato solo per sicurezza, recupero e verifica del rispetto del presente contratto (sezione 17). Il Conduttore ne è stato informato.
  - id: insurance
    title:
      en: 11. Insurance and damage waiver
      local: 11. Assicurazione e limitazione di responsabilità
    fields:
      - key: insurance_text
        en: Cover on this vehicle
        local: Copertura del veicolo
      - key: insurance_excess_text
        en: Renter's excess (most the Renter pays per incident, if the rules are kept)
        local: Franchigia del Conduttore (importo massimo per sinistro, se rispetta le regole)
    clauses:
      - id: insurance.1
        en: The price includes the compulsory motor third-party liability insurance required in Italy, which covers injury and damage the vehicle causes to other people, at least to the minimum amounts set by EU and Italian law. It does not cover damage to or theft of the rented vehicle itself.
        local: Il prezzo comprende l'assicurazione obbligatoria RC auto prevista in Italia, che copre i danni a persone e cose causati a terzi dal veicolo, almeno per i massimali minimi stabiliti dalla normativa dell'UE e italiana. Non copre i danni né il furto del veicolo noleggiato.
        country: true
      - id: insurance.2
        when:
          insurance_level: comprehensive
        en: "Damage waiver (CDW) and theft protection: damage to and theft of the rented vehicle are also covered. Per incident, the Renter pays no more than the excess shown above, provided the Renter has kept the rules of this agreement."
        local: "Limitazione di responsabilità per danni (CDW) e furto: sono coperti anche i danni e il furto del veicolo noleggiato. Per ogni sinistro il Conduttore paga al massimo la franchigia indicata, purché abbia rispettato le regole del presente contratto."
      - id: insurance.3
        when:
          insurance_level: third_party
        en: "No damage waiver: the vehicle has third-party insurance with extended cover for other people's property, but damage to or theft of the rented vehicle is the Renter's responsibility (section 12), limited to the actual, evidenced cost."
        local: "Senza limitazione di responsabilità: il veicolo ha la RC auto con copertura estesa per i beni di terzi, ma i danni o il furto del veicolo noleggiato sono a carico del Conduttore (sezione 12), nei limiti del costo effettivo e documentato."
      - id: insurance.4
        when:
          insurance_level: compulsory
        en: The vehicle has only the compulsory insurance. Damage to or theft of the rented vehicle is the Renter's responsibility (section 12), limited to the actual, evidenced cost.
        local: Il veicolo ha solo l'assicurazione obbligatoria. I danni o il furto del veicolo noleggiato sono a carico del Conduttore (sezione 12), nei limiti del costo effettivo e documentato.
      - id: insurance.5
        en: "The damage waiver and insurance do not protect the Renter, and the Renter pays the actual cost, when damage or loss happens: while driving under the influence, without a valid license for the vehicle, by a driver not named in section 2, outside the permitted area, during forbidden use (section 9), through deliberate or grossly negligent acts, or when keys were left with the vehicle. Tires, wheels, glass, underbody, interior, keys and accessories are covered only if the Owner says so in writing."
        local: "La limitazione di responsabilità e l'assicurazione non proteggono il Conduttore, che paga il costo effettivo, quando il danno o la perdita si verificano: guidando sotto l'effetto di alcol o droghe, senza patente valida per il veicolo, con un conducente non indicato nella sezione 2, fuori dalla zona consentita, durante un uso vietato (sezione 9), per dolo o colpa grave, o lasciando le chiavi nel veicolo. Pneumatici, cerchi, cristalli, sottoscocca, interni, chiavi e accessori sono coperti solo se il Locatore lo indica per iscritto."
      - id: insurance.6
        en: Personal belongings left in or on the vehicle are not insured by the Owner, and the Owner is not responsible for their loss or damage except through its own fault.
        local: Gli oggetti personali lasciati nel veicolo non sono assicurati dal Locatore, che non risponde della loro perdita o danneggiamento salvo sua colpa.
      - id: insurance.7
        en: "Excess reduction: if the Renter buys the Owner's optional excess reduction, the excess is reduced as written in this agreement. Excess insurance bought by the Renter from another company is between the Renter and that insurer: the Renter pays the Owner and claims the amount back from it."
        local: "Riduzione della franchigia: se il Conduttore acquista la riduzione facoltativa della franchigia offerta dal Locatore, la franchigia si riduce come indicato nel presente contratto. Una polizza franchigia acquistata dal Conduttore presso un'altra compagnia riguarda solo il Conduttore e quella compagnia: il Conduttore paga il Locatore e chiede il rimborso alla propria compagnia."
  - id: damage
    title:
      en: 12. Damage, theft and loss
      local: 12. Danni, furto e smarrimento
    clauses:
      - id: damage.1
        en: The Renter is responsible for the vehicle from handover until it is returned and checked. The condition at handover is recorded in Annex A with photos; damage not recorded there is treated as new unless it is normal wear and tear.
        local: Il Conduttore è responsabile del veicolo dalla consegna fino alla riconsegna e alla verifica. Lo stato alla consegna è annotato nell'Allegato A con foto; i danni non annotati si considerano nuovi, salvo la normale usura.
      - id: damage.2
        en: Damage is charged at its actual, reasonable repair cost, shown by a garage quote or invoice, or at the agreed price in Annex B for listed items, never more than the excess where a damage waiver applies. The Owner sends the Renter any damage charge in writing within 30 days of return, with the photos and the quote or invoice. The Renter may ask for a second quote from a garage the Owner approves within 7 days.
        local: I danni sono addebitati al costo di riparazione effettivo e ragionevole, documentato da preventivo o fattura di un'officina, o al prezzo concordato nell'Allegato B per le voci elencate, mai oltre la franchigia se si applica la limitazione di responsabilità. Il Locatore comunica per iscritto ogni addebito per danni entro 30 giorni dalla riconsegna, con le foto e il preventivo o la fattura. Il Conduttore può chiedere entro 7 giorni un secondo preventivo a un'officina accettata dal Locatore.
      - id: damage.3
        if: loss_of_use_fee
        en: While the vehicle cannot be rented because of damage the Renter is responsible for, the Renter pays loss of use of {{currency}} {{loss_of_use_fee}} per day, for up to {{loss_of_use_max_days}} days, within the excess where a damage waiver applies.
        local: Finché il veicolo non può essere noleggiato a causa di danni di cui risponde il Conduttore, questi paga un fermo tecnico di {{currency}} {{loss_of_use_fee}} al giorno, per un massimo di {{loss_of_use_max_days}} giorni, entro la franchigia se si applica la limitazione di responsabilità.
      - id: damage.4
        en: If the vehicle or its keys are stolen, the Renter must report it to the police at once and give the Owner the police report and the keys. Where the theft happened because the vehicle was left unlocked, with the keys, or outside the permitted area, the Renter pays the vehicle's value as stated in Annex B (or its market value).
        local: In caso di furto del veicolo o delle chiavi, il Conduttore deve sporgere subito denuncia e consegnare al Locatore la denuncia e le chiavi. Se il furto è avvenuto perché il veicolo era aperto, con le chiavi o fuori dalla zona consentita, il Conduttore paga il valore del veicolo indicato nell'Allegato B (o il valore di mercato).
      - id: damage.5
        en: Lost keys, remote controls, helmets, documents, number plates and accessories are charged at their replacement cost, plus any locksmith or re-registration cost.
        local: Lo smarrimento di chiavi, telecomandi, caschi, documenti, targhe e accessori è addebitato al costo di sostituzione, più eventuali costi di fabbro o di reimmatricolazione.
  - id: accident
    title:
      en: 13. Accidents and breakdowns
      local: 13. Incidenti e guasti
    clauses:
      - id: accident.1
        en: "In an accident, the Renter must: make the area safe, wear the reflective vest and set out the warning triangle where required, and call 112 if anyone is hurt; call the Owner straight away on the number in section 1; call the police whenever someone is injured, the other party has no insurance or drives off, or the law requires it; complete and sign a European Accident Statement with the other driver where possible; take photos of all vehicles, plates, the place and any damage; and not admit fault, pay or accept money without the Owner's agreement."
        local: "In caso di incidente il Conduttore deve: mettere in sicurezza la zona, indossare il giubbotto retroriflettente e posizionare il triangolo quando previsto, e chiamare il 112 se ci sono feriti; chiamare subito il Locatore al numero della sezione 1; chiamare la polizia ogni volta che ci sono feriti, l'altra parte non è assicurata o si allontana, o la legge lo richiede; compilare e firmare con l'altro conducente il modulo di constatazione amichevole (CAI) quando possibile; fotografare tutti i veicoli, le targhe, il luogo e i danni; e non ammettere colpe, pagare o accettare denaro senza l'accordo del Locatore."
        country: true
      - id: accident.2
        en: "Breakdowns: the Renter must stop safely, tell the Owner and follow the Owner's instructions (or call the roadside assistance number the Owner gave). The Renter must not have the vehicle repaired without the Owner's permission, except for minor emergency costs up to {{currency}} {{emergency_repair_limit}}, which the Owner refunds against a receipt."
        local: "Guasti: il Conduttore deve fermarsi in sicurezza, avvisare il Locatore e seguirne le istruzioni (o chiamare il numero di assistenza stradale fornito). Non deve far riparare il veicolo senza il permesso del Locatore, salvo piccole spese urgenti fino a {{currency}} {{emergency_repair_limit}}, rimborsate dal Locatore dietro ricevuta."
      - id: accident.3
        en: If the vehicle stops working through no fault of the Renter, the Owner will repair it or provide a similar vehicle within 24 hours of being told where reasonably possible. If the Owner cannot, the Renter may end the rental and receive a refund of the rent for the unused days.
        local: Se il veicolo smette di funzionare senza colpa del Conduttore, il Locatore lo ripara o fornisce un veicolo simile entro 24 ore dalla segnalazione, se ragionevolmente possibile. In caso contrario, il Conduttore può porre fine al noleggio e ottenere il rimborso dei giorni non utilizzati.
      - id: accident.4
        en: The Renter must report any warning light, unusual noise, puncture or fault promptly and must not keep using a vehicle that is unsafe.
        local: Il Conduttore deve segnalare subito ogni spia accesa, rumore anomalo, foratura o guasto e non continuare a usare un veicolo non sicuro.
      - id: accident.5
        en: "Breakdowns caused by misuse: if a fault or damage is caused by the Renter's misuse or negligence (for example ignoring a warning light, the wrong fuel, overloading, towing, racing or driving off-road), and this is shown by a mechanic's report or other evidence, the Renter has no right to a refund for that breakdown and pays the actual, evidenced cost of repair and recovery."
        local: "Guasti per uso improprio: se un guasto o danno è causato da uso improprio o negligenza del Conduttore (per esempio ignorare una spia, carburante errato, sovraccarico, traino, gare o guida fuoristrada) e ciò risulta da una perizia dell'officina o da altra prova, il Conduttore non ha diritto a rimborso per quel guasto e paga il costo effettivo e documentato di riparazione e soccorso."
  - id: fines
    title:
      en: 14. Fines, tolls and charges
      local: 14. Multe, pedaggi e tariffe
    clauses:
      - id: fines.1
        en: The Renter pays all traffic and parking fines, tolls, congestion and low-emission-zone charges, towing, impound and clamping costs arising during the rental, including those that reach the Owner after the vehicle is returned{{#if fine_admin_fee}}, plus a handling fee of {{currency}} {{fine_admin_fee}} for each fine or notice the Owner has to handle{{/if}}.
        local: Il Conduttore paga tutte le multe per violazioni stradali e soste, pedaggi, tariffe per ZTL e zone a basse emissioni, rimozione, custodia e ganasce maturati durante il noleggio, anche quelli che arrivano al Locatore dopo la riconsegna{{#if fine_admin_fee}}, più un costo di gestione di {{currency}} {{fine_admin_fee}} per ogni multa o notifica che il Locatore deve gestire{{/if}}.
      - id: fines.2
        en: Under the Highway Code (Article 196) the Renter is jointly liable with the driver for offenses during the rental, and the Owner will give the Renter's details to the authority, which then notifies the fine to the Renter. Restricted traffic zones (ZTL) in historic centers are enforced by camera, and their fines can arrive months later; they are the Renter's. Where license points apply, the driver's details are communicated as Article 126-bis requires.
        local: Ai sensi del Codice della Strada (art. 196) il Conduttore risponde in solido con il conducente delle violazioni commesse durante il noleggio, e il Locatore comunicherà i suoi dati all'autorità, che notificherà la multa al Conduttore. Le zone a traffico limitato (ZTL) dei centri storici sono controllate da telecamere e le relative multe possono arrivare mesi dopo; sono a carico del Conduttore. Quando è prevista la decurtazione dei punti, i dati del conducente sono comunicati come richiede l'art. 126-bis.
        country: true
  - id: termination
    title:
      en: 15. Ending the agreement by the Owner
      local: 15. Risoluzione da parte del Locatore
    clauses:
      - id: termination.1
        en: "The Owner may end this agreement and take the vehicle back at once if the Renter: does not pay; gave false details; lets an unnamed person drive; uses the vehicle unlawfully or against section 9; takes it outside the permitted area without permission; tampers with the odometer or tracker; abandons it; or puts the vehicle or other people at serious risk. The Owner then deducts only what the Renter owes under this agreement, including reasonable recovery costs, and refunds the prepaid rent for the days after the vehicle is recovered."
        local: "Il Locatore può risolvere il presente contratto e riprendere subito il veicolo se il Conduttore: non paga; ha fornito dati falsi; fa guidare una persona non indicata; usa il veicolo in modo illecito o contrario alla sezione 9; lo porta fuori dalla zona consentita senza autorizzazione; manomette il contachilometri o il localizzatore; lo abbandona; o mette gravemente a rischio il veicolo o altre persone. Il Locatore trattiene solo quanto il Conduttore deve in base al presente contratto, compresi i costi ragionevoli di recupero, e rimborsa il canone pagato per i giorni successivi al recupero."
      - id: termination.2
        en: The Renter must make the vehicle available for collection, and pays reasonable recovery costs where the Owner has to fetch it.
        local: Il Conduttore deve rendere disponibile il veicolo per il ritiro e paga i costi ragionevoli di recupero quando il Locatore deve andarlo a prendere.
  - id: return
    title:
      en: 16. Returning the vehicle
      local: 16. Riconsegna del veicolo
    clauses:
      - id: return.1
        en: The vehicle must be returned with its keys, documents and accessories, with the fuel level agreed in section 8, and reasonably clean. Both parties check the vehicle together and record the condition, odometer and fuel in Annex A with photos. If the Renter chooses not to be present, the Owner's dated photos taken at the return are the record, and the Renter receives a copy.
        local: Il veicolo deve essere riconsegnato con chiavi, documenti e accessori, con il livello di carburante concordato nella sezione 8 e ragionevolmente pulito. Le parti verificano insieme il veicolo e annotano stato, chilometri e carburante nell'Allegato A con foto. Se il Conduttore sceglie di non essere presente, le foto datate scattate dal Locatore alla riconsegna valgono come verbale e il Conduttore ne riceve copia.
      - id: return.2
        if: cleaning_fee
        en: A vehicle returned with excessive dirt, sand, mud, stains, food or odor inside costs a cleaning fee of {{currency}} {{cleaning_fee}} (more only if specialist cleaning is needed, against a receipt).
        local: Un veicolo riconsegnato con sporco eccessivo, sabbia, fango, macchie, residui di cibo o odori all'interno comporta un costo di pulizia di {{currency}} {{cleaning_fee}} (superiore solo se serve una pulizia specialistica, dietro ricevuta).
      - id: return.3
        unless: cleaning_fee
        en: A vehicle returned with excessive dirt, sand, mud, stains, food or odor inside may be charged the reasonable cost of cleaning.
        local: Un veicolo riconsegnato con sporco eccessivo, sabbia, fango, macchie, residui di cibo o odori all'interno può comportare l'addebito del costo ragionevole della pulizia.
  - id: data
    title:
      en: 17. Personal data
      local: 17. Dati personali
    clauses:
      - id: data.1
        en: The Owner is the controller of the personal data of the Renter and drivers (names, contact details, ID and license details, copies of documents, vehicle photos and any tracker location data) under the GDPR and the Italian Privacy Code (Legislative Decree 196/2003). It uses them to provide this rental, check identity and license, meet legal duties (accounting, fines, police requests), handle claims and disputes, and protect the vehicle. It keeps them only as long as those purposes and the law require, keeps them secure and never sells them.
        local: Il Locatore è titolare del trattamento dei dati personali del Conduttore e dei conducenti (nome, contatti, dati del documento e della patente, copie dei documenti, foto del veicolo ed eventuale posizione del localizzatore) ai sensi del Regolamento generale sulla protezione dei dati (GDPR) e del Codice privacy (d.lgs. 196/2003). Li usa per fornire il noleggio, verificare identità e patente, adempiere agli obblighi di legge (contabilità, multe, richieste di polizia), gestire sinistri e controversie e proteggere il veicolo. Li conserva solo per il tempo richiesto da tali finalità e dalla legge, li protegge e non li vende mai.
        country: true
      - id: data.2
        en: "The Owner shares data only where needed: with insurers, repairers, the police, courts and the authorities that issue fines (a legal obligation), and with IT providers working for the Owner. The Renter may ask for access to, correction or deletion of, or a copy of their data, may object to processing based on the Owner's legitimate interests, and may complain to the Italian Data Protection Authority (Garante)."
        local: "Il Locatore comunica i dati solo se necessario: ad assicurazioni, officine, polizia, autorità giudiziarie e autorità che emettono multe (obbligo di legge) e ai fornitori informatici che lavorano per lui. Il Conduttore può chiedere l'accesso, la rettifica, la cancellazione o una copia dei propri dati, opporsi al trattamento basato sul legittimo interesse del Locatore e proporre reclamo al Garante per la protezione dei dati personali."
        country: true
  - id: general
    title:
      en: 18. General terms
      local: 18. Condizioni generali
    clauses:
      - id: general.1
        en: "Messages: notices under this agreement may be sent by phone, message app (such as WhatsApp), SMS or email to the contact details in sections 1 and 2. Messages, call logs and photos exchanged this way may be used as evidence of what was agreed."
        local: "Comunicazioni: le comunicazioni previste dal presente contratto possono essere inviate per telefono, app di messaggistica (come WhatsApp), SMS o e-mail ai recapiti delle sezioni 1 e 2. Messaggi, registri delle chiamate e foto scambiati in questo modo possono essere usati come prova di quanto concordato."
      - id: general.2
        en: "Force majeure: neither party is responsible for a delay or failure caused by events outside their control, such as natural disasters, storms, wildfires, government orders or ferry cancellations. Rent for days the vehicle could not be used because of such an event is agreed fairly between the parties."
        local: "Forza maggiore: nessuna parte risponde di ritardi o inadempimenti dovuti a eventi fuori dal suo controllo, come calamità naturali, tempeste, incendi boschivi, provvedimenti delle autorità o cancellazioni dei traghetti. Il canone dei giorni in cui il veicolo non ha potuto essere usato per tali eventi è concordato equamente tra le parti."
      - id: general.3
        en: "Whole agreement: this agreement, its annexes and any special conditions are the whole agreement. Changes are valid only in writing (a message from both parties is enough). If any part is found invalid, the rest still applies."
        local: "Intero accordo: il presente contratto, i suoi allegati e le condizioni particolari costituiscono l'intero accordo. Le modifiche sono valide solo per iscritto (basta un messaggio di entrambe le parti). Se una clausola è dichiarata invalida, il resto rimane valido."
      - id: general.4
        en: "Language: this agreement is written in English and Italian, as Italian law requires information for consumers to be given at least in Italian. If the versions differ, the meaning more favorable to the Renter applies."
        local: "Lingua: il presente contratto è redatto in inglese e in italiano, poiché la legge italiana richiede che le informazioni ai consumatori siano rese almeno in lingua italiana. In caso di divergenza prevale il significato più favorevole al Conduttore."
        country: true
      - id: general.5
        en: "Governing law: this agreement is governed by Italian law. Where the Renter is a consumer resident in Italy, the court of the Renter's place of residence has jurisdiction; a consumer living in another EU country may sue where they live where EU law allows it."
        local: "Legge applicabile: il presente contratto è regolato dalla legge italiana. Se il Conduttore è un consumatore residente in Italia, è competente il giudice del suo luogo di residenza; un consumatore residente in un altro paese dell'UE può agire dove vive, ove il diritto dell'UE lo consenta."
        country: true
      - id: general.6
        if: special_terms
        en: "Special conditions agreed between the parties: {{special_terms}}"
        local: "Condizioni particolari concordate tra le parti: {{special_terms}}"
      - id: general.7
        en: "Consumer rights: nothing in this agreement limits the rights a Renter who is a consumer has under mandatory consumer law, including the rules on unfair terms (Consumer Code, Legislative Decree 206/2005, Articles 33 to 38). The charges in this agreement are a genuine estimate of the Owner's loss and are never charged twice for the same loss. A dispute may also be taken to a consumer ADR body (for example chamber-of-commerce mediation)."
        local: "Diritti del consumatore: nessuna clausola del presente contratto limita i diritti che la normativa inderogabile riconosce al Conduttore consumatore, comprese le norme sulle clausole vessatorie (Codice del consumo, d.lgs. 206/2005, artt. 33-38). Gli addebiti del presente contratto sono una stima reale del danno del Locatore e non sono mai addebitati due volte per lo stesso danno. Le controversie possono essere sottoposte anche a un organismo ADR per i consumatori (ad esempio la mediazione delle Camere di commercio)."
        country: true
      - id: general.8
        en: "Electronic signature: this agreement may be signed on paper or electronically; both have the same effect (Regulation (EU) No 910/2014 (eIDAS), Article 25)."
        local: "Firma elettronica: il presente contratto può essere firmato su carta o elettronicamente; le due firme hanno lo stesso effetto (Regolamento (UE) n. 910/2014 (eIDAS), art. 25)."
  - id: signatures
    title:
      en: Signatures
      local: Firme
    signature: true
    clauses:
      - id: signatures.1
        en: By signing, the parties confirm they have read and understood this agreement, including Annexes A and B, and agree to it. The Renter confirms they received a copy.
        local: Con la firma, le parti confermano di aver letto e compreso il presente contratto, compresi gli Allegati A e B, e di accettarlo. Il Conduttore conferma di averne ricevuto copia.
    sign_rows:
      - en: Owner (name, signature, date)
        local: Locatore (nome, firma, data)
      - en: Renter (name, signature, date)
        local: Conduttore (nome, firma, data)
      - en: Additional driver (name, signature, date)
        local: Conducente aggiuntivo (nome, firma, data)
  - id: annex_a
    title:
      en: "Annex A: Handover and return check"
      local: "Allegato A: Verifica alla consegna e alla riconsegna"
    page_break: true
    checklist: true
    clauses:
      - id: annex_a.1
        en: Mark existing scratches (S), dents (D), cracks (C) and missing items (M). Take dated photos of all four sides, the dashboard (odometer and fuel), the interior and any damage, at both handover and return.
        local: Segnare graffi (G), ammaccature (A), crepe (C) e parti mancanti (M). Scattare foto datate dei quattro lati, del cruscotto (chilometri e carburante), degli interni e di ogni danno, sia alla consegna sia alla riconsegna.
