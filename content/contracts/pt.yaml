sources:
  - url: https://eur-lex.europa.eu/eli/dir/1993/13/oj
    supports: "Unfair Contract Terms Directive 93/13/EEC: terms must be plain and intelligible, doubts are read in the consumer's favor (Art 5), disproportionate compensation is unfair (Annex point e). Basis for general.4, general.7, deposit.2, damage.2."
  - url: https://eur-lex.europa.eu/eli/dir/2011/83/oj
    supports: "Consumer Rights Directive 2011/83/EU: total price including all compulsory charges (Arts 5-6); Art 16(l) no withdrawal right for car rental for a specific date or period (charges.1, cancellation.7)."
  - url: https://commission.europa.eu/topics/consumers/consumer-rights-and-complaints/enforcement-consumer-protection/coordinated-actions/other-travel-services_en
    supports: "EU consumer authorities (CPC) and the main rental companies, 2017: price transparency, clear insurance and waiver terms, fuel options and fairer damage handling. Basis for charges.1, insurance, fuel and damage.2."
  - url: https://eur-lex.europa.eu/eli/dir/2009/103/oj
    supports: "Motor Insurance Directive 2009/103/EC (as amended by 2021/2118): compulsory third-party cover with EU minimum amounts, valid across the EU (insurance.1)."
  - url: https://eur-lex.europa.eu/eli/dir/2006/126/oj
    supports: "Driving Licence Directive 2006/126/EC: categories AM, A1, A2, A and B; EU licenses recognized in every member state (renter.2)."
  - url: https://eur-lex.europa.eu/eli/dir/2015/413/oj
    supports: "Directive (EU) 2015/413: cross-border exchange of vehicle registration data for road-safety offenses, so fines follow foreign renters (fines.1)."
  - url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
    supports: "GDPR: controller duties, lawful bases (contract, legal obligation for giving driver details to authorities, legitimate interest), data subject rights (data.1, data.2)."
  - url: https://eur-lex.europa.eu/eli/reg/2014/910/oj
    supports: "eIDAS Regulation Art 25(1): an electronic signature may not be denied legal effect solely because it is electronic (general.8)."
  - url: https://eur-lex.europa.eu/eli/reg/2008/593/oj
    supports: "Rome I Regulation Art 6: consumer contracts and mandatory protection of the consumer's own law (general.5, general.7)."
  - url: https://eur-lex.europa.eu/eli/reg/2012/1215/oj
    supports: "Brussels I bis Regulation Arts 17-19: a consumer may sue in the courts where they live when the business directs its activities to that country (general.5)."
  - url: https://www.ccpc.ie/news-and-media/news/article/2026/06/16/consumer-rights-explained--i-think-my-holiday-car-hire-firm-is-trying-to-rip-me-off-what-are-my-rights
    supports: "CCPC (Irish consumer authority), 2026: damage may be charged only with clear evidence it happened during the rental; renters can ask for inspection reports and a cost breakdown; ECRCS conciliation (damage.2)."
  - url: https://imt.madeira.gov.pt/images/Documentos%20Veiculos/DecretoLei-181_2012.pdf
    supports: "Decree-Law 181/2012 (rent-a-car): Art 9 written contract with a Portuguese copy, mandatory contents incl. roadside assistance, ban on refuelling fees and on charging unlisted expenses except tolls; Art 15 documents to hand over (general.4, fuel.3, vehicle.5_pt, fines.2)."
  - url: https://www.cca.law/xms/files/INSIGHTS_AND_MEDIA/informative_notes/nota-informativaaluguer-de-carrospt.pdf
    supports: "CCA law firm note on Decree-Law 47/2018: electronic contracts allowed; fuel shortfall may be charged only in proportion to the refuelling cost actually incurred (fuel.3, general.8)."
  - url: https://www.imt-ip.pt/rodoviario/infraestruturas-rodoviarias/aluguer-veiculos-sem-condutor/
    supports: "IMT: rent-a-car operators must send their standard contract forms to the AMT before starting; licensing conditions (open item for operators)."
  - url: https://www.rac.co.uk/drive/travel/country/portugal
    supports: "RAC Portugal: children under 12 and 1.35 m in the back in a restraint; helmets; 0.05% limit, 0.02% new and professional drivers; electronic-only tolls, Via Verde and Easy Toll; usual minimum hire age 25 (use.3, use.4, fines.2)."
  - url: https://www.rr.pt/noticia/pais/2025/01/01/antigas-scut-sem-cobranca-de-portagens-a-partir-desta-quarta-feira/407961/
    supports: Tolls abolished on several former SCUT motorways from 1 January 2025; others remain electronic-only (fines.2).
  - url: https://www.livroreclamacoes.pt/
    supports: Electronic complaints book (general.9_pt).
  - url: https://www.cnpd.pt/
    supports: National Data Protection Commission (data.2).
  - url: "https://vlex.pt/vid/lei-n-45-2018-760961705"
    supports: "Lei n.º 45/2018: the legal regime for paid passenger transport in unmarked vehicles booked through electronic platforms (TVDE), with certified drivers and licensed operators (use.10)."
title:
  en: Vehicle Rental Agreement
  local: Contrato de aluguer de veículo
subtitle:
  en: Self-drive car, motorbike, scooter and quad rental. {{country_name}}
  local: Aluguer sem condutor de automóveis, motociclos, scooters e moto-4. {{country_name}}
footer:
  en: Vehicle rental agreement · {{business_name}}
  local: Contrato de aluguer de veículo · {{business_name}}
page_words:
  page: Página
  of: de
sections:
  - id: parties
    title:
      en: 1. The parties
      local: 1. As partes
    fields:
      - key: business_name
        en: Owner (rental business)
        local: Locador (empresa de aluguer)
      - key: business_reg_no
        en: Company / VAT registration number
        local: NIF / número de registo
      - key: business_address
        en: Business address
        local: Morada da empresa
      - key: business_phone
        en: Phone / WhatsApp
        local: Telefone / WhatsApp
      - key: business_email
        en: Email
        local: Correio eletrónico
    clauses:
      - id: parties.1
        en: This agreement is made on {{renter_contract_date}} between the rental business named above (the "Owner") and the person named in section 2 (the "Renter"). Where there is more than one renter or driver, each of them is jointly responsible for every obligation in this agreement.
        local: O presente contrato é celebrado em {{renter_contract_date}} entre a empresa de aluguer acima identificada (o «Locador») e a pessoa identificada na secção 2 (o «Locatário»). Havendo mais de um locatário ou condutor, todos respondem solidariamente por todas as obrigações deste contrato.
  - id: renter
    title:
      en: 2. The Renter and drivers
      local: 2. O Locatário e os condutores
    fields:
      - key: renter_name
        en: Full name (as on passport or ID)
        local: Nome completo (como no passaporte ou documento de identificação)
      - key: renter_nationality
        en: Nationality
        local: Nacionalidade
      - key: renter_dob
        en: Date of birth
        local: Data de nascimento
      - key: renter_id_no
        en: Passport or national ID number
        local: N.º do passaporte ou documento de identificação
      - key: renter_home_address
        en: Home address
        local: Morada
      - key: renter_local_address
        en: Address during the rental (hotel / apartment)
        local: Morada durante o aluguer (hotel / apartamento)
      - key: renter_phone
        en: Phone / WhatsApp
        local: Telefone / WhatsApp
      - key: renter_email
        en: Email
        local: Correio eletrónico
      - key: renter_licence
        en: Driver's license number, categories and issuing country
        local: N.º da carta de condução, categorias e país de emissão
      - key: renter_licence_expiry
        en: License expiry date / date first issued
        local: Validade da carta / data da primeira emissão
      - key: renter_idp
        en: International Driving Permit (number / not required)
        local: Licença internacional de condução (número / não necessária)
      - key: renter_emergency
        en: Emergency contact (name and phone)
        local: Contacto de emergência (nome e telefone)
      - key: driver2_details
        en: Additional driver (name, ID, license), if any
        local: Condutor adicional (nome, documento, carta), se houver
    clauses:
      - id: renter.1
        en: The Renter confirms that the details above are true and complete, and that every person who will drive or ride the vehicle is named here. Only the Renter and any additional driver named above may drive or ride the vehicle.
        local: O Locatário confirma que os dados acima são verdadeiros e completos e que nele constam todas as pessoas que irão conduzir o veículo. Só o Locatário e o condutor adicional acima identificado podem conduzi-lo.
      - id: renter.2
        en: Every driver must hold a valid driver's license for this class of vehicle (category B for cars; AM, A1, A2 or A for motorcycles) and carry it while driving. Licenses from the EU and EEA are valid; a visitor with another foreign license may drive on it for the period Portuguese law allows, with an International Driving Permit where the license is not recognized on its own.
        local: Cada condutor deve ter uma carta de condução válida para esta categoria de veículo (categoria B para automóveis; AM, A1, A2 ou A para motociclos) e trazê-la consigo durante a condução. As cartas da UE e do EEE são válidas; um visitante com outra carta estrangeira pode conduzir com ela pelo período que a lei portuguesa permite, com licença internacional de condução quando a carta não for reconhecida por si só.
        country: true
      - id: renter.3
        en: Each driver must meet the minimum age and the minimum period of holding a full license that the Owner stated at booking. Any young-driver or additional-driver charge is shown in this agreement before it is signed.
        local: Cada condutor deve ter a idade mínima e a antiguidade mínima de carta indicadas pelo Locador na reserva. Qualquer suplemento de condutor jovem ou adicional consta deste contrato antes da assinatura.
  - id: vehicle
    title:
      en: 3. The vehicle
      local: 3. O veículo
    fields:
      - key: vehicle_type_label
        en: Type
        local: Tipo
      - key: vehicle_make_model
        en: Make and model
        local: Marca e modelo
      - key: vehicle_year
        en: Year
        local: Ano
      - key: vehicle_plate
        en: Registration (plate) number
        local: Matrícula
      - key: vehicle_colour
        en: Color
        local: Cor
      - key: renter_vin
        en: Chassis / VIN number
        local: N.º de quadro (VIN)
      - key: out_odometer
        en: Odometer at handover
        local: Quilometragem na entrega
      - key: out_fuel
        en: Fuel / battery level at handover
        local: Nível de combustível / bateria na entrega
      - key: renter_accessories
        en: Accessories handed over (helmets, keys, child seat, warning triangle, vest, etc.)
        local: Acessórios entregues (capacetes, chaves, cadeira de criança, triângulo, colete, etc.)
    clauses:
      - id: vehicle.1
        en: The Owner rents the vehicle described above, with the accessories listed, to the Renter for the rental period and on the terms of this agreement. The vehicle remains the property of the Owner at all times.
        local: O Locador aluga ao Locatário o veículo descrito, com os acessórios indicados, pelo período de aluguer e nos termos deste contrato. O veículo continua a ser sempre propriedade do Locador.
      - id: vehicle.2
        en: The Owner confirms that the vehicle is registered, has a valid roadworthiness test where one is required (periodic inspection (IPO)), and has compulsory motor insurance valid for the whole rental period, and that it is handed over roadworthy, with the documents and safety equipment the law requires to be carried.
        local: O Locador confirma que o veículo está matriculado, tem a inspeção periódica em dia quando obrigatória (inspeção periódica obrigatória (IPO)) e o seguro obrigatório válido durante todo o aluguer, e que é entregue em condições de circular, com os documentos e o equipamento de segurança exigidos por lei.
        country: true
      - id: vehicle.3
        en: The Owner keeps the vehicle serviced as the manufacturer recommends and pays for normal mechanical repairs and wear unless this agreement says otherwise. On longer rentals the Owner arranges servicing with the Renter at a convenient time; if servicing takes more than one day, section 13 applies.
        local: O Locador faz a manutenção do veículo de acordo com o fabricante e suporta as reparações mecânicas normais e o desgaste, salvo disposição em contrário. Em alugueres longos, o Locador combina a manutenção com o Locatário num momento conveniente; se durar mais de um dia, aplica-se a secção 13.
      - id: vehicle.4
        en: "During the rental the Renter looks after the vehicle's day-to-day condition: checking that tires, lights, brakes, oil and coolant look normal, and not driving or riding it if it becomes unsafe or unroadworthy."
        local: "Durante o aluguer, o Locatário cuida do estado diário do veículo: verifica se pneus, luzes, travões, óleo e líquido de refrigeração parecem normais e não o utiliza se deixar de ser seguro."
      - id: vehicle.5_pt
        en: The Owner hands the Renter the vehicle's registration document (Documento Único Automóvel), proof of the motor insurance and a copy of this agreement, which must be kept in the vehicle and shown to the authorities on request (Decree-Law 181/2012, Article 15). The Owner also gives the roadside assistance name and phone number.
        local: O Locador entrega ao Locatário o documento único automóvel, o comprovativo do seguro automóvel e uma cópia deste contrato, que devem estar no veículo e ser apresentados às autoridades quando solicitados (Decreto-Lei n.º 181/2012, artigo 15.º). O Locador indica também o nome e o telefone da assistência em viagem.
        country: true
  - id: period
    title:
      en: 4. Rental period, pickup and return
      local: 4. Período de aluguer, levantamento e devolução
    fields:
      - key: renter_start
        en: Start (date and time)
        local: Início (data e hora)
      - key: renter_end
        en: End (date and time)
        local: Fim (data e hora)
      - key: renter_pickup_place
        en: Pickup / delivery place
        local: Local de levantamento / entrega
      - key: renter_return_place
        en: Return / collection place
        local: Local de devolução / recolha
    clauses:
      - id: period.1
        en: The Renter must return the vehicle at the agreed place, date and time. An extension is valid only when the Owner agrees to it in writing (a message is enough) and the extra rent is paid.
        local: O Locatário deve devolver o veículo no local, data e hora acordados. Uma prorrogação só é válida se o Locador a aceitar por escrito (basta uma mensagem) e o aluguer adicional for pago.
      - id: period.2
        if: late_hour_fee
        en: "Late return: after a grace period of {{late_grace_minutes}} minutes, each started hour costs {{currency}} {{late_hour_fee}}. A return more than {{late_full_day_hours}} hours late is charged as an extra full day at the daily rate."
        local: "Devolução tardia: após uma tolerância de {{late_grace_minutes}} minutos, cada hora iniciada custa {{currency}} {{late_hour_fee}}. Um atraso superior a {{late_full_day_hours}} horas é cobrado como um dia adicional à tarifa diária."
      - id: period.3
        unless: late_hour_fee
        en: "Late return: a return more than one hour late may be charged as an extra day at the daily rate."
        local: "Devolução tardia: um atraso superior a uma hora pode ser cobrado como um dia adicional à tarifa diária."
      - id: period.4
        en: If the vehicle is not returned and the Renter cannot be reached within 24 hours of the end time, the Owner may report it to the police and recover it, at the Renter's reasonable cost.
        local: Se o veículo não for devolvido e não for possível contactar o Locatário nas 24 horas seguintes à hora de fim, o Locador pode participar o facto à polícia e recuperar o veículo, a expensas razoáveis do Locatário.
      - id: period.5
        when:
          rate_period: month
        en: "Rolling monthly rental: where no end date is written above, the rental continues from month to month on the same terms until either party ends it as set out in section 7."
        local: "Aluguer mensal renovável: não havendo data de fim, o aluguer continua de mês a mês nas mesmas condições até que uma das partes lhe ponha termo nos termos da secção 7."
  - id: charges
    title:
      en: 5. Price and payment
      local: 5. Preço e pagamento
    fields:
      - key: rate_text
        en: Rental rate
        local: Tarifa de aluguer
      - key: renter_total
        en: Total price for this booking (all compulsory charges included)
        local: Preço total desta reserva (com todos os encargos obrigatórios)
      - key: delivery_fee_text
        en: Delivery / collection fee
        local: Taxa de entrega / recolha
      - key: payment_methods
        en: Payment methods accepted
        local: Meios de pagamento aceites
    clauses:
      - id: charges.1
        en: The Renter pays the price stated above in advance, unless the Owner agrees otherwise in writing. Prices are in {{currency_name}}, include VAT and every charge the Renter must pay (such as location surcharges, road tax and compulsory insurance), and show optional extras separately.
        local: O Locatário paga o preço indicado antecipadamente, salvo acordo escrito em contrário do Locador. Os preços são em {{currency_name}}, incluem IVA e todos os encargos que o Locatário tem de pagar (como taxas de local, imposto de circulação e seguro obrigatório), e os extras opcionais são indicados à parte.
      - id: charges.2
        when:
          rate_period: month
        en: "Monthly rentals: rent is paid monthly in advance on the same day each month. If a payment is more than 7 days late and the Owner has reminded the Renter in writing, the Owner may end the rental and collect the vehicle (section 15)."
        local: "Alugueres mensais: o aluguer é pago mensalmente e antecipadamente no mesmo dia de cada mês. Se um pagamento estiver atrasado mais de 7 dias e o Locador o tiver reclamado por escrito, o Locador pode pôr termo ao aluguer e recolher o veículo (secção 15)."
      - id: charges.3
        en: Extras (child seats, delivery, additional drivers, excess reduction, snow chains and similar) cost what is written in this agreement or what the Owner confirmed in writing before the rental.
        local: Os extras (cadeiras de criança, entrega, condutores adicionais, redução de franquia, correntes de neve e semelhantes) custam o indicado neste contrato ou o confirmado por escrito pelo Locador antes do aluguer.
  - id: deposit
    title:
      en: 6. Security deposit
      local: 6. Caução
    fields:
      - key: deposit_text
        en: Deposit
        local: Caução
      - key: renter_deposit_method
        en: Paid by (card hold / transfer / cash)
        local: Paga por (cativo no cartão / transferência / numerário)
      - key: deposit_return_text
        en: Returned or released within
        local: Devolvida ou libertada no prazo de
    clauses:
      - id: deposit.1
        en: "The deposit secures the Renter's obligations: unpaid rent, damage up to the amount the Renter is liable for, fuel, mileage, cleaning, late return, lost keys or accessories and any other amount owed under this agreement."
        local: "A caução garante as obrigações do Locatário: aluguer em dívida, danos até ao montante pelo qual responde, combustível, quilometragem, limpeza, devolução tardia, chaves ou acessórios perdidos e qualquer outra quantia devida nos termos deste contrato."
      - id: deposit.2
        en: The Owner returns the deposit (or releases the card hold) after the vehicle has been returned and checked, less only amounts the Renter actually owes under this agreement. Each deduction is listed in writing with photos, receipts or quotes. If the amounts owed are more than the deposit, the Renter pays the difference within 14 days of receiving that list.
        local: O Locador devolve a caução (ou liberta o cativo no cartão) depois de o veículo ser devolvido e verificado, deduzindo apenas as quantias que o Locatário efetivamente deva nos termos deste contrato. Cada dedução é discriminada por escrito, com fotografias, faturas ou orçamentos. Se o valor devido exceder a caução, o Locatário paga a diferença no prazo de 14 dias após receber essa discriminação.
      - id: deposit.3
        en: The Owner does not hold back the deposit to wait for traffic fines. A fine that arrives after the rental is charged as set out in section 14.
        local: O Locador não retém a caução à espera de coimas. Uma coima que chegue após o aluguer é cobrada nos termos da secção 14.
      - id: deposit.4
        en: The Owner will not keep the Renter's passport or identity card as a deposit. The Owner may check them and keep a copy to identify the Renter (section 17).
        local: O Locador não retém o passaporte nem o documento de identificação do Locatário como garantia. Pode verificá-los e guardar uma cópia para o identificar (secção 17).
  - id: cancellation
    title:
      en: 7. Cancellation and early return
      local: 7. Cancelamento e devolução antecipada
    clauses:
      - id: cancellation.1
        if: cancel_free_hours
        en: The Renter may cancel free of charge up to {{cancel_free_hours}} hours before the start time. A later cancellation costs {{cancel_fee_percent}}% of the rent for the booked period (or of the first month on a monthly rental). If the Renter does not arrive at the start time and does not tell the Owner (a no-show), the Owner may keep the amount paid for the first {{no_show_days}} day(s) and release the vehicle.
        local: O Locatário pode cancelar sem custos até {{cancel_free_hours}} horas antes do início. Um cancelamento posterior custa {{cancel_fee_percent}}% do aluguer do período reservado (ou do primeiro mês, num aluguer mensal). Se o Locatário não comparecer à hora de início sem avisar, o Locador pode reter o valor pago pelo primeiro dia ou primeiros {{no_show_days}} dias e dispor do veículo.
      - id: cancellation.2
        unless: cancel_free_hours
        en: "Cancellation by the Renter before the start time: the Owner keeps only a booking payment that the booking confirmation clearly said was non-refundable, and refunds the rest."
        local: "Cancelamento pelo Locatário antes do início: o Locador retém apenas o pagamento de reserva que a confirmação indicava claramente como não reembolsável e devolve o restante."
      - id: cancellation.3
        when:
          early_return: none
        en: "Early return: rent for the booked period is not refunded if the Renter returns the vehicle early."
        local: "Devolução antecipada: o aluguer do período reservado não é reembolsado se o Locatário devolver o veículo mais cedo."
      - id: cancellation.4
        when:
          early_return: prorata
        en: "Early return: the Owner refunds the rent for the full unused days, less an early-return fee of {{currency}} {{early_return_fee}}. Long-term discounts that no longer apply may be recalculated at the rate for the period actually used."
        local: "Devolução antecipada: o Locador reembolsa os dias completos não utilizados, deduzida uma taxa de {{currency}} {{early_return_fee}}. Os descontos de longa duração que deixem de se aplicar podem ser recalculados à tarifa do período efetivamente utilizado."
      - id: cancellation.5
        when:
          rate_period: month
        en: "Monthly rentals: either party may end the rental by giving {{notice_days}} days' written notice. Without notice, the Renter pays rent for the notice period."
        local: "Alugueres mensais: qualquer das partes pode pôr termo ao aluguer com um pré-aviso escrito de {{notice_days}} dias. Sem pré-aviso, o Locatário paga o aluguer do período de pré-aviso."
      - id: cancellation.6
        en: If the Owner cannot provide the vehicle (or a similar or better one) at the start time, the Renter may cancel and receive a full refund of everything paid.
        local: Se o Locador não puder disponibilizar o veículo (ou outro semelhante ou superior) à hora de início, o Locatário pode cancelar e receber o reembolso integral do que pagou.
      - id: cancellation.7
        en: This rental is for specific dates, so the 14-day right of withdrawal for contracts made online or by phone does not apply (Directive 2011/83/EU, Article 16(l)).
        local: Este aluguer é para datas determinadas, pelo que não se aplica o direito de livre resolução de 14 dias dos contratos celebrados pela internet ou por telefone (Diretiva 2011/83/UE, artigo 16.º, alínea l)).
  - id: fuel
    title:
      en: 8. Fuel, charging and mileage
      local: 8. Combustível, carregamento e quilometragem
    clauses:
      - id: fuel.1
        when:
          fuel_policy: same
        en: "Fuel policy: same-to-same. The vehicle must be returned with at least the fuel (or battery) level it had at handover."
        local: "Política de combustível: igual-igual. O veículo deve ser devolvido com, pelo menos, o nível de combustível (ou bateria) que tinha na entrega."
      - id: fuel.2
        when:
          fuel_policy: full
        en: "Fuel policy: full-to-full. The vehicle is handed over with a full tank and must be returned full."
        local: "Política de combustível: cheio-cheio. O veículo é entregue com o depósito cheio e deve ser devolvido cheio."
      - id: fuel.3
        en: Missing fuel is charged only at the actual cost of the fuel needed to refill it; no refuelling fee is charged (Decree-Law 181/2012, Article 9).
        local: O combustível em falta é cobrado apenas pelo custo efetivo do combustível necessário para o repor; não é cobrada qualquer taxa de abastecimento (Decreto-Lei n.º 181/2012, artigo 9.º).
        country: true
      - id: fuel.4
        if: mileage_limit
        en: "Mileage allowance: {{mileage_limit}} km per {{mileage_period_label}}. Each extra kilometer costs {{currency}} {{excess_km_fee}}."
        local: "Quilometragem incluída: {{mileage_limit}} km por {{mileage_period_label}}. Cada quilómetro adicional custa {{currency}} {{excess_km_fee}}."
      - id: fuel.5
        unless: mileage_limit
        en: "Mileage: unlimited, within the permitted area (section 10)."
        local: "Quilometragem: ilimitada, dentro da zona permitida (secção 10)."
      - id: fuel.6
        en: The Renter must not tamper with the odometer, speed limiter or GPS tracker. Tampering is a serious breach (section 15).
        local: O Locatário não deve manipular o conta-quilómetros, o limitador de velocidade nem o localizador GPS. A manipulação é um incumprimento grave (secção 15).
      - id: fuel.7
        en: Only the fuel type stated by the manufacturer (or in the vehicle's documents) may be used. If the wrong fuel is put in, the Renter pays the actual, evidenced cost of draining the tank and of any repair it causes.
        local: Só pode ser utilizado o combustível indicado pelo fabricante (ou nos documentos do veículo). Se for abastecido o combustível errado, o Locatário paga o custo real e comprovado de esvaziar o depósito e de qualquer reparação daí resultante.
  - id: use
    title:
      en: 9. Safe and lawful use
      local: 9. Utilização segura e legal
    clauses:
      - id: use.1
        en: The Renter must drive or ride carefully, obey all traffic laws, and keep the vehicle locked with the keys removed whenever it is left. Keys must never be left in or on the vehicle.
        local: O Locatário deve conduzir com cuidado, cumprir todas as regras de trânsito e deixar o veículo trancado e sem as chaves sempre que o deixar. As chaves nunca podem ficar dentro ou em cima do veículo.
      - id: use.2
        when:
          vehicle_type:
            - motorbike
            - ""
        en: "Motorbikes, scooters and quads: the rider and any passenger must wear a fastened, approved helmet at all times; the Owner provides helmets. No more than one passenger, and only where the vehicle is approved to carry one."
        local: "Motociclos, scooters e moto-4: o condutor e o passageiro devem usar sempre um capacete homologado e apertado; o Locador fornece os capacetes. No máximo um passageiro, e apenas se o veículo estiver homologado para o transportar."
        country: true
      - id: use.3
        when:
          vehicle_type:
            - car
            - ""
        en: "Cars: every occupant must wear a seatbelt, and children under 12 years old and under 135 cm must travel in an approved child restraint suited to their weight and height. The number of passengers must not exceed the number of seats."
        local: "Automóveis: todos os ocupantes devem usar o cinto de segurança e as crianças com menos de 12 anos e menos de 135 cm devem viajar num sistema de retenção homologado adequado ao seu peso e altura. O número de passageiros não pode exceder o número de lugares."
        country: true
      - id: use.4
        en: "It is forbidden to: drive with alcohol above the legal limit (0.5 g/l; 0.2 g/l for drivers in their first three years and professional drivers) or under the influence of drugs; use a hand-held phone while driving; race, perform stunts or drive off-road (unless the vehicle is meant for it and the Owner agreed); tow or push anything; carry {{#if commercial_use_banned}}goods for payment, {{/if}}illegal goods or dangerous loads; use the vehicle for {{#if commercial_use_banned}}ride-hailing, delivery work, {{/if}}driving lessons or to rent it to anyone else; let anyone not named in section 2 drive or ride."
        local: "É proibido: conduzir com uma taxa de álcool acima do limite legal (0,5 g/l; 0,2 g/l para condutores em regime probatório (três primeiros anos) e profissionais) ou sob a influência de drogas; usar o telemóvel na mão durante a condução; fazer corridas, acrobacias ou circular fora de estrada (salvo se o veículo se destinar a isso e o Locador o aceitar); rebocar ou empurrar o que quer que seja; transportar {{#if commercial_use_banned}}mercadorias mediante pagamento, {{/if}}mercadorias ilícitas ou cargas perigosas; usar o veículo em {{#if commercial_use_banned}}TVDE, entregas, {{/if}}ensino da condução ou para o alugar a terceiros; deixar conduzir alguém não identificado na secção 2."
        country: true
      - id: use.9
        en: "No subletting or lending: the Renter must not sublet, rent out, lend or hand over the vehicle to anyone else, or let anyone not named in section 2 drive or ride it. Breaking this rule is a serious breach of this agreement."
        local: "Proibição de subaluguer e de empréstimo: o Locatário não pode subalugar, alugar, emprestar ou entregar o veículo a outra pessoa, nem deixá-lo conduzir por alguém não identificado na secção 2. A violação desta regra constitui incumprimento grave do presente contrato."
      - id: use.10
        when: { commercial_use: "yes" }
        en: "Paid rides and deliveries. The Renter may use the vehicle to carry passengers or deliver food or goods for payment, including through ride-hailing or delivery apps, on these conditions: (a) the Renter holds, and keeps valid, every license, permit and registration the law requires for that work, such as a ride-hailing or commercial driver permit where one applies; (b) the vehicle's standard insurance may not cover paid passenger or delivery use, so the Renter must have insurance suitable for that use, or use the app's own cover where it applies; (c) the Renter follows the app's rules and the law; (d) the Renter is responsible for any fines, damage and wear arising from that use; (e) subletting, lending and drivers not named in this agreement remain forbidden; (f) the vehicle's insurance terms and any extra deposit, mileage limit or other terms in this agreement still apply."
        local: "Transporte de passageiros e entregas remunerados. O Locatário pode usar o veículo para transportar passageiros ou entregar refeições ou mercadorias mediante pagamento, incluindo através de plataformas TVDE ou de entregas, nas seguintes condições: (a) o Locatário tem, e mantém válidos, todas as cartas, licenças, certificados e registos que a lei exige para essa atividade, como o certificado de motorista TVDE ou uma licença de condutor profissional quando aplicável; (b) o seguro normal do veículo pode não cobrir o transporte de passageiros ou as entregas remuneradas, pelo que o Locatário deve ter um seguro adequado a esse uso, ou usar a cobertura da plataforma quando exista; (c) o Locatário cumpre as regras da plataforma e a lei; (d) o Locatário é responsável pelas multas, danos e desgaste resultantes desse uso; (e) continuam proibidos o subaluguer, o empréstimo e os condutores não identificados neste contrato; (f) continuam a aplicar-se as condições do seguro do veículo e qualquer caução adicional, limite de quilometragem ou outra condição deste contrato."
      - id: use.5
        when:
          smoking: no
        en: Smoking and vaping are not allowed in the vehicle.{{#if smoking_fee}} Breaking this rule costs a fee of {{currency}} {{smoking_fee}} for odor removal.{{/if}}
        local: Não é permitido fumar nem vaporizar no veículo.{{#if smoking_fee}} O incumprimento desta regra custa {{currency}} {{smoking_fee}} para remoção de odores.{{/if}}
      - id: use.6
        when:
          pets: no
        en: Pets and animals are not allowed in or on the vehicle, except assistance animals.
        local: Não são permitidos animais no veículo, exceto cães de assistência.
      - id: use.7
        when:
          pets: fee
        en: Pets are allowed if they are kept in a carrier or on a seat cover. A pet cleaning fee of {{currency}} {{pet_fee}} applies.
        local: São permitidos animais de estimação se viajarem numa transportadora ou sobre uma capa. Aplica-se uma taxa de limpeza de {{currency}} {{pet_fee}}.
  - id: area
    title:
      en: 10. Permitted area
      local: 10. Zona permitida
    fields:
      - key: area_of_use
        en: The vehicle may be used in
        local: O veículo pode ser utilizado em
    clauses:
      - id: area.1
        en: The vehicle must stay within the permitted area above. Taking it further, on a ferry or to another island, needs the Owner's written permission first, and the Renter pays any ferry fees agreed and any recovery costs caused by breaking this rule.
        local: O veículo deve permanecer dentro da zona permitida acima indicada. Levá-lo mais longe, de ferry ou para outra ilha exige autorização escrita prévia do Locador, e o Locatário paga as travessias acordadas e os custos de recuperação causados pelo incumprimento desta regra.
      - id: area.2
        en: The vehicle may leave mainland Portugal (including to Spain) only with the Owner's prior written permission and the insurance documents the Owner provides. A vehicle rented in Madeira or the Azores stays on that island unless the Owner agrees in writing.
        local: O veículo só pode sair de Portugal continental (incluindo para Espanha) com autorização prévia e escrita do Locador e com os documentos do seguro que este fornecer. Um veículo alugado na Madeira ou nos Açores permanece nessa ilha, salvo acordo escrito do Locador.
        country: true
      - id: area.3
        en: The vehicle may be fitted with a GPS tracker, used only for security, recovery and checking that this agreement is kept (section 17). The Renter has been told about it.
        local: O veículo pode ter um localizador GPS, usado apenas para segurança, recuperação e verificação do cumprimento deste contrato (secção 17). O Locatário foi informado disso.
  - id: insurance
    title:
      en: 11. Insurance and damage waiver
      local: 11. Seguro e isenção de danos
    fields:
      - key: insurance_text
        en: Cover on this vehicle
        local: Cobertura deste veículo
      - key: insurance_excess_text
        en: Renter's excess (most the Renter pays per incident, if the rules are kept)
        local: Franquia do Locatário (máximo que paga por sinistro, se cumprir as regras)
    clauses:
      - id: insurance.1
        en: The price includes the compulsory motor third-party liability insurance required in Portugal, which covers injury and damage the vehicle causes to other people, at least to the minimum amounts set by Portuguese law (Decree-Law 291/2007) under EU rules. It does not cover damage to or theft of the rented vehicle itself.
        local: O preço inclui o seguro obrigatório de responsabilidade civil automóvel exigido em Portugal, que cobre os danos corporais e materiais causados pelo veículo a terceiros, pelo menos até aos capitais mínimos fixados por lei (Decreto-Lei n.º 291/2007), nos termos do direito da UE. Não cobre danos nem furto do próprio veículo alugado.
        country: true
      - id: insurance.2
        when:
          insurance_level: comprehensive
        en: "Damage waiver (CDW) and theft protection: damage to and theft of the rented vehicle are also covered. Per incident, the Renter pays no more than the excess shown above, provided the Renter has kept the rules of this agreement."
        local: "Isenção de danos (CDW) e proteção contra furto: os danos e o furto do veículo alugado também estão cobertos. Por sinistro, o Locatário não paga mais do que a franquia indicada, desde que tenha cumprido as regras deste contrato."
      - id: insurance.3
        when:
          insurance_level: third_party
        en: "No damage waiver: the vehicle has third-party insurance with extended cover for other people's property, but damage to or theft of the rented vehicle is the Renter's responsibility (section 12), limited to the actual, evidenced cost."
        local: "Sem isenção de danos: o veículo tem seguro de responsabilidade civil com cobertura alargada para bens de terceiros, mas os danos ou o furto do veículo alugado são da responsabilidade do Locatário (secção 12), limitada ao custo real e comprovado."
      - id: insurance.4
        when:
          insurance_level: compulsory
        en: The vehicle has only the compulsory insurance. Damage to or theft of the rented vehicle is the Renter's responsibility (section 12), limited to the actual, evidenced cost.
        local: O veículo tem apenas o seguro obrigatório. Os danos ou o furto do veículo alugado são da responsabilidade do Locatário (secção 12), limitada ao custo real e comprovado.
      - id: insurance.5
        en: "The damage waiver and insurance do not protect the Renter, and the Renter pays the actual cost, when damage or loss happens: while driving under the influence, without a valid license for the vehicle, by a driver not named in section 2, outside the permitted area, during forbidden use (section 9), through deliberate or grossly negligent acts, or when keys were left with the vehicle. Tires, wheels, glass, underbody, interior, keys and accessories are covered only if the Owner says so in writing."
        local: "A isenção de danos e o seguro não protegem o Locatário, que paga o custo real, quando o dano ou a perda ocorrem: com condução sob a influência de álcool ou drogas, sem carta válida para o veículo, por condutor não identificado na secção 2, fora da zona permitida, durante uma utilização proibida (secção 9), por atos dolosos ou negligência grave, ou com as chaves deixadas no veículo. Pneus, jantes, vidros, parte inferior, interior, chaves e acessórios só estão cobertos se o Locador o indicar por escrito."
      - id: insurance.6
        en: Personal belongings left in or on the vehicle are not insured by the Owner, and the Owner is not responsible for their loss or damage except through its own fault.
        local: Os bens pessoais deixados no veículo não estão seguros pelo Locador, que não responde pela sua perda ou dano, salvo por culpa própria.
      - id: insurance.7
        en: "Excess reduction: if the Renter buys the Owner's optional excess reduction, the excess is reduced as written in this agreement. Excess insurance bought by the Renter from another company is between the Renter and that insurer: the Renter pays the Owner and claims the amount back from it."
        local: "Redução de franquia: se o Locatário contratar a redução de franquia opcional do Locador, a franquia é reduzida conforme indicado neste contrato. Um seguro de franquia contratado pelo Locatário a outra empresa é uma questão entre o Locatário e essa seguradora: o Locatário paga ao Locador e reclama o valor à sua seguradora."
  - id: damage
    title:
      en: 12. Damage, theft and loss
      local: 12. Danos, furto e perda
    clauses:
      - id: damage.1
        en: The Renter is responsible for the vehicle from handover until it is returned and checked. The condition at handover is recorded in Annex A with photos; damage not recorded there is treated as new unless it is normal wear and tear.
        local: O Locatário é responsável pelo veículo desde a entrega até à devolução e verificação. O estado na entrega é registado no Anexo A com fotografias; os danos não registados consideram-se novos, salvo o desgaste normal.
      - id: damage.2
        en: Damage is charged at its actual, reasonable repair cost, shown by a garage quote or invoice, or at the agreed price in Annex B for listed items, never more than the excess where a damage waiver applies. The Owner sends the Renter any damage charge in writing within 30 days of return, with the photos and the quote or invoice. The Renter may ask for a second quote from a garage the Owner approves within 7 days.
        local: Os danos são cobrados pelo custo real e razoável da reparação, comprovado por orçamento ou fatura de uma oficina, ou pelo preço acordado no Anexo B para os elementos da lista, e nunca acima da franquia quando há isenção de danos. O Locador comunica por escrito qualquer cobrança de danos nos 30 dias seguintes à devolução, com as fotografias e o orçamento ou a fatura. O Locatário pode pedir, no prazo de 7 dias, um segundo orçamento a uma oficina aceite pelo Locador.
      - id: damage.3
        if: loss_of_use_fee
        en: While the vehicle cannot be rented because of damage the Renter is responsible for, the Renter pays loss of use of {{currency}} {{loss_of_use_fee}} per day, for up to {{loss_of_use_max_days}} days, within the excess where a damage waiver applies.
        local: Enquanto o veículo não puder ser alugado devido a danos pelos quais o Locatário responde, este paga uma indemnização por imobilização de {{currency}} {{loss_of_use_fee}} por dia, até {{loss_of_use_max_days}} dias, dentro da franquia quando há isenção de danos.
      - id: damage.4
        en: If the vehicle or its keys are stolen, the Renter must report it to the police at once and give the Owner the police report and the keys. Where the theft happened because the vehicle was left unlocked, with the keys, or outside the permitted area, the Renter pays the vehicle's value as stated in Annex B (or its market value).
        local: Se o veículo ou as chaves forem furtados, o Locatário deve participar de imediato à polícia e entregar ao Locador a participação e as chaves. Se o furto resultar de o veículo ter sido deixado aberto, com as chaves ou fora da zona permitida, o Locatário paga o valor do veículo indicado no Anexo B (ou o seu valor de mercado).
      - id: damage.5
        en: Lost keys, remote controls, helmets, documents, number plates and accessories are charged at their replacement cost, plus any locksmith or re-registration cost.
        local: A perda de chaves, comandos, capacetes, documentos, chapas de matrícula e acessórios é cobrada pelo custo de substituição, acrescido de eventuais custos de serralharia ou de nova matrícula.
  - id: accident
    title:
      en: 13. Accidents and breakdowns
      local: 13. Acidentes e avarias
    clauses:
      - id: accident.1
        en: "In an accident, the Renter must: make the area safe, wear the reflective vest and set out the warning triangle where required, and call 112 if anyone is hurt; call the Owner straight away on the number in section 1; call the police whenever someone is injured, the other party has no insurance or drives off, or the law requires it; complete and sign a European Accident Statement with the other driver where possible; take photos of all vehicles, plates, the place and any damage; and not admit fault, pay or accept money without the Owner's agreement."
        local: "Em caso de acidente, o Locatário deve: sinalizar e tornar segura a zona, vestir o colete refletor e colocar o triângulo quando obrigatório, e ligar 112 se houver feridos; contactar de imediato o Locador pelo número da secção 1; chamar a polícia sempre que haja feridos, o outro condutor não tenha seguro ou fuja, ou a lei o exija; preencher e assinar com o outro condutor uma Declaração Amigável de Acidente Automóvel sempre que possível; fotografar todos os veículos, matrículas, o local e os danos; e não assumir culpa, pagar ou aceitar dinheiro sem o acordo do Locador."
        country: true
      - id: accident.2
        en: "Breakdowns: the Renter must stop safely, tell the Owner and follow the Owner's instructions (or call the roadside assistance number the Owner gave). The Renter must not have the vehicle repaired without the Owner's permission, except for minor emergency costs up to {{currency}} {{emergency_repair_limit}}, which the Owner refunds against a receipt."
        local: "Avarias: o Locatário deve parar em segurança, avisar o Locador e seguir as suas instruções (ou ligar para o número de assistência em viagem indicado). Não pode mandar reparar o veículo sem autorização do Locador, salvo pequenas despesas urgentes até {{currency}} {{emergency_repair_limit}}, que o Locador reembolsa contra fatura."
      - id: accident.3
        en: If the vehicle stops working through no fault of the Renter, the Owner will repair it or provide a similar vehicle within 24 hours of being told where reasonably possible. If the Owner cannot, the Renter may end the rental and receive a refund of the rent for the unused days.
        local: Se o veículo deixar de funcionar sem culpa do Locatário, o Locador repara-o ou disponibiliza um veículo semelhante nas 24 horas seguintes ao aviso, quando razoavelmente possível. Se não puder, o Locatário pode pôr termo ao aluguer e receber o reembolso dos dias não utilizados.
      - id: accident.4
        en: The Renter must report any warning light, unusual noise, puncture or fault promptly and must not keep using a vehicle that is unsafe.
        local: O Locatário deve comunicar sem demora qualquer luz de aviso, ruído anormal, furo ou avaria e não continuar a usar um veículo que não seja seguro.
      - id: accident.5
        en: "Breakdowns caused by misuse: if a fault or damage is caused by the Renter's misuse or negligence (for example ignoring a warning light, the wrong fuel, overloading, towing, racing or driving off-road), and this is shown by a mechanic's report or other evidence, the Renter has no right to a refund for that breakdown and pays the actual, evidenced cost of repair and recovery."
        local: "Avarias por má utilização: se uma avaria ou dano resultar de má utilização ou negligência do Locatário (por exemplo, ignorar uma luz de aviso, combustível errado, excesso de carga, reboque, corridas ou condução fora de estrada) e isso for comprovado por relatório de oficina ou outra prova, o Locatário não tem direito a reembolso por essa avaria e paga o custo real e comprovado da reparação e do reboque."
  - id: fines
    title:
      en: 14. Fines, tolls and charges
      local: 14. Coimas, portagens e taxas
    clauses:
      - id: fines.1
        en: The Renter pays all traffic and parking fines, tolls, congestion and low-emission-zone charges, towing, impound and clamping costs arising during the rental, including those that reach the Owner after the vehicle is returned{{#if fine_admin_fee}}, plus a handling fee of {{currency}} {{fine_admin_fee}} for each fine or notice the Owner has to handle{{/if}}.
        local: O Locatário paga todas as coimas de trânsito e estacionamento, portagens, taxas de zonas de emissões reduzidas, reboque, parqueamento e bloqueamento geradas durante o aluguer, incluindo as que cheguem ao Locador após a devolução{{#if fine_admin_fee}}, acrescidas de uma taxa de gestão de {{currency}} {{fine_admin_fee}} por cada coima ou notificação que o Locador tenha de tratar{{/if}}.
      - id: fines.2
        en: "Fines for offenses during the rental are the driver's: when the authority notifies the Owner, the Owner identifies the Renter as the driver, as the Highway Code allows. Tolls on electronic-only motorways are charged to the vehicle (through its Via Verde device or number plate); the Renter pays those incurred during the rental at cost, as shown on the final invoice."
        local: "As coimas por infrações durante o aluguer são da responsabilidade do condutor: quando a autoridade notifica o Locador, este identifica o Locatário como condutor, nos termos do Código da Estrada. As portagens das autoestradas com cobrança apenas eletrónica são cobradas ao veículo (através do dispositivo Via Verde ou da matrícula); o Locatário paga, ao custo, as geradas durante o aluguer, conforme a fatura final."
        country: true
  - id: termination
    title:
      en: 15. Ending the agreement by the Owner
      local: 15. Resolução do contrato pelo Locador
    clauses:
      - id: termination.1
        en: "The Owner may end this agreement and take the vehicle back at once if the Renter: does not pay; gave false details; lets an unnamed person drive; uses the vehicle unlawfully or against section 9; takes it outside the permitted area without permission; tampers with the odometer or tracker; abandons it; or puts the vehicle or other people at serious risk. The Owner then deducts only what the Renter owes under this agreement, including reasonable recovery costs, and refunds the prepaid rent for the days after the vehicle is recovered."
        local: "O Locador pode resolver este contrato e recuperar o veículo de imediato se o Locatário: não pagar; tiver prestado dados falsos; deixar conduzir uma pessoa não identificada; usar o veículo de forma ilícita ou contrária à secção 9; o levar para fora da zona permitida sem autorização; manipular o conta-quilómetros ou o localizador; o abandonar; ou puser em risco grave o veículo ou outras pessoas. O Locador deduz apenas o que o Locatário deva nos termos deste contrato, incluindo custos razoáveis de recuperação, e reembolsa o aluguer pago pelos dias posteriores à recuperação."
      - id: termination.2
        en: The Renter must make the vehicle available for collection, and pays reasonable recovery costs where the Owner has to fetch it.
        local: O Locatário deve disponibilizar o veículo para recolha e paga os custos razoáveis de recuperação quando o Locador tiver de o ir buscar.
  - id: return
    title:
      en: 16. Returning the vehicle
      local: 16. Devolução do veículo
    clauses:
      - id: return.1
        en: The vehicle must be returned with its keys, documents and accessories, with the fuel level agreed in section 8, and reasonably clean. Both parties check the vehicle together and record the condition, odometer and fuel in Annex A with photos. If the Renter chooses not to be present, the Owner's dated photos taken at the return are the record, and the Renter receives a copy.
        local: O veículo deve ser devolvido com as chaves, documentos e acessórios, com o nível de combustível acordado na secção 8 e razoavelmente limpo. Ambas as partes verificam o veículo em conjunto e registam o estado, a quilometragem e o combustível no Anexo A, com fotografias. Se o Locatário optar por não estar presente, as fotografias datadas tiradas pelo Locador na devolução servem de registo e o Locatário recebe uma cópia.
      - id: return.2
        if: cleaning_fee
        en: A vehicle returned with excessive dirt, sand, mud, stains, food or odor inside costs a cleaning fee of {{currency}} {{cleaning_fee}} (more only if specialist cleaning is needed, against a receipt).
        local: Um veículo devolvido com sujidade excessiva, areia, lama, nódoas, restos de comida ou odores no interior tem uma taxa de limpeza de {{currency}} {{cleaning_fee}} (mais apenas se for necessária limpeza especializada, contra fatura).
      - id: return.3
        unless: cleaning_fee
        en: A vehicle returned with excessive dirt, sand, mud, stains, food or odor inside may be charged the reasonable cost of cleaning.
        local: Um veículo devolvido com sujidade excessiva, areia, lama, nódoas, restos de comida ou odores no interior pode implicar o custo razoável da limpeza.
  - id: data
    title:
      en: 17. Personal data
      local: 17. Dados pessoais
    clauses:
      - id: data.1
        en: The Owner is the controller of the personal data of the Renter and drivers (names, contact details, ID and license details, copies of documents, vehicle photos and any tracker location data) under the GDPR and Law 58/2019. It uses them to provide this rental, check identity and license, meet legal duties (accounting, fines, police requests), handle claims and disputes, and protect the vehicle. It keeps them only as long as those purposes and the law require, keeps them secure and never sells them.
        local: O Locador é o responsável pelo tratamento dos dados pessoais do Locatário e dos condutores (nome, contactos, dados do documento e da carta, cópias de documentos, fotografias do veículo e eventual localização GPS) nos termos do Regulamento Geral sobre a Proteção de Dados (RGPD) e da Lei n.º 58/2019. Utiliza-os para prestar este aluguer, verificar a identidade e a carta, cumprir obrigações legais (contabilidade, coimas, pedidos da polícia), tratar sinistros e litígios e proteger o veículo. Conserva-os apenas pelo tempo que essas finalidades e a lei exigem, protege-os e nunca os vende.
        country: true
      - id: data.2
        en: "The Owner shares data only where needed: with insurers, repairers, the police, courts and the authorities that issue fines (a legal obligation), and with IT providers working for the Owner. The Renter may ask for access to, correction or deletion of, or a copy of their data, may object to processing based on the Owner's legitimate interests, and may complain to the National Data Protection Commission (CNPD)."
        local: "O Locador só comunica dados quando necessário: a seguradoras, oficinas, polícia, tribunais e autoridades que aplicam coimas (obrigação legal) e a prestadores informáticos que trabalham para si. O Locatário pode pedir o acesso, a retificação, o apagamento ou uma cópia dos seus dados, opor-se ao tratamento baseado no interesse legítimo do Locador e apresentar reclamação à Comissão Nacional de Proteção de Dados (CNPD)."
        country: true
  - id: general
    title:
      en: 18. General terms
      local: 18. Disposições gerais
    clauses:
      - id: general.1
        en: "Messages: notices under this agreement may be sent by phone, message app (such as WhatsApp), SMS or email to the contact details in sections 1 and 2. Messages, call logs and photos exchanged this way may be used as evidence of what was agreed."
        local: "Comunicações: as notificações deste contrato podem ser enviadas por telefone, aplicação de mensagens (como o WhatsApp), SMS ou correio eletrónico para os contactos das secções 1 e 2. As mensagens, registos de chamadas e fotografias trocados desta forma podem servir de prova do que foi acordado."
      - id: general.2
        en: "Force majeure: neither party is responsible for a delay or failure caused by events outside their control, such as natural disasters, storms, wildfires, government orders or ferry cancellations. Rent for days the vehicle could not be used because of such an event is agreed fairly between the parties."
        local: "Força maior: nenhuma das partes responde por atrasos ou incumprimentos causados por factos alheios ao seu controlo, como catástrofes naturais, tempestades, incêndios florestais, ordens das autoridades ou cancelamentos de ferries. O aluguer dos dias em que o veículo não pôde ser usado por esse motivo é acordado de forma justa entre as partes."
      - id: general.3
        en: "Whole agreement: this agreement, its annexes and any special conditions are the whole agreement. Changes are valid only in writing (a message from both parties is enough). If any part is found invalid, the rest still applies."
        local: "Contrato integral: este contrato, os seus anexos e as condições especiais constituem a totalidade do acordo. As alterações só são válidas por escrito (basta uma mensagem de ambas as partes). Se alguma parte for declarada inválida, o restante mantém-se em vigor."
      - id: general.4
        en: "Language: this agreement is written in English and Portuguese, and a Portuguese copy is always available, as the law requires. If the versions differ, the meaning more favorable to the Renter applies."
        local: "Língua: este contrato é redigido em inglês e em português, existindo sempre um exemplar em português, como a lei exige. Se as versões divergirem, prevalece o sentido mais favorável ao Locatário."
        country: true
      - id: general.5
        en: "Governing law: this agreement is governed by Portuguese law; disputes are decided by the competent courts in Portugal or a consumer arbitration center. A Renter who is a consumer living in another EU country may also sue where they live where EU law allows it."
        local: "Lei aplicável: este contrato rege-se pela lei portuguesa; os litígios são decididos pelos tribunais competentes em Portugal ou por um centro de arbitragem de conflitos de consumo. Um Locatário consumidor residente noutro país da UE pode também recorrer aos tribunais do seu domicílio, quando o direito da UE o permita."
        country: true
      - id: general.6
        if: special_terms
        en: "Special conditions agreed between the parties: {{special_terms}}"
        local: "Condições especiais acordadas entre as partes: {{special_terms}}"
      - id: general.7
        en: "Consumer rights: nothing in this agreement limits the rights a Renter who is a consumer has under mandatory consumer law, including the rules on unfair terms (Decree-Law 446/85 on general contract terms). The charges in this agreement are a genuine estimate of the Owner's loss and are never charged twice for the same loss. A dispute may also be taken to a consumer arbitration center."
        local: "Direitos do consumidor: nada neste contrato limita os direitos que a legislação imperativa de defesa do consumidor confere ao Locatário consumidor, incluindo as regras sobre cláusulas abusivas (Decreto-Lei n.º 446/85, das cláusulas contratuais gerais). Os encargos deste contrato são uma estimativa real do prejuízo do Locador e nunca são cobrados duas vezes pelo mesmo prejuízo. Os litígios podem também ser submetidos a um centro de arbitragem de conflitos de consumo."
        country: true
      - id: general.9_pt
        en: The Owner has a complaints book (Livro de Reclamações), also available online at livroreclamacoes.pt.
        local: O Locador dispõe de Livro de Reclamações, também disponível em formato eletrónico em livroreclamacoes.pt.
        country: true
      - id: general.8
        en: "Electronic signature: this agreement may be signed on paper or electronically; both have the same effect (Regulation (EU) No 910/2014 (eIDAS), Article 25)."
        local: "Assinatura eletrónica: este contrato pode ser assinado em papel ou eletronicamente; ambas as formas têm o mesmo efeito (Regulamento (UE) n.º 910/2014 (eIDAS), artigo 25.º)."
  - id: signatures
    title:
      en: Signatures
      local: Assinaturas
    signature: true
    clauses:
      - id: signatures.1
        en: By signing, the parties confirm they have read and understood this agreement, including Annexes A and B, and agree to it. The Renter confirms they received a copy.
        local: Ao assinar, as partes confirmam que leram e compreenderam este contrato, incluindo os Anexos A e B, e que o aceitam. O Locatário confirma que recebeu uma cópia.
    sign_rows:
      - en: Owner (name, signature, date)
        local: Locador (nome, assinatura, data)
      - en: Renter (name, signature, date)
        local: Locatário (nome, assinatura, data)
      - en: Additional driver (name, signature, date)
        local: Condutor adicional (nome, assinatura, data)
  - id: annex_a
    title:
      en: "Annex A: Handover and return check"
      local: "Anexo A: Verificação na entrega e na devolução"
    page_break: true
    checklist: true
    clauses:
      - id: annex_a.1
        en: Mark existing scratches (S), dents (D), cracks (C) and missing items (M). Take dated photos of all four sides, the dashboard (odometer and fuel), the interior and any damage, at both handover and return.
        local: Assinale riscos (R), mossas (M), fissuras (F) e elementos em falta (X). Tire fotografias datadas dos quatro lados, do painel (quilometragem e combustível), do interior e de quaisquer danos, na entrega e na devolução.
    check_rows:
      - en: Odometer
        local: Quilometragem
      - en: Fuel / battery level
        local: Nível de combustível / bateria
      - en: "Body: front / rear / left / right"
        local: "Carroçaria: frente / traseira / esquerda / direita"
      - en: Windscreen, glass, mirrors and lights
        local: Para-brisas, vidros, espelhos e luzes
      - en: Tires and wheels
        local: Pneus e jantes
      - en: Interior and seats
        local: Interior e bancos
      - en: Keys, documents, warning triangle, vest
        local: Chaves, documentos, triângulo, colete
      - en: Helmets / child seat / accessories
        local: Capacetes / cadeira de criança / acessórios
      - en: Photos taken (number)
        local: Fotografias tiradas (número)
      - en: Owner's and Renter's initials
        local: Rubricas do Locador e do Locatário
