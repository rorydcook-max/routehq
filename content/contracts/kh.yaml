- id: annex_a
  title:
    en: 'Annex A: Handover and return check'
    local: ឧបសម្ព័ន្ធ ក៖ ការត្រួតពិនិត្យពេលប្រគល់ និងពេលទទួលត្រឡប់
  page_break: true
  checklist: true
  clauses:
  - id: annex_a.1
    en: Mark existing scratches (S), dents (D), cracks (C) and missing items (M). Take photos of all four sides, the dashboard (odometer and fuel), the interior and any damage, at both handover and return.
    local: សម្គាល់ស្នាមឆូត (S) ស្នាមផត (D) ស្នាមប្រេះ (C) និងរបស់ដែលបាត់ (M) ដែលមានស្រាប់។ ថតរូបទាំងបួនជ្រុង ផ្ទាំងបង្ហាញ (លេខគីឡូម៉ែត្រ និងប្រេង) ផ្នែកខាងក្នុង និងការខូចខាតណាមួយ ទាំងពេលប្រគល់ និងពេលទទួលត្រឡប់។
