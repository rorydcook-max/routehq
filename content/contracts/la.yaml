sources:
- url: https://www.constituteproject.org/constitution/Laos_2015
  supports: 'Constitution of the Lao PDR (2015), Article 110: Lao language and script are the official language and script (basis for Lao prevailing).'
- url: https://www.dfdl.com/insights/legal-and-tax-updates/lao-pdr-legal-update-lao-pdr-enacts-civil-code/
  supports: Civil Code No. 55/NA (adopted 6 Dec 2018, in force 26 May 2020) replaced the Law on Contract and Tort (2008) and other civil laws; it now governs contracts.
- url: https://kpl.gov.la/En/detail.aspx?id=25138
  supports: 'Lao News Agency (KPL): Law on Land Traffic (endorsed 17 Jan 2013), Article 18: driver and front-seat passenger of 4+ wheel vehicles must wear seatbelts; children who cannot use normal seatbelts need suitable seats.'
- url: https://kpl.gov.la/En/detail.aspx?id=97786
  supports: 'Lao News Agency (KPL), traffic police 2026: motorcycle riders and passengers must wear helmets; car occupants must wear seatbelts; drivers must carry licence, vehicle registration, technical inspection certificate, road tax receipt and insurance papers.'
- url: https://laotradeportal.gov.la/en-gb/site/display/2475
  supports: 'Land Transport Law No. 04/NA (16 Nov 2021), Article 29: all land vehicles used in the Lao PDR must be registered.'
- url: https://conventuslaw.com/report/amended-law-on-insurance-in-laos/
  supports: 'Amended Law on Insurance (gazetted 30 Mar 2020, in force 15 Apr 2020): motorised land vehicles are on the compulsory third-party liability insurance list; sanctions not clearly specified.'
- url: https://treatydatabase.overheid.nl/en/Treaty/Details/007193_p
  supports: Laos acceded to the 1949 Geneva Convention on Road Traffic (6 Mar 1959), the convention behind the 1949-type International Driving Permit.
- url: https://www.gov.uk/foreign-travel-advice/laos/safety-and-security
  supports: 'UK FCDO: drivers need a 1949 IDP plus their national licence; police may stop cars and ask for ID; drivers may have to pay third-party compensation even if not at fault; Lao insurers cover a small share of costs; do not leave a passport as a deposit when hiring motorbikes.'
- url: https://travel.state.gov/content/travel/en/international-travel/International-Travel-Country-Information-Pages/Laos.html
  supports: 'US State Department: never provide your passport as collateral for rentals; drivers in an accident should remain at the scene and contact the rental company and its insurer.'
- url: https://www.smartraveller.gov.au/destinations/asia/laos
  supports: 'Australian Smartraveller: get an IDP before travel; always wear a helmet; police may fine or detain people who do not show ID; reports of motorbike hire scams over existing damage.'
- url: https://www.gov.uk/foreign-travel-advice/laos/getting-help
  supports: 'UK FCDO emergency numbers for Laos: police 1191, ambulance 1195, fire 1190.'
- url: https://www.multilaw.com/Multilaw/Data_Protection_Laws_Guide/DataProtection_Guide_Laos.aspx
  supports: 'Law on Electronic Data Protection No. 25/NA (12 May 2017): consent needed for sensitive data and for transfer of data abroad; data subjects have access, correction and deletion rights; Civil Code recognises privacy.'
- url: https://laotradeportal.gov.la/en-gb/site/display/596
  supports: 'GMS Cross-Border Transport Facilitation Agreement (Laos, Thailand, Viet Nam): vehicles in international traffic are subject to registration, temporary-importation and permit rules.'
- url: https://aseancob.org/coverage-and-blue-card
  supports: 'ASEAN Compulsory Motor Insurance (Blue Card) system for cross-border vehicles covers Laos, Thailand and Cambodia: separate cross-border insurance is needed.'
